<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>포천아트밸리 키오스크 경로안내 시스템</title>
  <style>
    :root {
      --accent-red: #ff3b30;   /* 기본 경로 A (Red Neon) */
      --accent-blue: #0088ff;  /* 대안 경로 B (Blue Neon) */
      --glow-red: rgba(255, 59, 48, .75);
      --glow-blue: rgba(0, 136, 255, .75);
      --panel-bg: #12161c;
      --panel-bg2: #1b212b;
      --ink: #eef1f6;
      --muted: #8993a4;
      --btn: #232b37;
      --btn-active: #2d3745;
      
      --start-pin: #3ba7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; background: #05070a; color: var(--ink);
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: none;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }

    body { display: flex; align-items: center; justify-content: center; }

    .kiosk-frame {
      width: 100vw; height: 100vh; height: 100dvh; background: var(--panel-bg);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
    }

    @media (min-width: 900px) and (min-height: 700px) {
      .kiosk-frame {
        width: min(100vw, 540px); height: min(100vh, 960px);
        border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7), 0 0 0 1px #232b37;
      }
    }

    /* ① 상단 제목 영역 */
    .header-zone {
      flex: none; padding: 2.5vh 20px 1.5vh; text-align: center;
      background: linear-gradient(180deg, #12161c, #161a22);
      border-bottom: 1px solid #1c222c;
    }
    .main-title { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 4px; letter-spacing: -0.02em; }
    .sub-title { font-size: 14px; font-weight: 500; color: #8993a4; }

    /* ── 지도 영역 (3337 x 2101 고화질 비율) ── */
    .map-zone {
      position: relative; width: 100%; flex: none; aspect-ratio: 3337 / 2101;
      background: #060a0e; overflow: hidden;
    }
    .map-zone svg { width: 100%; height: 100%; display: block; transition: none; }

    /* ── 경로선 스타일 (빨간 경로 & 파란 경로 동시 표출 지원) ── */
    .route-path {
      fill: none; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round;
      opacity: 0;
    }
    .route-path.path-red { stroke: var(--accent-red); filter: drop-shadow(0 0 14px var(--glow-red)); }
    .route-path.path-blue { stroke: var(--accent-blue); filter: drop-shadow(0 0 14px var(--glow-blue)); }
    .route-path.visible { opacity: 1; }
    .route-path.flowing { stroke-dasharray: 30 16; animation: dashflow 0.5s linear infinite; }
    @keyframes dashflow { to { stroke-dashoffset: -138; } }

    .route-overlay {
      fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round;
      opacity: 0; stroke-dasharray: 18 28;
    }
    .route-overlay.flowing { opacity: .95; animation: dashflow-white 0.6s linear infinite; }
    @keyframes dashflow-white { to { stroke-dashoffset: -138; } }

    .guide-line { fill: none; stroke: #ffd400; stroke-width: 6; stroke-dasharray: 8 10; opacity: .85; }
    .edit-dot { fill: #ffd400; stroke: #1a1a1a; stroke-width: 3; }
    .edit-dot-num { fill: #111; font-size: 22px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }

    /* ── 핀 공통 ── */
    .pin { filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .8)); }
    .pin-label { fill: #fff; font-weight: 800; font-size: 24px; }
    .pin-label.shadow { stroke: #000; stroke-width: 5; stroke-linejoin: round; paint-order: stroke; opacity: 0.9; }
    
    /* 현위치 핀 (파랑 펄스 애니메이션) */
    .pin-start circle.outer { fill: var(--start-pin); stroke: #fff; stroke-width: 5; }
    .pin-start circle.pulse { fill: rgba(59, 167, 255, .45); stroke: none; animation: startPulse 2s ease-in-out infinite; }
    @keyframes startPulse { 0%, 100% { r: 22; opacity: .5; } 50% { r: 52; opacity: 0; } }

    /* 목적지 핀 (펄스 마커 링) */
    .pin-dest circle.dest-glow { fill: rgba(255, 59, 48, .4); animation: destPulse 1.6s ease-in-out infinite; }
    .pin-dest circle.dest-core { fill: var(--accent-red); stroke: #fff; stroke-width: 5; }
    .pin-dest circle.dest-center { fill: #fff; }
    .pin-dest { opacity: 0; transform-origin: center; }
    .pin-dest.show { opacity: 1; animation: pinPop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes destPulse { 0%, 100% { r: 26; opacity: .6; } 50% { r: 60; opacity: 0; } }

    @keyframes pinPop {
      0% { transform: scale(.2); opacity: 0; }
      70% { transform: scale(1.25); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── 동시 주행 화살표들 ── */
    .flow-arrow { visibility: hidden; }
    .flow-arrow path { fill: #fff; stroke-width: 4; filter: drop-shadow(0 0 10px rgba(255, 255, 255, .9)); }
    .flow-arrow.arrow-red path { stroke: var(--accent-red); }
    .flow-arrow.arrow-blue path { stroke: var(--accent-blue); }

    /* ── 조작 영역 ── */
    .control-zone {
      background: linear-gradient(180deg, var(--panel-bg2), #0c0f14);
      padding: 16px 14px 10px; display: flex; flex-direction: column; gap: 8px;
      overflow: auto; flex: 1 1 0;
    }
    .hint { font-size: 17px; color: var(--muted); line-height: 1.5; min-height: 48px; margin-bottom: 2px; text-align: center; }
    .hint b { color: #ffd400; }

    /* 경로 범례 뱃지 */
    .route-legend {
      display: none; justify-content: center; align-items: center; gap: 12px;
      padding: 8px 12px; background: rgba(0, 0, 0, 0.4); border-radius: 12px; border: 1px solid #2c3646;
    }
    .route-legend.show { display: flex; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .legend-dot.red { background: var(--accent-red); box-shadow: 0 0 8px var(--glow-red); }
    .legend-dot.blue { background: var(--accent-blue); box-shadow: 0 0 8px var(--glow-blue); }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .dest-btn {
      background: var(--btn); border: 1px solid #2c3646; color: var(--ink);
      border-radius: 16px; padding: 18px 8px; font-size: 19px; font-weight: 700;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; transition: transform .12s, background .15s, border-color .15s;
    }
    .dest-btn .ico { font-size: 28px; }
    .dest-btn:active { transform: scale(.96); }
    .dest-btn.active { background: var(--btn-active); border-color: var(--accent-red); box-shadow: 0 0 0 1px var(--accent-red) inset; }
    .dest-btn.editing { border-color: #ffd400; box-shadow: 0 0 0 1px #ffd400 inset; }

    .reset-row { display: flex; gap: 6px; margin-top: 2px; }
    .reset-row button { flex: 1; background: #1a2028; border: 2px solid #2c3646; color: var(--muted); border-radius: 12px; padding: 14px 10px; font-size: 15px; font-weight: 700; cursor: pointer; }

    /* ── 관리자 바 ── */
    #secretZone { position: absolute; bottom: 0; right: 0; width: 80px; height: 80px; z-index: 9999; }
    .admin-bar { flex-shrink: 0; display: none; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 8px; padding: 12px 12px; background: #05070a; border-top: 1px solid #1c222c; }
    .admin-bar.show { display: flex; }
    .admin-bar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .admin-bar .title { font-size: 14px; font-weight: 600; color: #5c6675; }
    .admin-bar .title b { color: #8993a4; font-weight: 700; }
    .admin-bar .status { font-size: 13px; color: #5c6675; opacity: 0; transition: opacity .2s; }
    .admin-bar .status.show { opacity: 1; color: #ffd400; }
    .mode-toggle { font-size: 14px; border: 1px solid #3a4454; background: #12161c; color: var(--ink); padding: 8px 14px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .mode-toggle.on { background: var(--accent-red); border-color: var(--accent-red); color: #1a0500; font-weight: 700; }
    .close-admin { background: none; border: 1px solid #3a4454; color: #8993a4; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }

    .start-bar-label { font-size: 13px; color: #5c6675; padding: 2px 4px 0; font-weight: 600; }
    .start-btn { background: var(--btn); border: 1px solid #2c3646; color: var(--ink); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: border-color .15s, background .15s; }
    .start-btn.active { background: var(--btn-active); border-color: #3ba7ff; box-shadow: 0 0 0 1px #3ba7ff inset; color: #7dd3ff; }

    .edit-toolbar { display: none; gap: 6px; flex-wrap: wrap; margin-top: 8px; width: 100%; }
    .edit-toolbar.show { display: flex; }
    .edit-toolbar button { flex: 1; background: #232b37; border: 1px solid #3a4454; color: var(--ink); border-radius: 8px; padding: 8px 4px; font-size: 11px; cursor: pointer; font-weight: 600;}
    .edit-toolbar button:hover { border-color: #ffd400; }
    .edit-toolbar button.active { border-color: #ffd400; color: #ffd400; }

    #exportArea { display: none; width: 100%; height: 110px; background: #0a0d12; color: #8fd18f; font-family: ui-monospace, monospace; font-size: 10px; border: 1px solid #2c3646; border-radius: 8px; padding: 6px; resize: none; margin-top: 8px; }
    #exportArea.show { display: block; }
  </style>
</head>

  <div class="kiosk-frame">
    <div id="secretZone"></div>

    <!-- ① 상단 헤더 -->
    <div class="header-zone">
      <div class="main-title">포천아트밸리 길찾기</div>
      <div class="sub-title">현재 위치에서 목적지까지 최적 경로를 안내합니다</div>
    </div>

    <!-- ② 고화질 지도 영역 (3337 x 2101) -->
    <div class="map-zone">
      <svg id="mapSvg" viewBox="0 0 3337 2101" preserveAspectRatio="xMidYMid meet">
        <defs>
          <clipPath id="mapClip">
            <rect x="0" y="0" width="3337" height="2101" />
          </clipPath>
        </defs>
        <image id="baseImg" href="아트밸리_전경도_안내_v2.jpg" x="0" y="0" width="3337" height="2101" clip-path="url(#mapClip)"
          preserveAspectRatio="xMidYMid meet" draggable="false" />

        <g id="routesLayer"></g>
        <g id="overlayLayer"></g>
        <g id="arrowsLayer"></g>
        
        <!-- 목적지 영역 -->
        <g id="destPins"></g>
        
        <!-- 에디터 가이드 영역 -->
        <g id="editDots"></g>

        <!-- 현위치 핀 -->
        <g class="pin pin-start" id="startPin">
          <circle class="pulse" r="22" />
          <circle class="outer" r="20" />
          <text class="pin-label shadow" x="0" y="-32" text-anchor="middle">현위치</text>
          <text class="pin-label" x="0" y="-32" text-anchor="middle">현위치</text>
        </g>
      </svg>
    </div>

    <!-- ③ 방문객 주 조작 영역 -->
    <div class="control-zone">
      <div class="hint" id="hintText">보고 싶은 곳을 눌러보세요.<br>경로를 선택하면 <b>동시 다중 경로</b>가 선명하게 안내됩니다!</div>

      <!-- 경로 범례 (복수 경로일 때 자동 노출) -->
      <div class="route-legend" id="routeLegend">
        <div class="legend-item" id="legendRed"><span class="legend-dot red"></span><span id="legendRedText">보행로 코스</span></div>
        <div class="legend-item" id="legendBlue"><span class="legend-dot blue"></span><span id="legendBlueText">계단/모노레일 코스</span></div>
      </div>

      <div class="btn-grid" id="mainGrid">
        <button class="dest-btn" data-route="lake"><span class="ico">🏞️</span>천주호 가는 길</button>
        <button class="dest-btn" data-route="cafe"><span class="ico">☕</span>카페 가는 길</button>
        <button class="dest-btn" data-route="mono"><span class="ico">🚡</span>모노레일 타는 곳</button>
        <button class="dest-btn" data-route="forest"><span class="ico">🌲</span>힐링숲 산책로</button>
      </div>

      <div class="reset-row" id="previewReset"><button id="stopBtn">🔎 전체보기 / 안내 멈추기</button></div>

      <div class="edit-toolbar" id="editToolbar">
        <button id="addPathBtn">+ 경로 추가</button>
        <button id="undoPoint">↩ 취소</button>
        <button id="clearRoute">🗑 경로 초기화</button>
        <button id="exportJson">⇩ 내보내기</button>
      </div>
      
      <textarea id="exportArea" readonly></textarea>
    </div>

    <!-- ④ 관리자 바 -->
    <div class="admin-bar">
      <div class="admin-bar-group">
        <div class="title">포천아트밸리 <b>길찾기 안내</b> · 관리자</div>
        <span class="status" id="zoomBadge">🔍 확대 중</span>
        <button class="mode-toggle" id="modeToggle">🖊 경로 제작 모드</button>
      </div>

      <div class="admin-bar-group" id="startBar">
        <div class="start-bar-label">시작 위치</div>
        <button class="start-btn" data-start="ticket"><span class="ico">🎫</span>매표소</button>
        <button class="start-btn" data-start="astro"><span class="ico">🔭</span>천문과학관</button>
        <button class="start-btn" data-start="info"><span class="ico">ℹ️</span>관광정보센터</button>
        <button class="close-admin" id="closeAdminBtn">✖ 닫기</button>
      </div>
    </div>
  </div>

      const pathname = decodeURIComponent(window.location.pathname);
      let defaultStart = 'astro';

      else if (pathname.includes('관광정보센터') || pathname.includes('정보센터')) defaultStart = 'info';
      else if (pathname.includes('천문과학관')) defaultStart = 'astro';

      // ── 애니메이션 & 줌 (모든 복수 경로를 한 화면에 자동 포커스) ──
      function animateViewBox(target, duration = 600) {
        if (zoomAnim) cancelAnimationFrame(zoomAnim);
        const start = { ...currentVB };
        const startTime = performance.now();
        function ease(t) { return t < .5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1; }
        function step(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const e = ease(t);
          currentVB.x = start.x + (target.x - start.x) * e; currentVB.y = start.y + (target.y - start.y) * e;
          currentVB.w = start.w + (target.w - start.w) * e; currentVB.h = start.h + (target.h - start.h) * e;
          svg.setAttribute('viewBox', `${currentVB.x} ${currentVB.y} ${currentVB.w} ${currentVB.h}`);
          if (t < 1) zoomAnim = requestAnimationFrame(step);
          else zoomAnim = null;
        }
        zoomAnim = requestAnimationFrame(step);
      }

      function zoomToAllRoutes(destKey) {
        const routes = getDestRoutes(destKey);
        if (!routes || routes.length === 0) { zoomToFull(); return; }
        
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        routes.forEach(rt => {
          rt.points.forEach(([x, y]) => {
            if (x < minX) minX = x; if (y < minY) minY = y;
            if (x > maxX) maxX = x; if (y > maxY) maxY = y;
          });
        });
        
        if (minX === Infinity) { zoomToFull(); return; }

        let vx = minX - ZOOM_PADDING, vy = minY - ZOOM_PADDING;
        let vw = (maxX - minX) + ZOOM_PADDING * 2, vh = (maxY - minY) + ZOOM_PADDING * 2;
        const minDim = 850;
        if (vw < minDim) { const d = minDim - vw; vx -= d / 2; vw = minDim; }
        if (vh < minDim) { const d = minDim - vh; vy -= d / 2; vh = minDim; }
        const mapZone = document.querySelector('.map-zone');
        const aspect = mapZone.clientWidth / mapZone.clientHeight;
        const vbAspect = vw / vh;
        if (vbAspect > aspect) vh = vw / aspect; else vw = vh * aspect;
        if (vx < 0) vx = 0; if (vy < 0) vy = 0;
        if (vx + vw > 3337) vx = 3337 - vw; if (vy + vh > 2101) vy = 2101 - vh;
        animateViewBox({ x: vx, y: vy, w: vw, h: vh }, 700);
        zoomBadge.classList.add('show');
      }

      function zoomToFull() { animateViewBox({ ...FULL_VB }, 500); zoomBadge.classList.remove('show'); }

      // ── 렌더링 ──
      function updateStartPin() {
        const [x, y] = getStart();
        const pin = document.getElementById('startPin');
        pin.setAttribute('transform', `translate(${x},${y})`);
        startBtns.forEach(b => b.classList.toggle('active', b.dataset.start === currentStartKey));
      }

      function smoothPath(pts) {
        if (pts.length < 2) return '';
        if (pts.length === 2) return `M ${pts[0][0]},${pts[0][1]} L ${pts[1][0]},${pts[1][1]}`;
        let d = `M ${pts[0][0]},${pts[0][1]} `;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
          d += `C ${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]} `;
        }
        return d.trim();
      }

      /* ── 핵심: 모든 복수 경로 및 다중 화살표를 한 번에 생성하고 동시 주행 ── */
      function renderAllPathsForDest(destKey) {
        routesLayer.innerHTML = ''; overlayLayer.innerHTML = ''; arrowsLayer.innerHTML = ''; destPinsLayer.innerHTML = '';
        const routes = getDestRoutes(destKey);
        if (!routes || routes.length === 0) return;

        let destPos = null;

        routes.forEach((rt, idx) => {
          if (!rt.points || rt.points.length < 2) return;
          const d = smoothPath(rt.points);
          const isBlue = rt.color === 'blue';
          const pathId = `active-route-${idx}`;
          const overlayId = `active-overlay-${idx}`;

          // 1. 메인 발광 라인
          const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          pathEl.setAttribute('id', pathId);
          pathEl.setAttribute('class', `route-path ${isBlue ? 'path-blue' : 'path-red'}`);
          pathEl.setAttribute('d', d);
          routesLayer.appendChild(pathEl);

          // 2. 내부 화이트 흐르는 오버레이
          const overlayEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          overlayEl.setAttribute('id', overlayId);
          overlayEl.setAttribute('class', 'route-overlay');
          overlayEl.setAttribute('d', d);
          overlayLayer.appendChild(overlayEl);

          // 3. 각 경로별 동시 주행 화살표
          const arrowGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          arrowGroup.setAttribute('id', `flow-arrow-${idx}`);
          arrowGroup.setAttribute('class', `flow-arrow ${isBlue ? 'arrow-blue' : 'arrow-red'}`);
          arrowGroup.innerHTML = `<path d="M -30,-16 L 28,0 L -30,16 L -14,0 Z"></path>`;
          
          const motionEl = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
          motionEl.setAttribute('dur', `${2.5 + idx * 0.3}s`);
          motionEl.setAttribute('repeatCount', 'indefinite');
          motionEl.setAttribute('rotate', 'auto');
          
          const mp = document.createElementNS('http://www.w3.org/2000/svg', 'mpath');
          mp.setAttributeNS('http://www.w3.org/1999/xlink', 'href', `#${pathId}`);
          motionEl.appendChild(mp);
          arrowGroup.appendChild(motionEl);
          arrowsLayer.appendChild(arrowGroup);

          destPos = rt.points[rt.points.length - 1];
        });

        // 4. 목적지 도착 핀 (최종 지점 펄스 마커 링)
        if (destPos) {
          const destPin = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          destPin.setAttribute('id', 'active-dest-pin');
          destPin.setAttribute('class', 'pin pin-dest');
          destPin.setAttribute('transform', `translate(${destPos[0]},${destPos[1]})`);
          destPin.innerHTML = `
            <circle class="dest-glow" r="28"></circle>
            <circle class="dest-core" r="18"></circle>
            <circle class="dest-center" r="7"></circle>
          `;
          destPinsLayer.appendChild(destPin);
        }
      }

      function resetPreview() {
        clearTimeout(animTimer);
        routesLayer.innerHTML = ''; overlayLayer.innerHTML = ''; arrowsLayer.innerHTML = ''; destPinsLayer.innerHTML = '';
        destBtns.forEach(b => b.classList.remove('active'));

        routeLegend.classList.remove('show');

      function playDestination(destKey) {
        if (editMode) return;
        clearTimeout(animTimer);
        const routes = getDestRoutes(destKey);
        if (!routes || routes.length === 0) {
          setHint(`경로가 없습니다. 관리자 제작 모드에서 등록해 주세요.`); return;
        }

        activeDestKey = destKey;
        renderAllPathsForDest(destKey);
        zoomToAllRoutes(destKey);

        // UI 범례 및 안내 힌트 갱신
        if (routes.length >= 2) {
          routeLegend.classList.add('show');
          legendRedText.textContent = routes[0]?.name || '기본 경로';
          legendBlue.style.display = 'flex';
          legendBlueText.textContent = routes[1]?.name || '대안 경로';
          setHint(`<b>${ROUTE_LABELS[destKey]}</b> 가는 2가지 경로를 동시에 안내합니다.<br>원하시는 코스(🔴 / 🔵)를 선택해 이동하세요!`);
        } else {
          routeLegend.classList.add('show');
          legendRedText.textContent = routes[0]?.name || '추천 경로';
          legendBlue.style.display = 'none';
          setHint(`<b>${ROUTE_LABELS[destKey]} (${routes[0]?.name || '추천 경로'})</b> 코스를 안내합니다.`);
        }

        // 경로선 드로잉 및 다중 화살표 동시 주행 발동
        animTimer = setTimeout(() => {
          routes.forEach((rt, idx) => {
            const path = document.getElementById(`active-route-${idx}`);
            const overlay = document.getElementById(`active-overlay-${idx}`);
            const arrow = document.getElementById(`flow-arrow-${idx}`);
            if (!path) return;

            const L = path.getTotalLength();
            path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
            path.classList.add('visible'); path.getBoundingClientRect();
            const dur = Math.min(2200, Math.max(700, L * 1.2));
            path.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(.3,.6,.2,1)`;
            requestAnimationFrame(() => { path.style.strokeDashoffset = 0; });

            setTimeout(() => {
              path.classList.add('flowing');
              overlay.classList.add('flowing');
              if (arrow) arrow.style.visibility = 'visible';
              document.getElementById('active-dest-pin')?.classList.add('show');
            }, dur);
          });
        }, 500);
      }

      function toSvg(evt) {
        const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        return [Math.round(p.x), Math.round(p.y)];
      }

      function enterEditRoute(destKey, pathIndex) {
        if (!destKey) return;
        editingDestKey = destKey; editingPathIndex = pathIndex;

      }

      function renderEditPathButtons() {
        if (!editingDestKey) return;
        const routes = getDestRoutes(editingDestKey);
        const container = document.getElementById('editToolbar');
        container.querySelectorAll('.path-tab').forEach(el => el.remove());
        
        routes.forEach((rt, idx) => {
          const b = document.createElement('button');
          b.className = 'path-tab' + (idx === editingPathIndex ? ' active' : '');
          b.textContent = `${rt.name} 수정`;
          b.onclick = () => enterEditRoute(editingDestKey, idx);
          container.insertBefore(b, document.getElementById('addPathBtn'));
        });
      }

      function redrawEditGuide() {
        editDotsLayer.innerHTML = '';
        if (!editingDestKey) return;
        const pts = getDestRoutes(editingDestKey)[editingPathIndex]?.points;
        if (!pts) return;
        if (pts.length > 1) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
          line.setAttribute('class', 'guide-line');
          line.setAttribute('points', pts.map(p => p.join(',')).join(' '));
          editDotsLayer.appendChild(line);
        }
        pts.forEach((p, i) => {
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('transform', `translate(${p[0]},${p[1]})`);
          g.innerHTML = `<circle class="edit-dot" r="18"></circle><text class="edit-dot-num" y="1">${i}</text>`;
          editDotsLayer.appendChild(g);
        });
      }

      svg.addEventListener('click', (evt) => {
        if (!editMode) return;
        const [x, y] = toSvg(evt);
        if (editingDestKey) {
          const pts = getDestRoutes(editingDestKey)[editingPathIndex].points;
          pts.push([x, y]);
          redrawEditGuide();
          renderAllPathsForDest(editingDestKey);
        }
      });

      document.getElementById('undoPoint').addEventListener('click', () => {
        if (!editingDestKey) return;
        const pts = getDestRoutes(editingDestKey)[editingPathIndex].points;
        if (pts.length > 1) pts.pop();
        redrawEditGuide(); renderAllPathsForDest(editingDestKey);
      });

      document.getElementById('clearRoute').addEventListener('click', () => {
        if (!editingDestKey) return;
        getDestRoutes(editingDestKey)[editingPathIndex].points = [getStart().slice()];
        redrawEditGuide(); renderAllPathsForDest(editingDestKey);
      });

      document.getElementById('addPathBtn').addEventListener('click', () => {
        if (!editingDestKey) return;
        const routes = getDestRoutes(editingDestKey);
        const newColor = routes.length % 2 === 0 ? 'red' : 'blue';
        routes.push({ id: `${editingDestKey}_${routes.length}`, name: `경로 ${routes.length + 1}`, color: newColor, points: [getStart().slice()] });
        enterEditRoute(editingDestKey, routes.length - 1);
      });

      document.getElementById('exportJson').addEventListener('click', () => {
        exportArea.classList.toggle('show');
        if (exportArea.classList.contains('show')) {
          const out = { startPresets: START_PRESETS, currentStart: currentStartKey, ALL_ROUTES };
          exportArea.value = JSON.stringify(out, null, 2); exportArea.select();
        }
      });

      modeToggleBtn.addEventListener('click', () => {
        editMode = !editMode;
        modeToggleBtn.classList.toggle('on', editMode);
        modeToggleBtn.textContent = editMode ? '✅ 제작 모드 ON' : '🖊 경로 제작 모드';
        editToolbar.classList.toggle('show', editMode);
        previewReset.style.display = editMode ? 'none' : 'flex';
        exportArea.classList.remove('show');
        
        if (editMode) {
          resetPreview();
          setHint(`[관리자] 목적지를 누르면 경로를 편집할 수 있습니다.`);
        } else {
          editingDestKey = null; editDotsLayer.innerHTML = '';
          destBtns.forEach(b => b.classList.remove('editing'));
          zoomToFull(); routesLayer.innerHTML=''; overlayLayer.innerHTML=''; arrowsLayer.innerHTML='';
          setHint('보고 싶은 곳을 눌러보세요.<br>경로를 선택하면 <b>동시 다중 경로</b>가 선명하게 안내됩니다!');
        }
      });

      // ── 초기화 ──
      updateStartPin();

      /* ── 키오스크 하드닝 ── */
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('dragstart', e => e.preventDefault());
      let lastTouchEnd = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault(); 
        lastTouchEnd = now;
      }, { passive: false });

      let secretTaps = 0, secretTimer = null;
      document.getElementById('secretZone').addEventListener('pointerdown', () => {
        secretTaps++; clearTimeout(secretTimer);
        secretTimer = setTimeout(() => { secretTaps = 0; }, 2000);
        if (secretTaps >= 5) {
          secretTaps = 0;
          document.querySelector('.admin-bar').classList.add('show');
          document.getElementById('secretZone').style.display = 'none';
        }
      });

      const IDLE_RESET_MS = 20000;
      let idleTimer = null;
      function armIdleReset() {
        clearTimeout(idleTimer);
        if (editMode) return;
        idleTimer = setTimeout(() => {
          resetPreview();
          setHint('보고 싶은 곳을 눌러보세요.<br>경로를 선택하면 <b>동시 다중 경로</b>가 선명하게 안내됩니다!');
        }, IDLE_RESET_MS);
      }
      
      const _playDestination = playDestination;
      playDestination = function (key) { _playDestination(key); armIdleReset(); };
      
      document.addEventListener('pointerdown', armIdleReset, { passive: true });
      
      document.getElementById('closeAdminBtn').addEventListener('click', () => {
        document.querySelector('.admin-bar').classList.remove('show');
        document.getElementById('secretZone').style.display = 'block';
        if (editMode) document.getElementById('modeToggle').click();
      });
    })();
  </script>
</body>
</html>
