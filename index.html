<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>포천아트밸리 키오스크 경로안내 시스템</title>
  <style>
    :root {
      --accent-red: #ff3b30;
      /* 기본 보행로 경로 A (Red Neon) */
      --accent-blue: #0088ff;
      /* 대안/모노레일 경로 B (Blue Neon) */
      --accent-green: #00e676;
      /* 힐링 숲 산책로 경로 C (Emerald Green Neon) */
      --glow-red: rgba(255, 59, 48, .85);
      --glow-blue: rgba(0, 136, 255, .85);
      --glow-green: rgba(0, 230, 118, .85);
      --panel-bg: #12161c;
      --panel-bg2: #1b212b;
      --ink: #eef1f6;
      --muted: #8993a4;
      --btn: #232b37;
      --btn-active: #2d3745;

      --start-pin: #00a2ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      inset: 0;
      background: #05070a;
      color: var(--ink);
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      overflow: hidden !important;
      overscroll-behavior: none;
      -webkit-text-size-adjust: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kiosk-frame {
      width: 100%;
      max-width: 560px;
      height: 100%;
      max-height: 100dvh;
      background: var(--panel-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 0;
      box-shadow: none;
    }

    @media (min-width: 600px) and (min-height: 750px) {
      .kiosk-frame {
        height: min(100vh - 20px, 960px);
        border-radius: 20px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8), 0 0 0 1px #232b37;
      }
    }

    /* ① 상단 제목 영역 */
    .header-zone {
      flex: none;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: linear-gradient(180deg, #141a24, #0f131a);
      border-bottom: 1px solid #1f2735;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-logo {
      position: absolute;
      left: 12px;
      top: 12px;
      height: 22px;
      max-width: 75px;
      object-fit: contain;
      opacity: 0.88;
      filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.5));
    }

    .main-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin: 0;
      color: #ffffff;
      background: linear-gradient(180deg, #ffffff 30%, #b3d7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 12px rgba(0, 136, 255, 0.4));
      text-align: center;
    }

    .main-title .point-text {
      color: #ffd400;
      background: linear-gradient(180deg, #fff380 20%, #ffb800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── 지도 영역 (3337 x 2101 고화질 비율) ── */
    .map-zone {
      position: relative;
      width: 100%;
      flex: none;
      aspect-ratio: 3337 / 2101;
      background: #060a0e;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .map-zone.panning {
      cursor: grabbing;
    }

    .map-zone svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: none;
    }

    /* 지도 플로팅 줌 컨트롤러 (정량적 줌) */
    .map-zoom-controls {
      position: absolute;
      right: 12px;
      top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }

    .map-zoom-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(18, 22, 28, 0.88);
      border: 1px solid #3a4454;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.15s, transform 0.1s;
    }

    .map-zoom-btn:active {
      background: var(--btn-active);
      transform: scale(0.92);
    }

    /* ── 경로선 스타일 (빨간 경로 & 파란 경로 & 초록 숲길 경로) ── */
    .route-path {
      fill: none;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    .route-path.path-red {
      stroke: var(--accent-red);
      filter: drop-shadow(0 0 16px var(--glow-red));
    }

    .route-path.path-blue {
      stroke: var(--accent-blue);
      filter: drop-shadow(0 0 16px var(--glow-blue));
    }

    .route-path.path-green {
      stroke: var(--accent-green);
      filter: drop-shadow(0 0 16px var(--glow-green));
    }

    .route-path.visible {
      opacity: 1;
    }

    /* 메인 선은 언제나 꽉 찬 솔리드 실선으로 유지 (색상 끊김/공백 원천 방지) */

    .route-overlay {
      fill: none;
      stroke: #ffffff;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      stroke-dasharray: 20 32;
    }

    .route-overlay.flowing {
      opacity: 0.95;
      animation: dashflow-white 0.7s linear infinite;
    }

    @keyframes dashflow-white {
      to {
        stroke-dashoffset: -156;
      }
    }

    .guide-line {
      fill: none;
      stroke: #ffd400;
      stroke-width: 6;
      stroke-dasharray: 8 10;
      opacity: .85;
    }

    .edit-dot {
      fill: #ffd400;
      stroke: #1a1a1a;
      stroke-width: 3;
    }

    .edit-dot-num {
      fill: #111;
      font-size: 22px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* ── 핀 공통 (초대형 고가시성 디자인) ── */
    .pin {
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .95));
    }

    .pin-label {
      fill: #ffffff;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: -0.01em;
    }

    .pin-label.shadow {
      stroke: #000000;
      stroke-width: 8;
      stroke-linejoin: round;
      paint-order: stroke;
      opacity: 1;
    }

    .pin-badge {
      fill: #12161c;
      stroke: #fff;
      stroke-width: 3;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
    }

    /* 현위치 핀 (초대형 블루 펄스 & 레이더 링) */
    .pin-start circle.pulse-outer {
      fill: rgba(0, 162, 255, .25);
      animation: startPulseOut 2.4s ease-out infinite;
    }

    .pin-start circle.pulse {
      fill: rgba(0, 162, 255, .5);
      stroke: none;
      animation: startPulse 2s ease-in-out infinite;
    }

    .pin-start circle.outer {
      fill: var(--start-pin);
      stroke: #ffffff;
      stroke-width: 6;
    }

    .pin-start circle.center {
      fill: #ffffff;
    }

    @keyframes startPulse {

      0%,
      100% {
        r: 32;
        opacity: .7;
      }

      50% {
        r: 76;
        opacity: 0;
      }
    }

    @keyframes startPulseOut {
      0% {
        r: 24;
        opacity: .9;
      }

      100% {
        r: 100;
        opacity: 0;
      }
    }

    /* 목적지 핀 (초대형 레드/골드 타겟 마커 링) */
    .pin-dest circle.dest-glow-outer {
      fill: rgba(255, 59, 48, .2);
      animation: destPulseOut 2s ease-out infinite;
    }

    .pin-dest circle.dest-glow {
      fill: rgba(255, 59, 48, .5);
      animation: destPulse 1.6s ease-in-out infinite;
    }

    .pin-dest circle.dest-core {
      fill: var(--accent-red);
      stroke: #ffffff;
      stroke-width: 6;
    }

    .pin-dest circle.dest-center {
      fill: #ffffff;
    }

    .pin-dest.dest-green circle.dest-core {
      fill: var(--accent-green);
    }

    .pin-dest.dest-green circle.dest-glow {
      fill: rgba(0, 230, 118, .5);
    }

    .pin-dest {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .pin-dest.show {
      opacity: 1;
    }

    @keyframes destPulse {

      0%,
      100% {
        r: 36;
        opacity: .8;
      }

      50% {
        r: 84;
        opacity: 0;
      }
    }

    @keyframes destPulseOut {
      0% {
        r: 28;
        opacity: .9;
      }

      100% {
        r: 110;
        opacity: 0;
      }
    }

    .edit-dot.forest-entry {
      fill: #00e676;
      stroke: #fff;
      stroke-width: 4;
    }

    .guide-line.forest-guide {
      stroke: #00e676;
    }

    /* ── 동시 주행 화살표들 ── */
    .flow-arrow {
      visibility: hidden;
    }

    .flow-arrow path {
      fill: #fff;
      stroke-width: 4;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1));
    }

    .flow-arrow.arrow-red path {
      stroke: var(--accent-red);
    }

    .flow-arrow.arrow-blue path {
      stroke: var(--accent-blue);
    }

    .flow-arrow.arrow-green path {
      stroke: var(--accent-green);
    }

    /* ── 조작 영역 ── */
    .control-zone {
      background: linear-gradient(180deg, var(--panel-bg2), #0c0f14);
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1 1 0;
    }

    .hint {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.45;
      min-height: 44px;
      margin-bottom: 2px;
      text-align: center;
    }

    .hint b {
      color: #ffd400;
    }

    /* 경로 범례 뱃지 */
    .route-legend {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      border: 1px solid #2c3646;
    }

    .route-legend.show {
      display: flex;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.red {
      background: var(--accent-red);
      box-shadow: 0 0 8px var(--glow-red);
    }

    .legend-dot.blue {
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--glow-blue);
    }

    .legend-dot.green {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--glow-green);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dest-btn {
      background: #19202a;
      border: 1.5px solid #2d3848;
      color: var(--ink);
      border-radius: 14px;
      padding: 16px 10px;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
    }

    .dest-btn .ico {
      font-size: 28px;
      transition: transform .15s;
    }

    .dest-btn:active {
      transform: scale(.96);
    }

    /* 목적지별 고유 테마 컬러 & 은은한 서브 글로우 */
    .dest-btn[data-route="lake"] {
      border-color: rgba(0, 210, 255, 0.35);
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.08) 0%, #171f2a 100%);
    }

    .dest-btn[data-route="lake"]:active,
    .dest-btn[data-route="lake"].active {
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.22) 0%, #182838 100%);
      border-color: #00d2ff;
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.45), 0 0 0 1px #00d2ff inset;
      color: #fff;
    }

    .dest-btn[data-route="cafe"] {
      border-color: rgba(255, 159, 10, 0.35);
      background: linear-gradient(180deg, rgba(255, 159, 10, 0.08) 0%, #1c1d27 100%);
    }

    .dest-btn[data-route="cafe"]:active,
    .dest-btn[data-route="cafe"].active {
      background: linear-gradient(180deg, rgba(255, 159, 10, 0.22) 0%, #2a221f 100%);
      border-color: #ff9f0a;
      box-shadow: 0 0 16px rgba(255, 159, 10, 0.45), 0 0 0 1px #ff9f0a inset;
      color: #fff;
    }

    .dest-btn[data-route="mono"] {
      border-color: rgba(0, 136, 255, 0.35);
      background: linear-gradient(180deg, rgba(0, 136, 255, 0.08) 0%, #161e2b 100%);
    }

    .dest-btn[data-route="mono"]:active,
    .dest-btn[data-route="mono"].active {
      background: linear-gradient(180deg, rgba(0, 136, 255, 0.22) 0%, #17243b 100%);
      border-color: #0088ff;
      box-shadow: 0 0 16px rgba(0, 136, 255, 0.45), 0 0 0 1px #0088ff inset;
      color: #fff;
    }

    .dest-btn[data-route="forest"] {
      border-color: rgba(0, 230, 118, 0.35);
      background: linear-gradient(180deg, rgba(0, 230, 118, 0.08) 0%, #14201c 100%);
    }

    .dest-btn[data-route="forest"]:active,
    .dest-btn[data-route="forest"].active {
      background: linear-gradient(180deg, rgba(0, 230, 118, 0.22) 0%, #152c20 100%);
      border-color: #00e676;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.45), 0 0 0 1px #00e676 inset;
      color: #fff;
    }

    .dest-btn.editing {
      border-color: #ffd400 !important;
      box-shadow: 0 0 0 1px #ffd400 inset !important;
    }

    .reset-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .reset-row button {
      flex: 1;
      background: #1a2028;
      border: 1px solid #2c3646;
      color: var(--muted);
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── 관리자 바 & 내보내기 ── */
    #secretZone {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 80px;
      height: 80px;
      z-index: 9999;
    }

    .admin-bar {
      flex-shrink: 0;
      display: none;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px 8px;
      padding: 10px 12px;
      background: #05070a;
      border-top: 1px solid #1c222c;
    }

    .admin-bar.show {
      display: flex;
    }

    .admin-bar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .admin-bar .title {
      font-size: 13px;
      font-weight: 600;
      color: #5c6675;
    }

    .admin-bar .title b {
      color: #8993a4;
      font-weight: 700;
    }

    .admin-bar .status {
      font-size: 13px;
      color: #5c6675;
      opacity: 0;
      transition: opacity .2s;
    }

    .admin-bar .status.show {
      opacity: 1;
      color: #ffd400;
    }

    .mode-toggle {
      font-size: 13px;
      border: 1px solid #3a4454;
      background: #12161c;
      color: var(--ink);
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-toggle.on {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #1a0500;
      font-weight: 700;
    }

    .close-admin {
      background: none;
      border: 1px solid #3a4454;
      color: #8993a4;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .start-bar-label {
      font-size: 12px;
      color: #5c6675;
      padding: 2px 4px 0;
      font-weight: 600;
    }

    .start-btn {
      background: var(--btn);
      border: 1px solid #2c3646;
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .start-btn.active {
      background: var(--btn-active);
      border-color: #3ba7ff;
      box-shadow: 0 0 0 1px #3ba7ff inset;
      color: #7dd3ff;
    }

    .edit-toolbar {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
      width: 100%;
    }

    .edit-toolbar.show {
      display: flex;
    }

    .edit-toolbar button {
      flex: 1;
      min-width: 65px;
      background: #232b37;
      border: 1px solid #3a4454;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }

    .edit-toolbar button:hover {
      border-color: #ffd400;
    }

    .edit-toolbar button.active {
      border-color: #ffd400;
      color: #ffd400;
    }

    /* 내보내기 모달 & 토스트 */
    .export-box {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      margin-top: 6px;
    }

    .export-box.show {
      display: flex;
    }

    #exportArea {
      width: 100%;
      height: 180px;
      background: #0a0d12;
      color: #8fd18f;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      border: 1px solid #2c3646;
      border-radius: 8px;
      padding: 8px;
      resize: vertical;
    }

    .export-action-row {
      display: flex;
      gap: 6px;
    }

    .export-action-row button {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #3a4454;
      background: #1a222d;
      color: #eef1f6;
      cursor: pointer;
    }

    .toast-msg {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(18, 24, 33, 0.95);
      border: 1px solid #00e676;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 230, 118, 0.4);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  
    /* ── 우측 대형 QR 코드 박스 ── */
    .header-qr-box {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 62px;
      height: 62px;
      background: #ffffff;
      border-radius: 8px;
      padding: 3px;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.5), 0 4px 12px rgba(0, 0, 0, 0.5);
      border: 2px solid #00e676;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .header-qr-box img,
    .header-qr-box canvas {
      width: 56px !important;
      height: 56px !important;
      display: block;
    }
    .header-logo {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      height: 24px;
      max-width: 60px;
      object-fit: contain;
      opacity: 0.85;
    }

  </style>
  <script src="qrcode.min.js"></script>
</head>

<body>

  <div class="kiosk-frame">
    <div id="secretZone"></div>

    <!-- ① 상단 헤더 -->
        <!-- ① 상단 제목 영역 -->
    <div class="header-zone">
      <img src="logo.png" onerror="this.src='천문과학관_로고.png'; this.onerror=function(){this.style.display='none';};" alt="로고" class="header-logo" />
      <h1 class="main-title"><span class="point-text">아트밸리</span> 길찾기</h1>
