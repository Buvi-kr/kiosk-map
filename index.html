<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>포천아트밸리 키오스크 경로안내 시스템</title>
  <script src="qrcode.min.js"></script>
  <style>
    :root {
      --accent-red: #ff3b30;
      /* 기본 보행로 경로 A (Red Neon) */
      --accent-blue: #0088ff;
      /* 대안/모노레일 경로 B (Blue Neon) */
      --accent-green: #00e676;
      /* 힐링 숲 산책로 경로 C (Emerald Green Neon) */
      --glow-red: rgba(255, 59, 48, .85);
      --glow-blue: rgba(0, 136, 255, .85);
      --glow-green: rgba(0, 230, 118, .85);
      --panel-bg: #12161c;
      --panel-bg2: #1b212b;
      --ink: #eef1f6;
      --muted: #8993a4;
      --btn: #232b37;
      --btn-active: #2d3745;

      --start-pin: #00a2ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      inset: 0;
      background: #05070a;
      color: var(--ink);
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      overflow: hidden !important;
      overscroll-behavior: none;
      -webkit-text-size-adjust: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kiosk-frame {
      width: 100%;
      max-width: 560px;
      height: 100%;
      max-height: 100dvh;
      background: var(--panel-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 0;
      box-shadow: none;
    }

    @media (min-width: 600px) and (min-height: 750px) {
      .kiosk-frame {
        height: min(100vh - 20px, 960px);
        border-radius: 20px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8), 0 0 0 1px #232b37;
      }
    }

    /* ① 상단 제목 영역 */
    .header-zone {
      flex: none;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: linear-gradient(180deg, #141a24, #0f131a);
      border-bottom: 1px solid #1f2735;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      min-height: 76px;
    }

    .header-logo {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      height: 20px;
      max-width: 60px;
      object-fit: contain;
      opacity: 0.85;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.5));
    }

    .main-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin: 0;
      color: #ffffff;
      background: linear-gradient(180deg, #ffffff 30%, #b3d7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 12px rgba(0, 136, 255, 0.4));
      text-align: center;
    }

    .main-title .point-text {
      color: #ffd400;
      background: linear-gradient(180deg, #fff380 20%, #ffb800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── 우측 이따시만한 QR 코드 ── */
    .header-qr-box {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 62px;
      height: 62px;
      background: #ffffff;
      border-radius: 8px;
      padding: 3px;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.5), 0 4px 12px rgba(0, 0, 0, 0.5);
      border: 2px solid #00e676;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-qr-box img,
    .header-qr-box canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* ── 지도 영역 (3337 x 2101 고화질 비율) ── */
    .map-zone {
      position: relative;
      width: 100%;
      flex: none;
      aspect-ratio: 3337 / 2101;
      background: #060a0e;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .map-zone.panning {
      cursor: grabbing;
    }

    .map-zone svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: none;
    }

    /* 지도 플로팅 줌 컨트롤러 (정량적 줌) */
    .map-zoom-controls {
      position: absolute;
      right: 12px;
      top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }

    .map-zoom-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(18, 22, 28, 0.88);
      border: 1px solid #3a4454;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.15s, transform 0.1s;
    }

    .map-zoom-btn:active {
      background: var(--btn-active);
      transform: scale(0.92);
    }

    /* ── 경로선 스타일 (빨간 경로 & 파란 경로 & 초록 숲길 경로) ── */
    .route-path {
      fill: none;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    .route-path.path-red {
      stroke: var(--accent-red);
      filter: drop-shadow(0 0 16px var(--glow-red));
    }

    .route-path.path-blue {
      stroke: var(--accent-blue);
      filter: drop-shadow(0 0 16px var(--glow-blue));
    }

    .route-path.path-green {
      stroke: var(--accent-green);
      filter: drop-shadow(0 0 16px var(--glow-green));
    }

    .route-path.visible {
      opacity: 1;
    }

    /* 메인 선은 언제나 꽉 찬 솔리드 실선으로 유지 (색상 끊김/공백 원천 방지) */

    .route-overlay {
      fill: none;
      stroke: #ffffff;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      stroke-dasharray: 20 32;
    }

    .route-overlay.flowing {
      opacity: 0.95;
      animation: dashflow-white 0.7s linear infinite;
    }

    @keyframes dashflow-white {
      to {
        stroke-dashoffset: -156;
      }
    }

    .guide-line {
      fill: none;
      stroke: #ffd400;
      stroke-width: 6;
      stroke-dasharray: 8 10;
      opacity: .85;
    }

    .edit-dot {
      fill: #ffd400;
      stroke: #1a1a1a;
      stroke-width: 3;
    }

    .edit-dot-num {
      fill: #111;
      font-size: 22px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* ── 핀 공통 (초대형 고가시성 디자인) ── */
    .pin {
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .95));
    }

    .pin-label {
      fill: #ffffff;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: -0.01em;
    }

    .pin-label.shadow {
      stroke: #000000;
      stroke-width: 8;
      stroke-linejoin: round;
      paint-order: stroke;
      opacity: 1;
    }

    .pin-badge {
      fill: #12161c;
      stroke: #fff;
      stroke-width: 3;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
    }

    /* 현위치 핀 (초대형 블루 펄스 & 레이더 링) */
    .pin-start circle.pulse-outer {
      fill: rgba(0, 162, 255, .25);
      animation: startPulseOut 2.4s ease-out infinite;
    }

    .pin-start circle.pulse {
      fill: rgba(0, 162, 255, .5);
      stroke: none;
      animation: startPulse 2s ease-in-out infinite;
    }

    .pin-start circle.outer {
      fill: var(--start-pin);
      stroke: #ffffff;
      stroke-width: 6;
    }

    .pin-start circle.center {
      fill: #ffffff;
    }

    @keyframes startPulse {

      0%,
      100% {
        r: 32;
        opacity: .7;
      }

      50% {
        r: 76;
        opacity: 0;
      }
    }

    @keyframes startPulseOut {
      0% {
        r: 24;
        opacity: .9;
      }

      100% {
        r: 100;
        opacity: 0;
      }
    }

    /* 목적지 핀 (초대형 레드/골드 타겟 마커 링) */
    .pin-dest circle.dest-glow-outer {
      fill: rgba(255, 59, 48, .2);
      animation: destPulseOut 2s ease-out infinite;
    }

    .pin-dest circle.dest-glow {
      fill: rgba(255, 59, 48, .5);
      animation: destPulse 1.6s ease-in-out infinite;
    }

    .pin-dest circle.dest-core {
      fill: var(--accent-red);
      stroke: #ffffff;
      stroke-width: 6;
    }

    .pin-dest circle.dest-center {
      fill: #ffffff;
    }

    .pin-dest.dest-green circle.dest-core {
      fill: var(--accent-green);
    }

    .pin-dest.dest-green circle.dest-glow {
      fill: rgba(0, 230, 118, .5);
    }

    .pin-dest {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .pin-dest.show {
      opacity: 1;
    }

    @keyframes destPulse {

      0%,
      100% {
        r: 36;
        opacity: .8;
      }

      50% {
        r: 84;
        opacity: 0;
      }
    }

    @keyframes destPulseOut {
      0% {
        r: 28;
        opacity: .9;
      }

      100% {
        r: 110;
        opacity: 0;
      }
    }

    .edit-dot.forest-entry {
      fill: #00e676;
      stroke: #fff;
      stroke-width: 4;
    }

    .guide-line.forest-guide {
      stroke: #00e676;
    }

    /* ── 동시 주행 화살표들 ── */
    .flow-arrow {
      visibility: hidden;
    }

    .flow-arrow path {
      fill: #fff;
      stroke-width: 4;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1));
    }

    .flow-arrow.arrow-red path {
      stroke: var(--accent-red);
    }

    .flow-arrow.arrow-blue path {
      stroke: var(--accent-blue);
    }

    .flow-arrow.arrow-green path {
      stroke: var(--accent-green);
    }

    /* ── 조작 영역 ── */
    .control-zone {
      background: linear-gradient(180deg, var(--panel-bg2), #0c0f14);
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1 1 0;
    }

    .hint {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.45;
      min-height: 44px;
      margin-bottom: 2px;
      text-align: center;
    }

    .hint b {
      color: #ffd400;
    }

    /* 경로 범례 뱃지 */
    .route-legend {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      border: 1px solid #2c3646;
    }

    .route-legend.show {
      display: flex;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.red {
      background: var(--accent-red);
      box-shadow: 0 0 8px var(--glow-red);
    }

    .legend-dot.blue {
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--glow-blue);
    }

    .legend-dot.green {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--glow-green);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dest-btn {
      background: #19202a;
      border: 1.5px solid #2d3848;
      color: var(--ink);
      border-radius: 14px;
      padding: 16px 10px;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
    }

    .dest-btn .ico {
      font-size: 28px;
      transition: transform .15s;
    }

    .dest-btn:active {
      transform: scale(.96);
    }

    /* 목적지별 고유 테마 컬러 & 은은한 서브 글로우 */
    .dest-btn[data-route="lake"] {
      border-color: rgba(0, 210, 255, 0.35);
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.08) 0%, #171f2a 100%);
    }

    .dest-btn[data-route="lake"]:active,
    .dest-btn[data-route="lake"].active {
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.22) 0%, #182838 100%);
      border-color: #00d2ff;
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.45), 0 0 0 1px #00d2ff inset;
      color: #fff;
    }

    .dest-btn[data-route="cafe"] {
      border-color: rgba(255, 159, 10, 0.35);
      background: linear-gradient(180deg, rgba(255, 159, 10, 0.08) 0%, #1c1d27 100%);
    }

    .dest-btn[data-route="cafe"]:active,
    .dest-btn[data-route="cafe"].active {
      background: linear-gradient(180deg, rgba(255, 159, 10, 0.22) 0%, #2a221f 100%);
      border-color: #ff9f0a;
      box-shadow: 0 0 16px rgba(255, 159, 10, 0.45), 0 0 0 1px #ff9f0a inset;
      color: #fff;
    }

    .dest-btn[data-route="mono"] {
      border-color: rgba(0, 136, 255, 0.35);
      background: linear-gradient(180deg, rgba(0, 136, 255, 0.08) 0%, #161e2b 100%);
    }

    .dest-btn[data-route="mono"]:active,
    .dest-btn[data-route="mono"].active {
      background: linear-gradient(180deg, rgba(0, 136, 255, 0.22) 0%, #17243b 100%);
      border-color: #0088ff;
      box-shadow: 0 0 16px rgba(0, 136, 255, 0.45), 0 0 0 1px #0088ff inset;
      color: #fff;
    }

    .dest-btn[data-route="forest"] {
      border-color: rgba(0, 230, 118, 0.35);
      background: linear-gradient(180deg, rgba(0, 230, 118, 0.08) 0%, #14201c 100%);
    }

    .dest-btn[data-route="forest"]:active,
    .dest-btn[data-route="forest"].active {
      background: linear-gradient(180deg, rgba(0, 230, 118, 0.22) 0%, #152c20 100%);
      border-color: #00e676;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.45), 0 0 0 1px #00e676 inset;
      color: #fff;
    }

    .dest-btn.editing {
      border-color: #ffd400 !important;
      box-shadow: 0 0 0 1px #ffd400 inset !important;
    }

    .reset-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .reset-row button {
      flex: 1;
      background: #1a2028;
      border: 1px solid #2c3646;
      color: var(--muted);
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── 관리자 바 & 내보내기 ── */
    #secretZone {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 80px;
      height: 80px;
      z-index: 9999;
    }

    .admin-bar {
      flex-shrink: 0;
      display: none;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px 8px;
      padding: 10px 12px;
      background: #05070a;
      border-top: 1px solid #1c222c;
    }

    .admin-bar.show {
      display: flex;
    }

    .admin-bar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .admin-bar .title {
      font-size: 13px;
      font-weight: 600;
      color: #5c6675;
    }

    .admin-bar .title b {
      color: #8993a4;
      font-weight: 700;
    }

    .admin-bar .status {
      font-size: 13px;
      color: #5c6675;
      opacity: 0;
      transition: opacity .2s;
    }

    .admin-bar .status.show {
      opacity: 1;
      color: #ffd400;
    }

    .mode-toggle {
      font-size: 13px;
      border: 1px solid #3a4454;
      background: #12161c;
      color: var(--ink);
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-toggle.on {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #1a0500;
      font-weight: 700;
    }

    .close-admin {
      background: none;
      border: 1px solid #3a4454;
      color: #8993a4;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .start-bar-label {
      font-size: 12px;
      color: #5c6675;
      padding: 2px 4px 0;
      font-weight: 600;
    }

    .start-btn {
      background: var(--btn);
      border: 1px solid #2c3646;
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .start-btn.active {
      background: var(--btn-active);
      border-color: #3ba7ff;
      box-shadow: 0 0 0 1px #3ba7ff inset;
      color: #7dd3ff;
    }

    .edit-toolbar {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
      width: 100%;
    }

    .edit-toolbar.show {
      display: flex;
    }

    .edit-toolbar button {
      flex: 1;
      min-width: 65px;
      background: #232b37;
      border: 1px solid #3a4454;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }

    .edit-toolbar button:hover {
      border-color: #ffd400;
    }

    .edit-toolbar button.active {
      border-color: #ffd400;
      color: #ffd400;
    }

    /* 내보내기 모달 & 토스트 */
    .export-box {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      margin-top: 6px;
    }

    .export-box.show {
      display: flex;
    }

    #exportArea {
      width: 100%;
      height: 180px;
      background: #0a0d12;
      color: #8fd18f;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      border: 1px solid #2c3646;
      border-radius: 8px;
      padding: 8px;
      resize: vertical;
    }

    .export-action-row {
      display: flex;
      gap: 6px;
    }

    .export-action-row button {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #3a4454;
      background: #1a222d;
      color: #eef1f6;
      cursor: pointer;
    }

    .toast-msg {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(18, 24, 33, 0.95);
      border: 1px solid #00e676;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 230, 118, 0.4);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

  <div class="kiosk-frame">
    <div id="secretZone"></div>

    <!-- ① 상단 헤더 -->
    <div class="header-zone">
      <img src="천문과학관_로고.png" alt="포천아트밸리 천문과학관" class="header-logo">
      <div class="main-title">아트밸리 <span class="point-text">길찾기</span></div>
      <div class="header-qr-box" id="headerQrCode" title="스마트폰으로 길안내 보기"></div>
    </div>

    <!-- ② 고화질 지도 영역 (3337 x 2101) -->
    <div class="map-zone" id="mapZone">
      <!-- 플로팅 정량 줌 컨트롤러 -->
      <div class="map-zoom-controls">

      const RoadGraph = (function() {
        const nodes = MASTER_ROAD_DATA.nodes;
        const adj = new Map();

        Object.entries(MASTER_ROAD_DATA.adj).forEach(([k, list]) => {
          adj.set(parseInt(k), list.map(item => ({ to: item[0], dist: item[1] })));
        });

        function findNearestNode(pt) {
          let bestIdx = 0, minDist = Infinity;
          for (let i = 0; i < nodes.length; i++) {
            const d = Math.hypot(nodes[i][0] - pt[0], nodes[i][1] - pt[1]);
            if (d < minDist) { minDist = d; bestIdx = i; }
          }
          return bestIdx;
        }

        function getShortestPath(startPt, endPt) {
          if (!nodes.length) return [startPt, endPt];
          const startU = findNearestNode(startPt);
          const endU = findNearestNode(endPt);
          const dist = new Map(), parent = new Map(), visited = new Set();
          dist.set(startU, 0);

          while (true) {
            let u = null, minD = Infinity;
            for (const [node, d] of dist.entries()) {
              if (!visited.has(node) && d < minD) { minD = d; u = node; }
            }
            if (u === null || u === endU) break;
            visited.add(u);
            const neighbors = adj.get(u) || [];
            for (const { to: v, dist: w } of neighbors) {
              if (!visited.has(v)) {
                const newD = minD + w;
                if (newD < (dist.get(v) ?? Infinity)) {
                  dist.set(v, newD);
                  parent.set(v, u);
                }
              }
            }
          }

          if (startU !== endU && !parent.has(endU)) {
            return [startPt, nodes[startU], nodes[endU], endPt];
          }

          let curr = endU;
          const nodePath = [];
          while (curr !== undefined) {
            nodePath.push(nodes[curr]);
            curr = parent.get(curr);
          }
          nodePath.reverse();
          return [startPt, ...nodePath, endPt];
        }

        return { findPath: getShortestPath, nodes, polylines: MASTER_ROAD_DATA.polylines };
      })();

      // ── 동적 목적지별 경로 생성기 ──
      function generateAllRoutes() {
        const r = {};

          const mDest = (sKey === 'astro') ? ANCHORS.monoDown : ANCHORS.monoLower;

          // 천주호 (코스 1 + 코스 2)
          r[sKey].lake = [
            { id: 'lake_0', name: '코스 1 (보행로)', color: 'red', points: RoadGraph.findPath(sPos, [1575, 520]) },
            { id: 'lake_1', name: '코스 2 (전망계단)', color: 'blue', points: RoadGraph.findPath(sPos, [1247, 663]) }
          ];

          // 전망카페
          r[sKey].cafe = [
            { id: 'cafe_0', name: '코스 1', color: 'red', points: RoadGraph.findPath(sPos, ANCHORS.cafe) },
            { id: 'cafe_1', name: '코스 2', color: 'blue', points: RoadGraph.findPath(sPos, [2544, 671]) }
          ];

          // 힐링숲 산책로
          const forestFull = RoadGraph.findPath(sPos, [2089, 1472]);
          const splitIdx = Math.max(1, Math.min(Math.floor(forestFull.length * 0.6), forestFull.length - 2));
          r[sKey].forest = [{ id: 'forest_0', name: '코스 1', color: 'red', forestStartIndex: splitIdx, points: forestFull }];
        });
        return r;

      const pathname = decodeURIComponent(window.location.pathname);
      let defaultStart = 'astro';
      if (pathname.includes('매표소')) defaultStart = 'ticket';
      else if (pathname.includes('관광정보센터') || pathname.includes('정보센터')) defaultStart = 'info';
      else if (pathname.includes('천문과학관')) defaultStart = 'astro';

      const urlParams = new URLSearchParams(window.location.search);
      let currentStartKey = urlParams.get('start') || defaultStart;
      if (!START_PRESETS[currentStartKey]) currentStartKey = defaultStart;

      function getStart() { return START_PRESETS[currentStartKey].pos; }
      function getDestPos(destKey) {
        if (DEST_PRESETS[currentStartKey] && DEST_PRESETS[currentStartKey][destKey]) return DEST_PRESETS[currentStartKey][destKey];
        const routes = getDestRoutes(destKey);
        return (routes[0]?.points?.length > 0) ? routes[0].points[routes[0].points.length - 1] : (ANCHORS[destKey] || [1500, 1000]);
      }
      function getDestRoutes(destKey) { return ALL_ROUTES[currentStartKey][destKey] || []; }

      const svg = document.getElementById('mapSvg');
      const routesLayer = document.getElementById('routesLayer');
      const overlayLayer = document.getElementById('overlayLayer');
      const arrowsLayer = document.getElementById('arrowsLayer');
      const destPinsLayer = document.getElementById('destPins');
      const editDotsLayer = document.getElementById('editDots');
      const hintText = document.getElementById('hintText');
      const routeLegend = document.getElementById('routeLegend');
      const legendRedText = document.getElementById('legendRedText');
      const legendBlue = document.getElementById('legendBlue');
      const legendBlueText = document.getElementById('legendBlueText');
      const legendGreen = document.getElementById('legendGreen');
      const legendGreenText = document.getElementById('legendGreenText');
      const modeToggleBtn = document.getElementById('modeToggle');
      const editToolbar = document.getElementById('editToolbar');
      const previewReset = document.getElementById('previewReset');
      const exportBox = document.getElementById('exportBox');
      const exportArea = document.getElementById('exportArea');
      const toastMsg = document.getElementById('toastMsg');
      const zoomBadge = document.getElementById('zoomBadge');
      const mapZone = document.getElementById('mapZone');
      const destBtns = [...document.querySelectorAll('.dest-btn')];
      const startBtns = [...document.querySelectorAll('.start-btn')];

      let editMode = false, editingDestKey = null, editingPathIndex = 0;
      let activeDestKey = null;
      let zoomAnim = null, animTimer = null;
      let currentVB = { ...FULL_VB };

      function createSvg(tag, attrs = {}, innerHTML = '') {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        if (innerHTML) el.innerHTML = innerHTML;
        return el;
      }

      let toastTimer = null;
      function showToast(text) {
        clearTimeout(toastTimer);
        toastMsg.textContent = text;
        toastMsg.classList.add('show');
        toastTimer = setTimeout(() => { toastMsg.classList.remove('show'); }, 2600);
      }

      function animateViewBox(target, duration = 500) {
        if (zoomAnim) cancelAnimationFrame(zoomAnim);
        const start = { ...currentVB };
        const startTime = performance.now();
        function ease(t) { return t < .5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1; }
        function step(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const e = ease(t);
          currentVB.x = start.x + (target.x - start.x) * e;
          currentVB.y = start.y + (target.y - start.y) * e;
          currentVB.w = start.w + (target.w - start.w) * e;
          currentVB.h = start.h + (target.h - start.h) * e;
          svg.setAttribute('viewBox', `${currentVB.x} ${currentVB.y} ${currentVB.w} ${currentVB.h}`);
          if (t < 1) zoomAnim = requestAnimationFrame(step);
          else zoomAnim = null;
        }
        zoomAnim = requestAnimationFrame(step);
      }

      function zoomToAllRoutes(destKey) {
        const routes = getDestRoutes(destKey);
        if (!routes.length) { zoomToFull(); return; }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        routes.forEach(rt => rt.points.forEach(([x, y]) => { if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }));
        const targetPos = getDestPos(destKey);
        if (targetPos) { if (targetPos[0] < minX) minX = targetPos[0]; if (targetPos[1] < minY) minY = targetPos[1]; if (targetPos[0] > maxX) maxX = targetPos[0]; if (targetPos[1] > maxY) maxY = targetPos[1]; }
        if (minX === Infinity) { zoomToFull(); return; }
        const PADDING = 340;
        let vx = minX - PADDING, vy = minY - PADDING, vw = (maxX - minX) + PADDING * 2, vh = (maxY - minY) + PADDING * 2;
        const minDimW = 1650, minDimH = 1050;
        if (vw < minDimW) { const d = minDimW - vw; vx -= d / 2; vw = minDimW; }
        if (vh < minDimH) { const d = minDimH - vh; vy -= d / 2; vh = minDimH; }
        const aspect = (mapZone.clientWidth && mapZone.clientHeight) ? (mapZone.clientWidth / mapZone.clientHeight) : (3337 / 2101);
        const vbAspect = vw / vh;
        if (vbAspect > aspect) vh = vw / aspect; else vw = vh * aspect;
        if (vw > 3337) vw = 3337; if (vh > 2101) vh = 2101;
        if (vx < 0) vx = 0; if (vy < 0) vy = 0;
        if (vx + vw > 3337) vx = 3337 - vw; if (vy + vh > 2101) vy = 2101 - vh;
        animateViewBox({ x: vx, y: vy, w: vw, h: vh }, 600);
        zoomBadge.classList.add('show');
      }

      function zoomToFull() { animateViewBox({ ...FULL_VB }, 450); zoomBadge.classList.remove('show'); }

      function manualZoom(factor) {
        const cx = currentVB.x + currentVB.w / 2, cy = currentVB.y + currentVB.h / 2;
        let newW = currentVB.w * factor, newH = currentVB.h * factor;
        if (newW < 750) { newW = 750; newH = 750 * (2101 / 3337); }
        if (newW > 3337) { zoomToFull(); return; }
        let newX = cx - newW / 2, newY = cy - newH / 2;
        if (newX < 0) newX = 0; if (newY < 0) newY = 0;
        if (newX + newW > 3337) newX = 3337 - newW; if (newY + newH > 2101) newY = 2101 - newH;
        animateViewBox({ x: newX, y: newY, w: newW, h: newH }, 220);
        zoomBadge.classList.add('show');
      }

      let isPanning = false, hasDragged = false;
      let panStartX = 0, panStartY = 0, panStartVB_X = 0, panStartVB_Y = 0;

      mapZone.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.map-zoom-controls')) return;
        isPanning = true; hasDragged = false;
        panStartX = e.clientX; panStartY = e.clientY;
        panStartVB_X = currentVB.x; panStartVB_Y = currentVB.y;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPanning) return;
        const dist = Math.hypot(e.clientX - panStartX, e.clientY - panStartY);
        if (dist > 4) { hasDragged = true; mapZone.classList.add('panning'); }
        if (hasDragged) {
          const scaleX = currentVB.w / mapZone.clientWidth;
          const scaleY = currentVB.h / mapZone.clientHeight;
          let nx = panStartVB_X - (e.clientX - panStartX) * scaleX;
          let ny = panStartVB_Y - (e.clientY - panStartY) * scaleY;
          if (nx < 0) nx = 0; if (ny < 0) ny = 0;
          if (nx + currentVB.w > 3337) nx = 3337 - currentVB.w;
          if (ny + currentVB.h > 2101) ny = 2101 - currentVB.h;
          currentVB.x = nx; currentVB.y = ny;
          svg.setAttribute('viewBox', `${nx} ${ny} ${currentVB.w} ${currentVB.h}`);
          zoomBadge.classList.add('show');
        }
      });

      window.addEventListener('pointerup', () => { isPanning = false; mapZone.classList.remove('panning'); });
      window.addEventListener('pointercancel', () => { isPanning = false; mapZone.classList.remove('panning'); });

      document.getElementById('zoomInBtn').addEventListener('click', (e) => { e.stopPropagation(); manualZoom(0.55); });
      document.getElementById('zoomOutBtn').addEventListener('click', (e) => { e.stopPropagation(); manualZoom(1.82); });
      document.getElementById('zoomResetBtn').addEventListener('click', (e) => { e.stopPropagation(); zoomToFull(); });

      mapZone.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) manualZoom(0.7); else manualZoom(1.43);
      }, { passive: false });

      function updateStartPin() {
        const [x, y] = getStart();
        document.getElementById('startPin').setAttribute('transform', `translate(${x},${y})`);
        startBtns.forEach(b => b.classList.toggle('active', b.dataset.start === currentStartKey));
      }

      function smoothPath(pts) {
        if (pts.length < 2) return '';
        if (pts.length === 2) return `M ${pts[0][0]},${pts[0][1]} L ${pts[1][0]},${pts[1][1]}`;
        let d = `M ${pts[0][0]},${pts[0][1]} `;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
          d += `C ${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]} `;
        }
        return d.trim();
      }

      function renderAllPathsForDest(destKey) {
        routesLayer.innerHTML = ''; overlayLayer.innerHTML = ''; arrowsLayer.innerHTML = ''; destPinsLayer.innerHTML = '';
        const routes = getDestRoutes(destKey);
        if (!routes || routes.length === 0) return;
        const targetPos = getDestPos(destKey);
        let subPathIndex = 0;
        routes.forEach((route) => {
          let pts = route.points.map(p => p.slice());
          if (pts.length === 0) return;
          pts[0] = getStart().slice();
          if (targetPos && pts.length > 1) pts[pts.length - 1] = targetPos.slice();
          const fIdx = (typeof route.forestStartIndex === 'number') ? route.forestStartIndex : (destKey === 'forest' && pts.length >= 24 ? 23 : -1);
          let segments = [];
          if (destKey === 'forest' && fIdx > 0 && fIdx < pts.length) {
            segments.push({ color: route.color || 'red', points: pts.slice(0, fIdx + 1) });
            segments.push({ color: 'green', points: pts.slice(fIdx) });
          } else {
            segments.push({ color: destKey === 'forest' ? 'green' : (route.color || 'red'), points: pts });
          }
          segments.forEach((seg) => {
            if (seg.points.length < 2) return;
            const d = smoothPath(seg.points);
            const pathId = `active-route-${subPathIndex}`;
            const colorClass = seg.color === 'blue' ? 'path-blue' : (seg.color === 'green' ? 'path-green' : 'path-red');
            const arrowClass = seg.color === 'blue' ? 'arrow-blue' : (seg.color === 'green' ? 'arrow-green' : 'arrow-red');
            routesLayer.appendChild(createSvg('path', { id: pathId, class: `route-path ${colorClass}`, d: d }));
            overlayLayer.appendChild(createSvg('path', { id: `active-overlay-${subPathIndex}`, class: 'route-overlay', d: d }));
            const durSeconds = 2.6 + subPathIndex * 0.25;
            const arrowGroup = createSvg('g', { id: `flow-arrow-${subPathIndex}`, class: `flow-arrow ${arrowClass}` }, `
              <path d="M -26,-15 L 24,0 L -26,15 L -12,0 Z"></path>
              <animateMotion dur="${durSeconds}s" repeatCount="indefinite" rotate="auto"><mpath href="#${pathId}"></mpath></animateMotion>
              <animate attributeName="opacity" values="0; 0.2; 1; 1; 1; 0.3; 0" keyTimes="0; 0.06; 0.16; 0.5; 0.84; 0.94; 1" dur="${durSeconds}s" repeatCount="indefinite"></animate>
            `);
            arrowsLayer.appendChild(arrowGroup);
            subPathIndex++;
          });
        });
        if (targetPos) {
          const isGreenDest = (destKey === 'forest');
          if (isGreenDest) {
            const firstRoute = routes[0];
            const fIdx = (typeof firstRoute?.forestStartIndex === 'number') ? firstRoute.forestStartIndex : (firstRoute?.points?.length >= 24 ? 23 : -1);
            if (fIdx > 0 && fIdx < firstRoute.points.length) {
              const entryPos = firstRoute.points[fIdx];
              destPinsLayer.appendChild(createSvg('g', { id: 'forest-entry-pin', class: 'pin pin-dest dest-green', transform: `translate(${entryPos[0]},${entryPos[1]})` }, `
                <circle class="dest-glow-outer" r="32"></circle><circle class="dest-glow" r="26"></circle><circle class="dest-core" r="22"></circle><circle class="dest-center" r="8"></circle>
                <text class="pin-label shadow" x="0" y="-38" text-anchor="middle">🌲 숲길 진입</text><text class="pin-label" x="0" y="-38" text-anchor="middle">🌲 숲길 진입</text>
              `));
            }
          }
          const finalPinLabel = isGreenDest ? '🚩 도착' : `🚩 ${ROUTE_LABELS[destKey] || '도착'}`;
          destPinsLayer.appendChild(createSvg('g', { id: 'active-dest-pin', class: `pin pin-dest ${isGreenDest ? 'dest-green' : ''}`, transform: `translate(${targetPos[0]},${targetPos[1]})` }, `
            <circle class="dest-glow-outer" r="36"></circle><circle class="dest-glow" r="32"></circle><circle class="dest-core" r="28"></circle><circle class="dest-center" r="10"></circle>
            <text class="pin-label shadow" x="0" y="-45" text-anchor="middle">${finalPinLabel}</text><text class="pin-label" x="0" y="-45" text-anchor="middle">${finalPinLabel}</text>
          `));
        }
      }

      function resetPreview() {
        clearTimeout(animTimer);
        routesLayer.innerHTML = ''; overlayLayer.innerHTML = ''; arrowsLayer.innerHTML = ''; destPinsLayer.innerHTML = '';
        destBtns.forEach(b => b.classList.remove('active')); activeDestKey = null;
        routeLegend.classList.remove('show'); legendGreen.style.display = 'none'; zoomToFull();
      }

      function drawRoutePath(pathEl, overlayEl, arrowEl, maxDur = 1800, minDur = 700, onDone = null) {
        if (!pathEl) { if (onDone) onDone(); return; }
        const L = pathEl.getTotalLength();
        pathEl.style.strokeDasharray = L; pathEl.style.strokeDashoffset = L;
        pathEl.classList.add('visible'); pathEl.getBoundingClientRect();
        const dur = Math.min(maxDur, Math.max(minDur, L * 1.0));
        pathEl.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(.3,.6,.2,1)`;
        requestAnimationFrame(() => { pathEl.style.strokeDashoffset = 0; });
        setTimeout(() => {
          pathEl.style.strokeDasharray = 'none'; pathEl.style.strokeDashoffset = '0';
          if (overlayEl) overlayEl.classList.add('flowing');
          if (arrowEl) arrowEl.style.visibility = 'visible';
          if (onDone) onDone();
        }, dur);
      }

      function playDestination(destKey) {
        if (editMode) return;
        clearTimeout(animTimer);
        const routes = getDestRoutes(destKey);
        if (!routes || routes.length === 0) { setHint(`경로가 없습니다.`); return; }
        activeDestKey = destKey; renderAllPathsForDest(destKey); zoomToAllRoutes(destKey);
        if (destKey === 'forest') {
          routeLegend.classList.add('show'); legendRedText.textContent = '코스 1 (진입로)';
          legendBlue.style.display = routes.length >= 2 ? 'flex' : 'none';
          if (routes.length >= 2) legendBlueText.textContent = '코스 2 (진입로)';
          legendGreen.style.display = 'flex'; legendGreenText.textContent = '🌲 힐링 숲길 구간';
          setHint(`<b>${ROUTE_LABELS[destKey]}</b> 이동 경로입니다.`);
        } else if (routes.length >= 2) {
          routeLegend.classList.add('show'); legendRedText.textContent = routes[0]?.name || '코스 1';
          legendBlue.style.display = 'flex'; legendBlueText.textContent = routes[1]?.name || '코스 2';
          legendGreen.style.display = 'none'; setHint(`<b>${ROUTE_LABELS[destKey]}</b> 이동 경로입니다.`);
        } else {
          routeLegend.classList.add('show'); legendRedText.textContent = routes[0]?.name || '코스 1';
          legendBlue.style.display = 'none'; legendGreen.style.display = 'none'; setHint(`<b>${ROUTE_LABELS[destKey]}</b> 이동 경로입니다.`);
        }
        if (destKey === 'forest') {
          animTimer = setTimeout(() => {
            const p0 = document.getElementById('active-route-0'), o0 = document.getElementById('active-overlay-0'), a0 = document.getElementById('flow-arrow-0');
            const p1 = document.getElementById('active-route-1'), o1 = document.getElementById('active-overlay-1'), a1 = document.getElementById('flow-arrow-1');
            drawRoutePath(p0, o0, a0, 1800, 700, () => {
              document.getElementById('forest-entry-pin')?.classList.add('show');
              drawRoutePath(p1, o1, a1, 1600, 600, () => { document.getElementById('active-dest-pin')?.classList.add('show'); });
            });
          }, 450);
        } else {
          animTimer = setTimeout(() => {
            routesLayer.querySelectorAll('.route-path').forEach((path, idx) => {
              drawRoutePath(path, document.getElementById(`active-overlay-${idx}`), document.getElementById(`flow-arrow-${idx}`), 2200, 700, () => { document.getElementById('active-dest-pin')?.classList.add('show'); });
            });
          }, 450);
        }
      }

      destBtns.forEach(btn => btn.addEventListener('click', () => {
        const k = btn.dataset.route;
        if (editMode) enterEditRoute(k, 0);
        else { resetPreview(); destBtns.forEach(b => b.classList.remove('active')); btn.classList.add('active'); playDestination(k); }
      }));

      document.getElementById('stopBtn').addEventListener('click', () => { resetPreview(); setHint('원하시는 목적지 버튼을 눌러주세요.'); });

      function switchStart(key) { resetPreview(); currentStartKey = key; updateStartPin(); }
      startBtns.forEach(btn => btn.addEventListener('click', () => {
        const key = btn.dataset.start;
        if (editMode) { currentStartKey = key; updateStartPin(); enterEditRoute(editingDestKey, editingPathIndex); }
        else switchStart(key);
      }));

      function setHint(h) { hintText.innerHTML = h; }

      function enterEditRoute(destKey, pathIndex) {
        if (!destKey) return;
        editingDestKey = destKey; editingPathIndex = pathIndex;
        destBtns.forEach(b => b.classList.toggle('editing', b.dataset.route === destKey));
        renderAllPathsForDest(destKey);
        const routeObj = getDestRoutes(destKey)[pathIndex];
        setHint(`<b>${ROUTE_LABELS[destKey]} (${routeObj?.name || '코스'})</b> 수정 모드`);
        redrawEditGuide(); renderEditPathButtons();
      }

      function renderEditPathButtons() {
        if (!editingDestKey) return;
        const routes = getDestRoutes(editingDestKey);
        document.querySelectorAll('.path-tab').forEach(el => el.remove());
        routes.forEach((rt, idx) => {
          const b = document.createElement('button');
          b.className = 'path-tab' + (idx === editingPathIndex ? ' active' : '');
          b.textContent = `${rt.name} 수정`; b.onclick = () => enterEditRoute(editingDestKey, idx);
          editToolbar.insertBefore(b, document.getElementById('addPathBtn'));
        });
      }

      function redrawEditGuide() {
        editDotsLayer.innerHTML = '';
        if (!editingDestKey) return;
        const currentRoute = getDestRoutes(editingDestKey)[editingPathIndex];
        const pts = currentRoute?.points; if (!pts) return;
        const fIdx = (typeof currentRoute.forestStartIndex === 'number') ? currentRoute.forestStartIndex : (editingDestKey === 'forest' && pts.length >= 24 ? 23 : -1);
        if (pts.length > 1) {
          if (fIdx > 0 && fIdx < pts.length) {
            editDotsLayer.appendChild(createSvg('polyline', { class: 'guide-line', points: pts.slice(0, fIdx + 1).map(p => p.join(',')).join(' ') }));
            editDotsLayer.appendChild(createSvg('polyline', { class: 'guide-line forest-guide', points: pts.slice(fIdx).map(p => p.join(',')).join(' ') }));
          } else {
            editDotsLayer.appendChild(createSvg('polyline', { class: `guide-line ${editingDestKey === 'forest' ? 'forest-guide' : ''}`, points: pts.map(p => p.join(',')).join(' ') }));
          }
        }
        pts.forEach((p, i) => {
          const isForestDot = (fIdx >= 0 && i >= fIdx);
          editDotsLayer.appendChild(createSvg('g', { transform: `translate(${p[0]},${p[1]})` }, `
            <circle class="edit-dot ${isForestDot ? 'forest-entry' : ''}" r="18"></circle><text class="edit-dot-num" y="1">${i}</text>
          `));
        });
      }

      svg.addEventListener('click', (evt) => {
        if (!editMode || hasDragged) return;
        const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        if (editingDestKey) { getDestRoutes(editingDestKey)[editingPathIndex].points.push([Math.round(p.x), Math.round(p.y)]); redrawEditGuide(); renderAllPathsForDest(editingDestKey); }
      });

      document.getElementById('setForestStartBtn').addEventListener('click', () => {
        if (!editingDestKey) return;
        const currentRoute = getDestRoutes(editingDestKey)[editingPathIndex];
        const pts = currentRoute.points;
        if (pts.length < 2) { showToast('⚠️ 점을 2개 이상 찍은 후 지정해 주세요.'); return; }
        currentRoute.forestStartIndex = pts.length - 1; redrawEditGuide(); renderAllPathsForDest(editingDestKey);
        showToast('🌲 숲길 시작점 지정 완료!');
      });

      document.getElementById('undoPoint').addEventListener('click', () => {
        if (!editingDestKey) return;
        const currentRoute = getDestRoutes(editingDestKey)[editingPathIndex];
        if (currentRoute.points.length > 1) { currentRoute.points.pop(); if (currentRoute.forestStartIndex >= currentRoute.points.length) delete currentRoute.forestStartIndex; }
        redrawEditGuide(); renderAllPathsForDest(editingDestKey);
      });

      document.getElementById('clearRoute').addEventListener('click', () => {
        if (!editingDestKey) return;
        const currentRoute = getDestRoutes(editingDestKey)[editingPathIndex];
        currentRoute.points = [getStart().slice()]; delete currentRoute.forestStartIndex;
        redrawEditGuide(); renderAllPathsForDest(editingDestKey);
      });

      document.getElementById('addPathBtn').addEventListener('click', () => {
        if (!editingDestKey) return;
        const routes = getDestRoutes(editingDestKey);
        routes.push({ id: `${editingDestKey}_${routes.length}`, name: `코스 ${routes.length + 1}`, color: routes.length % 2 === 0 ? 'red' : 'blue', points: [getStart().slice()] });
        enterEditRoute(editingDestKey, routes.length - 1);
      });

      function getExportJsonString() { return JSON.stringify({ startPresets: START_PRESETS, destPresets: DEST_PRESETS, currentStart: currentStartKey, ALL_ROUTES }, null, 2); }

      document.getElementById('exportJson').addEventListener('click', () => {
        exportBox.classList.toggle('show');
        if (exportBox.classList.contains('show')) { exportArea.value = getExportJsonString(); exportArea.select(); }
      });

      document.getElementById('copyJsonBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(getExportJsonString()).then(() => showToast('📋 클립보드 복사 완료!'));
      });

      document.getElementById('downloadJsonBtn').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([getExportJsonString()], { type: 'application/json' }));
        a.download = '포천아트밸리_경로데이터.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('💾 "포천아트밸리_경로데이터.json" 다운로드 완료!');
      });

      document.getElementById('closeExportBtn').addEventListener('click', () => {
        exportBox.classList.remove('show');
      });

      modeToggleBtn.addEventListener('click', () => {
        editMode = !editMode;
        modeToggleBtn.classList.toggle('on', editMode);
        modeToggleBtn.textContent = editMode ? '✅ 제작 모드 ON' : '🖊 경로 제작 모드';
        editToolbar.classList.toggle('show', editMode);
        previewReset.style.display = editMode ? 'none' : 'flex';
        exportBox.classList.remove('show');

        if (editMode) {
          resetPreview();
          setHint(`[관리자] 목적지를 누르면 경로를 편집할 수 있습니다.`);
        } else {
          editingDestKey = null; editDotsLayer.innerHTML = '';
          destBtns.forEach(b => b.classList.remove('editing'));
          zoomToFull(); routesLayer.innerHTML = ''; overlayLayer.innerHTML = ''; arrowsLayer.innerHTML = '';
          setHint('원하시는 목적지 버튼을 눌러주세요.');
        }
      });

      // ── 초기화 ──
      updateStartPin();

      /* ── 키오스크 하드닝 ── */
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('dragstart', e => e.preventDefault());
      let lastTouchEnd = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      let secretTaps = 0, secretTimer = null;
      document.getElementById('secretZone').addEventListener('pointerdown', () => {
        secretTaps++; clearTimeout(secretTimer);
        secretTimer = setTimeout(() => { secretTaps = 0; }, 2000);
        if (secretTaps >= 5) {
          secretTaps = 0;
          document.querySelector('.admin-bar').classList.add('show');
          document.getElementById('secretZone').style.display = 'none';
        }
      });

      /* ── 무인 자동 순환(1분 주기) 및 20초 유휴 초기화 복귀 ── */
      const IDLE_RESET_MS = 20000;  // 경로 표시 후 20초 뒤 전체 지도(초기화)로 복귀
      const AUTO_CYCLE_MS = 60000;  // 무조작 1분(60초)마다 다음 목적지 자동 실행
      const AUTO_DEST_KEYS = ['lake', 'cafe', 'mono', 'forest'];
      let autoIndex = 0;
      let idleResetTimer = null;
      let autoCycleTimer = null;

      // 20초 동안 추가 조작 없으면 전체 지도로 자동 복귀
      function armIdleReset() {
        clearTimeout(idleResetTimer);
        if (editMode) return;
        idleResetTimer = setTimeout(() => {
          resetPreview();
          setHint('원하시는 목적지 버튼을 눌러주세요.');
        }, IDLE_RESET_MS);
      }

      // 무인 자동 다음 목적지 실행 (1분마다)
      function triggerAutoNext() {
        if (editMode) return;
        const destKey = AUTO_DEST_KEYS[autoIndex];
        autoIndex = (autoIndex + 1) % AUTO_DEST_KEYS.length;

        // 버튼 누른 것과 동일하게 UI 활성화 및 경로 안내 실행
        resetPreview();
        const targetBtn = destBtns.find(b => b.dataset.route === destKey);
        if (targetBtn) targetBtn.classList.add('active');
        playDestination(destKey);
        armIdleReset(); // 20초 후 자동으로 전체화면 복귀

        // 다음 1분 후 또 다른 목적지 실행 예약
        clearTimeout(autoCycleTimer);
        autoCycleTimer = setTimeout(triggerAutoNext, AUTO_CYCLE_MS);
      }

      // 사용자가 터치하거나 조작할 때 타이머 리셋
      function onUserActivity() {
        clearTimeout(autoCycleTimer);
        if (editMode) return;
        armIdleReset();
        autoCycleTimer = setTimeout(triggerAutoNext, AUTO_CYCLE_MS);
      }

      // 사용자가 목적지 버튼 직접 클릭 시 인덱스 동기화
      destBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const k = btn.dataset.route;
          const idx = AUTO_DEST_KEYS.indexOf(k);
          if (idx !== -1) autoIndex = (idx + 1) % AUTO_DEST_KEYS.length;
        });
      });

      // 전체보기(초기화) 버튼 클릭 시
      document.getElementById('stopBtn').addEventListener('click', () => {
        clearTimeout(idleResetTimer);
        clearTimeout(autoCycleTimer);
        autoCycleTimer = setTimeout(triggerAutoNext, AUTO_CYCLE_MS);
      });

      // 터치/클릭 등 모든 화면 조작 시 타이머 갱신
      document.addEventListener('pointerdown', onUserActivity, { passive: true });

      // 앱 시작 시 1분 후 첫 자동 순환 예약
      autoCycleTimer = setTimeout(triggerAutoNext, AUTO_CYCLE_MS);

      document.getElementById('closeAdminBtn').addEventListener('click', () => {
        document.querySelector('.admin-bar').classList.remove('show');
        document.getElementById('secretZone').style.display = 'block';
        if (editMode) document.getElementById('modeToggle').click();
      });

      // ── 스마트폰 QR 코드 동적 렌더링 ──
      function initQrCode() {
        // 실제 방문객 스마트폰 카메라 스캔용 공식 GitHub Pages 배포 URL
        const GITHUB_PAGES_URL = 'https://buvi-kr.github.io/kiosk-map/qr.html';

        let targetUrl = GITHUB_PAGES_URL;
        if (window.location.protocol.startsWith('http') && !['localhost', '127.0.0.1'].includes(window.location.hostname)) {
          targetUrl = window.location.href.replace(/index\.html.*/i, 'qr.html');
        }

        const headerQrCodeEl = document.getElementById('headerQrCode');
        if (typeof QRCode !== 'undefined' && headerQrCodeEl) {
          headerQrCodeEl.innerHTML = '';
          new QRCode(headerQrCodeEl, {
            text: targetUrl,
            width: 56,
            height: 56,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }

      // QR 초기화 실행
      setTimeout(initQrCode, 50);
    })();
  </script>
  <script src="qrcode.min.js"></script>
</body>

</html>
