<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR로 팜플렛 확인하기 (출력용 12cm × 18cm)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="qrcode.min.js"></script>
  <style>
    :root {
      --print-w: 120mm; /* 가로 12cm */
      --print-h: 180mm; /* 세로 18cm */
      --header-h: 60mm; /* 상단 6cm */
      --qr-h: 120mm;    /* 하단 12cm */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #cbd5e1;
      color: #000000;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    /* ── 화면 전용 툴바 (인쇄 시 자동 숨김) ── */
    .screen-toolbar {
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      max-width: 600px;
      width: 100%;
      justify-content: space-between;
    }

    .toolbar-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
    }

    .toolbar-sub {
      font-size: 12px;
      color: #64748b;
    }

    .btn-print {
      background: #047857;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(4, 120, 87, 0.35);
      transition: transform 0.15s, background 0.15s;
    }

    .btn-print:hover {
      background: #065f46;
      transform: translateY(-1px);
    }

    .btn-print:active {
      transform: scale(0.97);
    }

    /* ── 출력용 본체 카드 (규격: 가로 12cm × 세로 18cm) ── */
    .print-card-wrapper {
      position: relative;
    }

    .print-card {
      width: var(--print-w);
      height: var(--print-h);
      background: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
      border: 1.5px dashed #475569; /* 자르기 편한 외곽 재단선 */
      overflow: hidden;
    }

    /* ── ① 상단 영역 (6cm): 과학관 로고 + 2배 확대된 초대형 텍스트 ── */
    .card-header-zone {
      width: 100%;
      height: var(--header-h);
      padding: 3mm 4mm 2.5mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      background: #ffffff;
      border-bottom: 2.5px solid #000000;
    }

    /* 천문과학관 공식 로고 */
    .logo-container {
      height: 7.5mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .science-logo-img {
      height: 100%;
      max-width: 50mm;
      object-fit: contain;
    }

    /* 메인 타이틀: 2배 크기 초대형 폰트 (39pt) */
    .main-title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
      margin: 0.5mm 0;
    }

    .main-title-line1 {
      font-size: 39pt; /* 2배 크기로 대폭 확대 */
      font-weight: 950;
      letter-spacing: -0.05em;
      color: #000000;
      white-space: nowrap;
    }

    .main-title-line1 .qr-tag {
      color: #047857;
      margin-right: 2px;
    }

    .main-title-line2 {
      font-size: 39pt; /* 2배 크기 */
      font-weight: 950;
      letter-spacing: -0.05em;
      color: #000000;
      white-space: nowrap;
    }

    /* 안내 배너: 시인성 극대화 (21pt 진한 녹색 배너) */
    .main-instruction-banner {
      font-size: 21pt;
      font-weight: 950;
      letter-spacing: -0.04em;
      color: #ffffff;
      background: #047857;
      padding: 2.2mm 0;
      border-radius: 4.5mm;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(4, 120, 87, 0.25);
    }

    /* ── ② 하단 영역 (12cm × 12cm): 여백 없이 꽉 찬 초대형 QR ── */
    .card-qr-zone {
      width: 100%;
      height: var(--qr-h);
      padding: 2mm; /* 여백 극소화 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      position: relative;
    }

    .qr-full-wrapper {
      width: 114mm;  /* 120mm 중 114mm 꽉 채움 */
      height: 112mm; /* 120mm 중 112mm 꽉 채움 */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrOutput {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrOutput img, #qrOutput canvas {
      display: block;
      width: 110mm !important;
      height: 110mm !important;
    }

    .bottom-url-hint {
      font-size: 6.5pt;
      font-weight: 700;
      color: #64748b;
      margin-top: 1mm;
      text-align: center;
    }

    /* ── 인쇄 전용 CSS (@media print) ── */
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .screen-toolbar {
        display: none !important;
      }

      .print-card-wrapper {
        margin: 0 auto;
        page-break-inside: avoid;
      }

      .print-card {
        border: 1px dashed #64748b !important; /* 재단선 유지 */
        box-shadow: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      @page {
        size: 120mm 180mm;
        margin: 0;
      }
    }
  </style>
</head>

<body>

  <!-- 화면 상단 도구 모음 -->
  <div class="screen-toolbar no-print">
    <div class="toolbar-info">
      <div class="toolbar-title">🖨️ 포천아트밸리 QR 팜플렛 안내판</div>
      <div class="toolbar-sub">12cm × 18cm (과학관 로고 + 2줄 초대형 텍스트)</div>
    </div>
    <button class="btn-print" onclick="window.print()">
      <span>🖨️</span>
      <span>인쇄하기 (Ctrl+P)</span>
    </button>
  </div>

  <!-- 12cm × 18cm 출력 카드 -->
  <div class="print-card-wrapper">
    <div class="print-card" id="printCard">
      
      <!-- 상단 6cm 영역: 과학관 로고 + 초대형 2줄 텍스트 -->
      <header class="card-header-zone">
        
        <!-- 과학관 로고 -->
        <div class="logo-container">
          <img src="천문과학관_로고.png" alt="포천아트밸리 천문과학관 로고" class="science-logo-img" onerror="this.style.display='none'">
        </div>

        <!-- 메인 타이틀 (기존 대비 글자 크기 2배 대폭 확대) -->
        <h1 class="main-title-block">
          <span class="main-title-line1"><span class="qr-tag">QR로</span> 팜플렛</span>
          <span class="main-title-line2">확인하기</span>
        </h1>

        <!-- 하단 촬영 안내 배너 (20.5pt 선명한 안내) -->
        <div class="main-instruction-banner">
          <span>📷</span>
          <span>카메라로 QR을 비추세요</span>
        </div>

      </header>

      <!-- 하단 12cm × 12cm 영역 (여백 없이 꽉 찬 110mm 대형 QR) -->
      <section class="card-qr-zone">
        <div class="qr-full-wrapper">
          <div id="qrOutput"></div>
        </div>
        <div class="bottom-url-hint" id="targetUrlText">https://kiosk-map.cje0173.workers.dev/leaflet.html</div>
      </section>

    </div>
  </div>

  <script>
    function generateLeafletQr() {
      let targetUrl = '';
      if (window.location.protocol.startsWith('http') && !['localhost', '127.0.0.1'].includes(window.location.hostname)) {
        const path = window.location.pathname;
        const basePath = path.substring(0, path.lastIndexOf('/') + 1);
        targetUrl = window.location.origin + basePath + 'leaflet.html';
      } else {
        targetUrl = 'https://kiosk-map.cje0173.workers.dev/leaflet.html';
      }

      document.getElementById('targetUrlText').innerText = targetUrl;

      const qrContainer = document.getElementById('qrOutput');
      qrContainer.innerHTML = '';

      if (typeof QRCode !== 'undefined') {
        new QRCode(qrContainer, {
          text: targetUrl,
          width: 440,
          height: 440,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }

    window.addEventListener('DOMContentLoaded', generateLeafletQr);
  </script>
</body>

</html>
