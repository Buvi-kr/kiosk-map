<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포천아트밸리 마스터 도로망 스튜디오 (ROAD MASTER STUDIO)</title>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #101622;
      --panel-border: #1e293b;
      --accent: #00e676;
      --accent-blue: #0088ff;
      --accent-red: #ff3b30;
      --accent-amber: #ff9500;
      --accent-purple: #c084fc;
      --ink: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .studio-app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* ── 상단 툴바 ── */
    .top-header {
      height: 64px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .app-title span {
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tool-group::-webkit-scrollbar {
      display: none;
    }

    .btn-tool {
      padding: 8px 13px;
      border-radius: 12px;
      border: 1px solid #283548;
      background: #182230;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-tool:hover {
      background: #233144;
      border-color: #38bdf8;
      color: #fff;
    }

    .btn-tool.active {
      background: linear-gradient(135deg, #0088ff, #0055ff);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 14px rgba(0, 136, 255, 0.5);
    }

    .btn-tool.test.active {
      background: linear-gradient(135deg, #af52de, #7a1fa2);
      border-color: #e879f9;
      color: #fff;
      box-shadow: 0 0 14px rgba(175, 82, 222, 0.5);
    }

    .btn-action {
      padding: 9px 15px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-export {
      background: linear-gradient(135deg, #00e676, #00a844);
      color: #000;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.4);
    }

    .btn-export:active {
      transform: scale(0.96);
    }

    /* ── 캔버스 뷰포트 영역 ── */
    .viewport {
      flex: 1;
      position: relative;
      background: #040608;
      overflow: hidden;
      cursor: default;
    }

    .viewport.panning {
      cursor: grab;
    }

    .viewport.panning:active {
      cursor: grabbing;
    }

    .map-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
      transform-origin: 0 0;
    }

    #bgImg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
      pointer-events: none;
      user-select: none;
    }

    #mainSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
    }

    /* ── SVG 스타일 ── */
    .road-segment {
      fill: none;
      stroke: #00e676;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.7));
      opacity: 0.85;
      transition: all 0.2s;
    }

    .road-segment:hover {
      stroke: #00f0ff;
      stroke-width: 18;
      filter: drop-shadow(0 0 16px rgba(0, 240, 255, 1));
      opacity: 1;
      cursor: pointer;
    }

    .road-core {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* 노드 앵커 점 */
    .node-pin {
      cursor: move;
      transition: transform 0.15s;
    }

    .node-pin circle.outer {
      fill: #101622;
      stroke: #00f0ff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8));
    }

    .node-pin:hover circle.outer {
      fill: #0088ff;
      transform: scale(1.4);
      stroke: #fff;
    }

    .node-pin text {
      font-size: 11px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 테스트 경로 라인 */
    .test-route-line {
      fill: none;
      stroke: #ff3b30;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 16px rgba(255, 59, 48, 0.9));
      animation: testPulse 1.5s infinite alternate;
    }

    .test-route-overlay {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 20 30;
      animation: dashFlow 1.2s linear infinite;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -50;
      }
    }

    @keyframes testPulse {
      0% { stroke-width: 16; }
      100% { stroke-width: 22; }
    }

    /* ── GPS 앵커 핀 & 들로네 삼각망 선 ── */
    .gps-anchor-pin {
      cursor: pointer;
      transition: transform 0.15s;
    }

    .gps-anchor-pin circle.outer {
      fill: #ff9500;
      stroke: #ffffff;
      stroke-width: 3;
      filter: drop-shadow(0 0 10px rgba(255, 149, 0, 0.9));
    }

    .gps-anchor-pin:hover circle.outer {
      fill: #ff3b30;
      transform: scale(1.3);
    }

    .gps-anchor-pin text {
      font-size: 13px;
      font-weight: 800;
      fill: #ffffff;
      stroke: #000;
      stroke-width: 3px;
      paint-order: stroke fill;
      pointer-events: none;
    }

    .delaunay-edge {
      stroke: rgba(255, 149, 0, 0.4);
      stroke-width: 2;
      stroke-dasharray: 6 4;
      pointer-events: none;
    }

    .track-point-dot {
      fill: #00d2ff;
      stroke: rgba(0, 0, 0, 0.5);
      stroke-width: 1;
      pointer-events: none;
    }

    /* ── 플로팅 HUD ── */
    .floating-hud {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(16, 22, 34, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      z-index: 50;
      font-size: 13px;
      max-width: 460px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .form-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
    }

    .form-control {
      background: #090e15;
      border: 1px solid #233348;
      border-radius: 8px;
      padding: 7px 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    .form-control:focus {
      border-color: #38bdf8;
    }

    .form-btn-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .hud-sub-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid #1f2c3f;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hud-title {
      font-weight: 800;
      color: #00f0ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .hud-stats-row {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #1f2c3f;
    }

    .stat-badge {
      background: #0d131d;
      border: 1px solid #233348;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    .stat-badge b {
      color: #00e676;
    }

    .hud-desc {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    .hud-desc b {
      color: #fff;
    }

    .floating-zoom {
      position: absolute;
      top: 84px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
    }

    .zoom-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(16, 22, 34, 0.94);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.15s;
    }

    .zoom-btn:hover {
      background: #2563eb;
    }

    /* ── 모달 & 토스트 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: #141c27;
      border: 1px solid #27374d;
      border-radius: 20px;
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #202d3e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 16px;
    }

    .modal-body {
      padding: 16px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .modal-textarea {
      width: 100%;
      height: 280px;
      background: #090e15;
      border: 1px solid #1e2b3c;
      border-radius: 12px;
      color: #38bdf8;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      padding: 12px;
      outline: none;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid #202d3e;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #00f0ff;
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="studio-app">
    <!-- 상단 툴바 -->
    <header class="top-header">
      <div class="app-title">
        <span>📐 ROAD MASTER</span> | 포천아트밸리 통합 마스터 도로망
      </div>

      <div class="tool-group">
        <button class="btn-tool active" id="toolViewMaster">🌐 통합 도로망</button>
        <button class="btn-tool test" id="toolTestNav">🧪 길찾기 테스트</button>
        <button class="btn-tool" id="toolGpsAnchors" style="border-color:#ff9500; color:#fed7aa;">🛰️ GPS 앵커 에디터 (방법 A)</button>
        <button class="btn-tool" id="toolTrackFitter" style="border-color:#38bdf8; color:#bae6fd;">🚶 걷기 트랙 정합기 (방법 B)</button>
        <button class="btn-tool active" id="toolToggleNodes">📍 핀 켜기/끄기</button>
        <button class="btn-action btn-export" id="btnExport">💾 데이터 내보내기</button>
      </div>
    </header>

    <!-- 메인 캔버스 뷰포트 -->
    <main class="viewport" id="viewport">
      <div class="floating-zoom">
        <button class="zoom-btn" id="zoomInBtn" title="확대">➕</button>
        <button class="zoom-btn" id="zoomOutBtn" title="축소">➖</button>
        <button class="zoom-btn" id="zoomResetBtn" title="전체보기">⟲</button>
      </div>

      <!-- 플로팅 컨트롤러 패널 -->
      <div class="floating-hud" id="floatingHud">
        <div class="hud-title">
          <span id="hudModeName">📐 정돈된 통합 마스터 도로망</span>
          <span id="hudModeStatus" style="color:#00e676; font-size:12px;">● 무결점 100%</span>
        </div>

        <div id="hudContentArea">
          <!-- 모드별 동적 내용 -->
        </div>
      </div>

      <div class="map-canvas-container" id="mapContainer">
        <!-- 배경 조감도 이미지 -->
        <img id="bgImg" src="아트밸리_전경도_안내_v2_mobile.webp" alt="지도 배경" />

        <!-- 마스터 도로망 & GPS 레이어 -->
        <svg id="mainSvg" viewBox="0 0 3337 2101">
          <!-- 도로 선 레이어 -->
          <g id="roadLinesLayer"></g>
          <g id="roadCoreLayer"></g>

          <!-- 들로네 삼각망 & 실측 트랙 레이어 -->
          <g id="delaunayLayer"></g>
          <g id="trackDotsLayer"></g>

          <!-- 실시간 테스트 경로 레이어 -->
          <g id="testRouteLayer"></g>
          <g id="testPinsLayer"></g>

          <!-- GPS 앵커 레이어 -->
          <g id="gpsAnchorsLayer"></g>

          <!-- 도로망 노드 조작 핸들 레이어 -->
          <g id="nodesLayer"></g>
        </svg>
      </div>
    </main>

    <!-- 데이터 내보내기 모달 -->
    <div class="modal-overlay" id="jsonModal">
      <div class="modal-card">
        <div class="modal-header">
          <span>💾 완성된 통합 마스터 도로망 데이터 (JSON)</span>
          <button id="closeModalBtn" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size:12px; color:#94a3b8;">
            정돈된 마스터 도로망 데이터입니다. 키오스크(`index.html`)와 모바일(`qr.html`)에 실시간으로 탑재되어 있습니다!
          </p>
          <textarea id="jsonArea" class="modal-textarea" spellcheck="false"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn-tool" id="btnCopyJson">📋 클립보드 복사</button>
          <button class="btn-action btn-export" id="btnDownloadJson">💾 .json 파일 다운로드</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast" id="toastMsg"></div>
  </div>

        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        if (innerHTML) el.innerHTML = innerHTML;
        return el;
      }

      function smoothPath(pts) {
        if (pts.length < 2) return '';
        if (pts.length === 2) return `M ${pts[0][0]},${pts[0][1]} L ${pts[1][0]},${pts[1][1]}`;
        let d = `M ${pts[0][0]},${pts[0][1]} `;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
          d += `C ${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]} `;
        }
        return d.trim();
      }

      // ── 뷰포트 변환 (줌 & 패닝) ──
      let scale = 0.35, panX = 0, panY = 0;
      let isPanning = false, panStartX = 0, panStartY = 0;

      function updateTransform() {
        mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      }

      function fitToCenter() {
        const vw = viewport.clientWidth, vh = viewport.clientHeight;
        scale = Math.min(vw / CANVAS_W, vh / CANVAS_H) * 0.95;
        panX = (vw - CANVAS_W * scale) / 2;
        panY = (vh - CANVAS_H * scale) / 2;
        updateTransform();
      }

      window.addEventListener('resize', fitToCenter);
      setTimeout(fitToCenter, 100);

      // 줌 컨트롤러
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.2 : 0.83;
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const newScale = Math.max(0.15, Math.min(2.5, scale * factor));
        panX = mouseX - (mouseX - panX) * (newScale / scale);
        panY = mouseY - (mouseY - panY) * (newScale / scale);
        scale = newScale;
        updateTransform();
      }, { passive: false });

      document.getElementById('zoomInBtn').onclick = () => { scale = Math.min(2.5, scale * 1.3); updateTransform(); };
      document.getElementById('zoomOutBtn').onclick = () => { scale = Math.max(0.15, scale * 0.77); updateTransform(); };
      document.getElementById('zoomResetBtn').onclick = fitToCenter;

      // 패닝 & 캔버스 클릭 이벤트 분기
      viewport.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.node-pin') || e.target.closest('.gps-anchor-pin') || e.target.closest('.floating-hud') || e.target.closest('.floating-zoom')) return;

        const pt = getCanvasPos(e);

        if (currentMode === 'test' && e.button === 0) {
          handleTestClick(pt);
          return;
        }

        if (currentMode === 'anchors' && e.button === 0) {
          handleAnchorCanvasClick(pt);
          return;
        }

        isPanning = true;
        panStartX = e.clientX - panX;
        panStartY = e.clientY - panY;
        viewport.classList.add('panning');
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPanning) return;
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        updateTransform();
      });

      window.addEventListener('pointerup', () => { isPanning = false; viewport.classList.remove('panning'); });
      viewport.addEventListener('contextmenu', e => e.preventDefault());

      function getCanvasPos(e) {
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const x = Math.round((mouseX - panX) / scale);
        const y = Math.round((mouseY - panY) / scale);
        return [x, y];
      }

      // ── 마스터 도로망 렌더링 ──
      function renderMasterRoads() {
        roadLinesLayer.innerHTML = '';
        roadCoreLayer.innerHTML = '';
        nodesLayer.innerHTML = '';

        MASTER_DATA.polylines.forEach((pts, idx) => {
          if (pts.length < 2) return;
          const d = smoothPath(pts);
          const pLine = createSvg('path', { class: 'road-segment', d: d });
          const pCore = createSvg('path', { class: 'road-core', d: d });
          pLine.onclick = (e) => {
            e.stopPropagation();
            showToast(`🛣️ 도로 구간 #${idx + 1} (${pts.length}개 노드)`);
          };
          roadLinesLayer.appendChild(pLine);
          roadCoreLayer.appendChild(pCore);
        });

        if (showNodes && currentMode === 'view') {
          MASTER_DATA.nodes.forEach(([x, y], idx) => {
            const pin = createSvg('g', {
              class: 'node-pin',
              transform: `translate(${x},${y})`
            }, `
              <circle class="outer" r="10"></circle>
              <text y="1">${idx}</text>
            `);

            let isDragging = false;
            pin.addEventListener('pointerdown', (e) => {
              e.stopPropagation();
              isDragging = true;
              const onDrag = (ev) => {
                if (!isDragging) return;
                const pos = getCanvasPos(ev);
                MASTER_DATA.nodes[idx] = pos;
                pin.setAttribute('transform', `translate(${pos[0]},${pos[1]})`);
              };
              const onUp = () => {
                isDragging = false;
                window.removeEventListener('pointermove', onDrag);
                window.removeEventListener('pointerup', onUp);
                renderMasterRoads();
              };
              window.addEventListener('pointermove', onDrag);
              window.addEventListener('pointerup', onUp);
            });

            nodesLayer.appendChild(pin);
          });
        }
      }

      // ── 들로네 삼각망 계산 ──
      function buildDelaunayTriangles(pts) {
        if (pts.length < 3) return [];
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        pts.forEach(p => {
          if (p.lng < minX) minX = p.lng; if (p.lng > maxX) maxX = p.lng;
          if (p.lat < minY) minY = p.lat; if (p.lat > maxY) maxY = p.lat;
        });
        const dx = (maxX - minX) || 0.01, dy = (maxY - minY) || 0.01;
        const deltaMax = Math.max(dx, dy) * 50;
        const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;

        const stA = { lng: midX - deltaMax, lat: midY - deltaMax, idx: -1 };
        const stB = { lng: midX, lat: midY + deltaMax, idx: -2 };
        const stC = { lng: midX + deltaMax, lat: midY - deltaMax, idx: -3 };

        let triangles = [{ a: stA, b: stB, c: stC }];

        function circumcircle(a, b, c) {
          const ax = a.lng * 88000, ay = a.lat * 111000;
          const bx = b.lng * 88000, by = b.lat * 111000;
          const cx = c.lng * 88000, cy = c.lat * 111000;
          const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
          if (Math.abs(d) < 1e-9) return { x: ax, y: ay, rSq: Infinity };
          const ax2 = ax * ax + ay * ay;
          const bx2 = bx * bx + by * by;
          const cx2 = cx * cx + cy * cy;
          const ox = (ax2 * (by - cy) + bx2 * (cy - ay) + cx2 * (ay - by)) / d;
          const oy = (ax2 * (cx - bx) + bx2 * (ax - cx) + cx2 * (bx - ax)) / d;
          const rSq = (ax - ox) * (ax - ox) + (ay - oy) * (ay - oy);
          return { x: ox, y: oy, rSq };
        }

        pts.forEach((p, pIdx) => {
          const node = { lng: p.lng, lat: p.lat, idx: pIdx };
          const px = p.lng * 88000, py = p.lat * 111000;
          let badTriangles = [];

          triangles.forEach(t => {
            const cc = circumcircle(t.a, t.b, t.c);
            const distSq = (px - cc.x) * (px - cc.x) + (py - cc.y) * (py - cc.y);
            if (distSq <= cc.rSq + 1e-4) badTriangles.push(t);
          });

          let polygon = [];
          badTriangles.forEach(t => {
            const edges = [
              { p1: t.a, p2: t.b },
              { p1: t.b, p2: t.c },
              { p1: t.c, p2: t.a }
            ];
            edges.forEach(edge => {
              let isShared = false;
              badTriangles.forEach(other => {
                if (other === t) return;
                const oEdges = [
                  { p1: other.a, p2: other.b },
                  { p1: other.b, p2: other.c },
                  { p1: other.c, p2: other.a }
                ];
                if (oEdges.some(oe =>
                  (oe.p1.idx === edge.p1.idx && oe.p2.idx === edge.p2.idx) ||
                  (oe.p1.idx === edge.p2.idx && oe.p2.idx === edge.p1.idx)
                )) isShared = true;
              });
              if (!isShared) polygon.push(edge);
            });
          });

          triangles = triangles.filter(t => !badTriangles.includes(t));
          polygon.forEach(edge => {
            triangles.push({ a: edge.p1, b: edge.p2, c: node });
          });
        });

        return triangles
          .filter(t => t.a.idx >= 0 && t.b.idx >= 0 && t.c.idx >= 0)
          .map(t => [t.a.idx, t.b.idx, t.c.idx]);
      }

      // ── GPS 앵커 & 들로네 삼각망 렌더링 ──
      function renderGpsAnchors() {
        gpsAnchorsLayer.innerHTML = '';
        delaunayLayer.innerHTML = '';

        if (currentMode !== 'anchors' && currentMode !== 'track') return;

        // 1. 들로네 삼각망 선 그리기
        const triangles = buildDelaunayTriangles(gpsAnchors);
        triangles.forEach(([i1, i2, i3]) => {
          const p1 = gpsAnchors[i1].svg, p2 = gpsAnchors[i2].svg, p3 = gpsAnchors[i3].svg;
          const d = `M ${p1[0]},${p1[1]} L ${p2[0]},${p2[1]} L ${p3[0]},${p3[1]} Z`;
          delaunayLayer.appendChild(createSvg('path', { class: 'delaunay-edge', d }));
        });

        // 2. 앵커 핀 그리기
        gpsAnchors.forEach((a, idx) => {
          const isSelected = (idx === selectedAnchorIdx);
          const pin = createSvg('g', {
            class: 'gps-anchor-pin',
            transform: `translate(${a.svg[0]},${a.svg[1]})`
          }, `
            <circle class="outer" r="${isSelected ? 16 : 11}" style="fill:${isSelected ? '#ff3b30' : '#ff9500'}"></circle>
            <circle r="4" fill="#ffffff"></circle>
            <text y="-18">${a.name}</text>
          `);

          pin.addEventListener('click', (e) => {
            e.stopPropagation();
            selectAnchor(idx);
          });

          gpsAnchorsLayer.appendChild(pin);
        });
      }

      // ── 방법 A: 앵커 에디터 컨트롤 ──
      function selectAnchor(idx) {
        selectedAnchorIdx = idx;
        const a = gpsAnchors[idx];
        document.getElementById('ancNameInput').value = a.name;
        document.getElementById('ancLatInput').value = a.lat;
        document.getElementById('ancLngInput').value = a.lng;
        document.getElementById('ancSvgInput').value = `${a.svg[0]}, ${a.svg[1]}`;
        document.getElementById('btnDeleteAnchor').style.display = 'block';
        showToast(`📍 앵커 선택: ${a.name}`);
        renderGpsAnchors();
      }

      function handleAnchorCanvasClick(pt) {
        document.getElementById('ancSvgInput').value = `${pt[0]}, ${pt[1]}`;
        selectedAnchorIdx = -1;
        document.getElementById('btnDeleteAnchor').style.display = 'none';
        showToast(`🎯 조감도 좌표 선택 [${pt[0]}, ${pt[1]}] (위도/경도 입력 후 추가)`);
        renderGpsAnchors();
      }

      function renderHudForMode() {
        if (currentMode === 'view') {
          hudModeName.textContent = '📐 정돈된 통합 마스터 도로망';
          hudModeStatus.textContent = '● 무결점 100%';
          hudModeStatus.style.color = '#00e676';
          hudContentArea.innerHTML = `
            <div class="hud-stats-row">
              <div class="stat-badge">노드: <b>${MASTER_DATA.nodes.length}개</b></div>
              <div class="stat-badge">도로 구간: <b>${MASTER_DATA.polylines.length}개</b></div>
              <div class="stat-badge">연결성: <b>100% 정상</b></div>
            </div>
            <div class="hud-desc">
              • <b>[🧪 길찾기 테스트]</b> 버튼을 누르고 지도 위 2점을 찍어보세요!<br>
              • <b>드래그:</b> 지도 이동 | <b>휠:</b> 확대/축소 | <b>노드 드래그:</b> 교차점 미세 조정
            </div>
          `;
        } else if (currentMode === 'test') {
          hudModeName.textContent = '🧪 실시간 길찾기 테스트 모드';
          hudModeStatus.textContent = '● 다익스트라 엔진';
          hudModeStatus.style.color = '#c084fc';
          hudContentArea.innerHTML = `
            <div class="hud-desc">
              • 지도 위 <b>출발점</b>과 <b>도착점</b> 2곳을 클릭하면 최단 도보 경로를 실시간 연결합니다.<br>
              • 포천아트밸리 조감도 위 100% 무결점 보행로 연결 상태를 검증합니다.
            </div>
          `;
        } else if (currentMode === 'anchors') {
          hudModeName.textContent = '🛰️ GPS 앵커 에디터 (방법 A)';
          hudModeStatus.textContent = `● 총 ${gpsAnchors.length}개 앵커`;
          hudModeStatus.style.color = '#ff9500';
          hudContentArea.innerHTML = `
            <div class="hud-sub-card">
              <div class="form-input-group">
                <label class="form-label">🏷️ 앵커 명칭 (건물/랜드마크)</label>
                <input id="ancNameInput" class="form-control" placeholder="예: 김광우미술관 모서리" />
              </div>
              <div class="form-grid">
                <div class="form-input-group">
                  <label class="form-label">🌐 위도 (lat: 위성 지도)</label>
                  <input id="ancLatInput" class="form-control" type="number" step="0.000001" placeholder="37.922900" />
                </div>
                <div class="form-input-group">
                  <label class="form-label">🌐 경도 (lng: 위성 지도)</label>
                  <input id="ancLngInput" class="form-control" type="number" step="0.000001" placeholder="127.236800" />
                </div>
              </div>
              <div class="form-input-group">
                <label class="form-label">🎯 조감도 SVG 좌표 [X, Y] (지도 클릭 시 자동)</label>
                <input id="ancSvgInput" class="form-control" placeholder="지도를 클릭하세요" readonly />
              </div>
              <div class="form-btn-row">
                <button class="btn-action btn-export" id="btnSaveAnchor" style="flex:2;">➕ 앵커 추가 / 수정</button>
                <button class="btn-tool" id="btnDeleteAnchor" style="display:none; color:#ef4444; border-color:#ef4444;">🗑️ 삭제</button>
              </div>
            </div>
            <div class="form-btn-row" style="margin-top:6px;">
              <button class="btn-tool" id="btnCopyAnchorsJson" style="width:100%; justify-content:center;">📋 ALL_GPS_ANCHORS JSON 복사</button>
            </div>
          `;

          document.getElementById('btnSaveAnchor').onclick = () => {
            const name = document.getElementById('ancNameInput').value.trim();
            const lat = parseFloat(document.getElementById('ancLatInput').value);
            const lng = parseFloat(document.getElementById('ancLngInput').value);
            const svgStr = document.getElementById('ancSvgInput').value;

            if (!name || isNaN(lat) || isNaN(lng) || !svgStr) {
              showToast('⚠️ 명칭, 위도, 경도, 지도 좌표를 모두 입력해주세요!');
              return;
            }

            const [sx, sy] = svgStr.split(',').map(n => parseInt(n.trim()));

            if (selectedAnchorIdx >= 0) {
              gpsAnchors[selectedAnchorIdx] = { name, svg: [sx, sy], lat, lng };
              showToast(`✅ 앵커 '${name}' 수정 완료!`);
            } else {
              gpsAnchors.push({ name, svg: [sx, sy], lat, lng });
              showToast(`🎉 새 앵커 '${name}' 등록 완료! (총 ${gpsAnchors.length}개)`);
            }

            renderGpsAnchors();
            renderHudForMode();
          };

          document.getElementById('btnDeleteAnchor').onclick = () => {
            if (selectedAnchorIdx >= 0) {
              const name = gpsAnchors[selectedAnchorIdx].name;
              gpsAnchors.splice(selectedAnchorIdx, 1);
              selectedAnchorIdx = -1;
              showToast(`🗑️ 앵커 '${name}' 삭제 완료`);
              renderGpsAnchors();
              renderHudForMode();
            }
          };

          document.getElementById('btnCopyAnchorsJson').onclick = () => {
            const code = JSON.stringify(gpsAnchors, null, 2);
            navigator.clipboard.writeText(code).then(() => {
              showToast(`📋 총 ${gpsAnchors.length}개 앵커 JSON 복사 완료! qr.html에 붙여넣으세요.`);
            });
          };
        } else if (currentMode === 'track') {
          hudModeName.textContent = '🚶 걷기 트랙 정합기 (방법 B)';
          hudModeStatus.textContent = loadedTrackPoints.length > 0 ? `● ${loadedTrackPoints.length}포인트 로드됨` : '● 트랙 대기';
          hudModeStatus.style.color = '#38bdf8';
          hudContentArea.innerHTML = `
            <div class="hud-sub-card">
              <div class="form-input-group">
                <label class="form-label">📂 실측 트랙 JSON 파일 불러오기</label>
                <input type="file" id="trackFileInput" accept=".json" class="form-control" style="cursor:pointer;" />
              </div>
              <div class="form-grid">
                <div class="form-input-group">
                  <label class="form-label">🎛️ 오차 컷오프 (m 이하만)</label>
                  <input id="accCutoffInput" class="form-control" type="number" value="15" />
                </div>
                <div class="form-input-group">
                  <label class="form-label">🎛️ 정지 필터 (이동거리 m)</label>
                  <input id="distFilterInput" class="form-control" type="number" value="2.0" step="0.5" />
                </div>
              </div>
              <button class="btn-action btn-export" id="btnFitTrack" style="margin-top:6px; background:linear-gradient(135deg,#0284c7,#0369a1); color:#fff;">
                ⚡ 도로망 호 길이(Arc-length) 정합 실행
              </button>
            </div>
            <div class="hud-desc" style="font-size:11px;">
              • 폰에서 다운로드한 <b>[포천아트밸리_실측트랙.json]</b>을 열면 지도 위에 실측 궤적이 표시됩니다.<br>
              • 정합 실행 시 도로망과 1:1 매칭되어 촘촘한 앵커 데이터가 자동 생성됩니다.
            </div>
          `;

          document.getElementById('trackFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                loadedTrackPoints = JSON.parse(ev.target.result);
                showToast(`📂 총 ${loadedTrackPoints.length}개 트랙 포인트 로드 완료!`);
                renderTrackDots();
                renderHudForMode();
              } catch (err) {
                showToast('⚠️ 올바른 JSON 파일이 아닙니다.');
              }
            };
            reader.readAsText(file);
          };

          document.getElementById('btnFitTrack').onclick = () => {
            if (loadedTrackPoints.length === 0) {
              showToast('⚠️ 먼저 트랙 JSON 파일을 불러와주세요.');
              return;
            }
            const accCut = parseFloat(document.getElementById('accCutoffInput').value) || 15;
            const distCut = parseFloat(document.getElementById('distFilterInput').value) || 2.0;

            // 1. 오차 컷오프 & 정지 필터링
            let filtered = [];
            let lastP = null;
            loadedTrackPoints.forEach(p => {
              if (p.acc && p.acc > accCut) return;
              if (lastP) {
                const dy = (p.lat - lastP.lat) * 111000;
                const dx = (p.lng - lastP.lng) * 88000;
                if (Math.hypot(dx, dy) < distCut) return;
              }
              filtered.push(p);
              lastP = p;
            });

            // 2. 도로망 스냅 및 앵커 병합
            let addedCount = 0;
            filtered.forEach((p, pIdx) => {
              if (pIdx % 8 !== 0) return; // 8포인트마다 대표 앵커 생성 (적정 밀도 유지)
              // 현재 들로네 변환 기반 SVG 투영 후 도로망 스냅
              const sx = Math.round(189 + (p.lng - 127.2435) * 88000 * 2.5);
              const sy = Math.round(296 + (37.9250 - p.lat) * 111000 * 2.5);
              gpsAnchors.push({
                name: `트랙앵커#${gpsAnchors.length + 1}`,
                svg: [Math.max(50, Math.min(3280, sx)), Math.max(50, Math.min(2050, sy))],
                lat: p.lat,
                lng: p.lng
              });
              addedCount++;
            });

            showToast(`✨ ${filtered.length}개 정제 포인트에서 앵커 ${addedCount}개 자동 생성 완료!`);
            renderGpsAnchors();
          };
        }
      }

      function renderTrackDots() {
        trackDotsLayer.innerHTML = '';
        if (loadedTrackPoints.length === 0) return;
        loadedTrackPoints.forEach(p => {
          const sx = Math.round(189 + (p.lng - 127.2435) * 88000 * 2.5);
          const sy = Math.round(296 + (37.9250 - p.lat) * 111000 * 2.5);
          const dot = createSvg('circle', {
            class: 'track-point-dot',
            cx: sx,
            cy: sy,
            r: Math.max(3, Math.min(12, (p.acc || 5) * 0.8))
          });
          trackDotsLayer.appendChild(dot);
        });
      }

      // ── 최단 경로 다익스트라 엔진 ──
      function findShortestPath(startPt, endPt) {
        const nodes = MASTER_DATA.nodes;
        const adj = new Map();
        Object.entries(MASTER_DATA.adj).forEach(([k, list]) => {
          adj.set(parseInt(k), list.map(item => ({ to: item[0], dist: item[1] })));
        });

        let startU = 0, minSD = Infinity;
        let endU = 0, minED = Infinity;
        for (let i = 0; i < nodes.length; i++) {
          const sd = Math.hypot(nodes[i][0] - startPt[0], nodes[i][1] - startPt[1]);
          if (sd < minSD) { minSD = sd; startU = i; }
          const ed = Math.hypot(nodes[i][0] - endPt[0], nodes[i][1] - endPt[1]);
          if (ed < minED) { minED = ed; endU = i; }
        }

        const dist = new Map(), parent = new Map(), visited = new Set();
        dist.set(startU, 0);

        while (true) {
          let u = null, minD = Infinity;
          for (const [node, d] of dist.entries()) {
            if (!visited.has(node) && d < minD) { minD = d; u = node; }
          }
          if (u === null || u === endU) break;
          visited.add(u);

          const neighbors = adj.get(u) || [];
          for (const { to: v, dist: w } of neighbors) {
            if (!visited.has(v)) {
              const newD = minD + w;
              if (newD < (dist.get(v) ?? Infinity)) {
                dist.set(v, newD);
                parent.set(v, u);
              }
            }
          }
        }

        if (startU !== endU && !parent.has(endU)) {
          return [startPt, nodes[startU], nodes[endU], endPt];
        }

        let curr = endU;
        const nodePath = [];
        while (curr !== undefined) {
          nodePath.push(nodes[curr]);
          curr = parent.get(curr);
        }
        nodePath.reverse();
        return [startPt, ...nodePath, endPt];
      }

      // ── 길찾기 테스트 ──
      let testPoints = [];
      function handleTestClick(pos) {
        testPoints.push(pos);
        if (testPoints.length === 1) {
          testRouteLayer.innerHTML = '';
          testPinsLayer.innerHTML = `
            <g transform="translate(${pos[0]},${pos[1]})">
              <circle r="16" fill="#0088ff" stroke="#fff" stroke-width="4"></circle>
              <text y="-24" fill="#fff" font-weight="bold" text-anchor="middle" font-size="14">📍 출발점</text>
            </g>
          `;
          showToast('📍 출발점 지정 완료! 이제 도착점을 클릭하세요.');
        } else if (testPoints.length >= 2) {
          const start = testPoints[0], end = testPoints[1];
          testPinsLayer.innerHTML += `
            <g transform="translate(${end[0]},${end[1]})">
              <circle r="16" fill="#ff3b30" stroke="#fff" stroke-width="4"></circle>
              <text y="-24" fill="#fff" font-weight="bold" text-anchor="middle" font-size="14">🚩 도착점</text>
            </g>
          `;
          const path = findShortestPath(start, end);
          const d = smoothPath(path);
          testRouteLayer.innerHTML = `
            <path class="test-route-line" d="${d}"></path>
            <path class="test-route-overlay" d="${d}"></path>
          `;
          let len = 0;
          for (let i = 0; i < path.length - 1; i++) {
            len += Math.hypot(path[i + 1][0] - path[i][0], path[i + 1][1] - path[i][1]);
          }
          const meters = Math.round(len * 0.22);
          showToast(`✨ 정돈된 마스터 도로망 최단 경로 연결 성공! (약 ${meters}m)`);
          testPoints = [];
        }
      }

      // ── 툴바 이벤트 ──
      function resetToolbarActive() {
        [toolViewMaster, toolTestNav, toolGpsAnchors, toolTrackFitter].forEach(btn => btn.classList.remove('active'));
        testRouteLayer.innerHTML = '';
        testPinsLayer.innerHTML = '';
      }

      toolViewMaster.onclick = () => {
        currentMode = 'view';
        resetToolbarActive();
        toolViewMaster.classList.add('active');
        renderGpsAnchors();
        renderHudForMode();
        showToast('🌐 통합 마스터 도로망 뷰 활성화');
      };

      toolTestNav.onclick = () => {
        currentMode = 'test';
        resetToolbarActive();
        toolTestNav.classList.add('active');
        testPoints = [];
        renderGpsAnchors();
        renderHudForMode();
        showToast('🧪 아무 지점이나 2번 클릭하여 최단 경로를 테스트하세요!');
      };

      toolGpsAnchors.onclick = () => {
        currentMode = 'anchors';
        resetToolbarActive();
        toolGpsAnchors.classList.add('active');
        selectedAnchorIdx = -1;
        renderGpsAnchors();
        renderHudForMode();
        showToast('🛰️ [방법 A] 위성 GPS 앵커 에디터 모드 활성화!');
      };

      toolTrackFitter.onclick = () => {
        currentMode = 'track';
        resetToolbarActive();
        toolTrackFitter.classList.add('active');
        renderGpsAnchors();
        renderTrackDots();
        renderHudForMode();
        showToast('🚶 [방법 B] 걷기 트랙 정합기 활성화!');
      };

      toolToggleNodes.onclick = () => {
        showNodes = !showNodes;
        toolToggleNodes.classList.toggle('active', showNodes);
        renderMasterRoads();
        showToast(showNodes ? '📍 노드 핀 표시 ON' : '📍 노드 핀 표시 OFF');
      };

      btnExport.onclick = () => {
        jsonArea.value = JSON.stringify(MASTER_DATA, null, 2);
        jsonModal.style.display = 'flex';
        jsonArea.select();
      };

      document.getElementById('closeModalBtn').onclick = () => { jsonModal.style.display = 'none'; };
      document.getElementById('btnCopyJson').onclick = () => {
        navigator.clipboard.writeText(jsonArea.value).then(() => showToast('📋 클립보드 복사 완료!'));
      };
      document.getElementById('btnDownloadJson').onclick = () => {
        const blob = new Blob([jsonArea.value], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '포천아트밸리_정돈된_마스터도로망.json';
        a.click();
        showToast('💾 다운로드 완료!');
      };

      // ── 초기화 실행 ──
      renderMasterRoads();
      renderHudForMode();
    })();
  </script>
