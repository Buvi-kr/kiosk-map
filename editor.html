<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포천아트밸리 마스터 도로망 스튜디오 (ROAD MASTER STUDIO)</title>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #101622;
      --panel-border: #1e293b;
      --accent: #00e676;
      --accent-blue: #0088ff;
      --accent-red: #ff3b30;
      --accent-amber: #ff9500;
      --accent-purple: #c084fc;
      --ink: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .studio-app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* ── 상단 툴바 ── */
    .top-header {
      height: 64px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .app-title span {
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tool-group::-webkit-scrollbar {
      display: none;
    }

    .btn-tool {
      padding: 8px 13px;
      border-radius: 12px;
      border: 1px solid #283548;
      background: #182230;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-tool:hover {
      background: #233144;
      border-color: #38bdf8;
      color: #fff;
    }

    .btn-tool.active {
      background: linear-gradient(135deg, #0088ff, #0055ff);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 14px rgba(0, 136, 255, 0.5);
    }

    .btn-tool.test.active {
      background: linear-gradient(135deg, #af52de, #7a1fa2);
      border-color: #e879f9;
      color: #fff;
      box-shadow: 0 0 14px rgba(175, 82, 222, 0.5);
    }

    .btn-action {
      padding: 9px 15px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-export {
      background: linear-gradient(135deg, #00e676, #00a844);
      color: #000;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.4);
    }

    .btn-export:active {
      transform: scale(0.96);
    }

    /* ── 캔버스 뷰포트 영역 ── */
    .viewport {
      flex: 1;
      position: relative;
      background: #040608;
      overflow: hidden;
      cursor: default;
    }

    .viewport.panning {
      cursor: grab;
    }

    .viewport.panning:active {
      cursor: grabbing;
    }

    .map-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
      transform-origin: 0 0;
    }

    #bgImg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
      pointer-events: none;
      user-select: none;
    }

    #mainSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
    }

    /* ── SVG 스타일 ── */
    .road-segment {
      fill: none;
      stroke: #00e676;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.7));
      opacity: 0.85;
      transition: all 0.2s;
    }

    .road-segment:hover {
      stroke: #00f0ff;
      stroke-width: 18;
      filter: drop-shadow(0 0 16px rgba(0, 240, 255, 1));
      opacity: 1;
      cursor: pointer;
    }

    .road-core {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* 노드 앵커 점 */
    .node-pin {
      cursor: move;
      transition: transform 0.15s;
    }

    .node-pin circle.outer {
      fill: #101622;
      stroke: #00f0ff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8));
    }

    .node-pin:hover circle.outer {
      fill: #0088ff;
      transform: scale(1.4);
      stroke: #fff;
    }

    .node-pin text {
      font-size: 11px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 테스트 경로 라인 */
    .test-route-line {
      fill: none;
      stroke: #ff3b30;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 16px rgba(255, 59, 48, 0.9));
      animation: testPulse 1.5s infinite alternate;
    }

    .test-route-overlay {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 20 30;
      animation: dashFlow 1.2s linear infinite;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -50;
      }
    }

    @keyframes testPulse {
      0% { stroke-width: 16; }
      100% { stroke-width: 22; }
    }

    /* ── 플로팅 HUD ── */
    .floating-hud {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(16, 22, 34, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      z-index: 50;
      font-size: 13px;
      max-width: 420px;
    }

    .hud-title {
      font-weight: 800;
      color: #00f0ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .hud-stats-row {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #1f2c3f;
    }

    .stat-badge {
      background: #0d131d;
      border: 1px solid #233348;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    .stat-badge b {
      color: #00e676;
    }

    .hud-desc {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    .hud-desc b {
      color: #fff;
    }

    .floating-zoom {
      position: absolute;
      top: 84px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
    }

    .zoom-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(16, 22, 34, 0.94);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.15s;
    }

    .zoom-btn:hover {
      background: #2563eb;
    }

    /* ── 모달 & 토스트 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: #141c27;
      border: 1px solid #27374d;
      border-radius: 20px;
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #202d3e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 16px;
    }

    .modal-body {
      padding: 16px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .modal-textarea {
      width: 100%;
      height: 280px;
      background: #090e15;
      border: 1px solid #1e2b3c;
      border-radius: 12px;
      color: #38bdf8;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      padding: 12px;
      outline: none;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid #202d3e;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #00f0ff;
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="studio-app">
    <!-- 상단 툴바 -->
    <header class="top-header">
      <div class="app-title">
        <span>📐 ROAD MASTER</span> | 포천아트밸리 통합 마스터 도로망
      </div>

      <div class="tool-group">
        <button class="btn-tool active" id="toolViewMaster">🌐 통합 도로망 보기</button>
        <button class="btn-tool test" id="toolTestNav">🧪 실시간 길찾기 테스트</button>
        <button class="btn-tool active" id="toolToggleNodes">📍 노드 핀 켜기/끄기</button>
        <button class="btn-action btn-export" id="btnExport">💾 마스터 데이터 내보내기</button>
      </div>
    </header>

    <!-- 메인 캔버스 뷰포트 -->
    <main class="viewport" id="viewport">
      <div class="floating-zoom">
        <button class="zoom-btn" id="zoomInBtn" title="확대">➕</button>
        <button class="zoom-btn" id="zoomOutBtn" title="축소">➖</button>
        <button class="zoom-btn" id="zoomResetBtn" title="전체보기">⟲</button>
      </div>

      <div class="floating-hud">
        <div class="hud-title">
          <span id="hudModeName">📐 정돈된 통합 마스터 도로망</span>
          <span style="color:#00e676; font-size:12px;">● 압축율 84% 완료</span>
        </div>
        <div class="hud-stats-row">
          <div class="stat-badge">노드: <b id="statNodes">170개</b></div>
          <div class="stat-badge">도로 구간: <b id="statSegments">29개</b></div>
          <div class="stat-badge">연결성: <b>100% 무결점</b></div>
        </div>
        <div class="hud-desc" id="hudDesc">
          • <b>[🧪 실시간 길찾기 테스트]</b>를 누르고 지도 위 2점을 콕콕 찍어보세요!<br>
          • <b>드래그:</b> 지도 이동 (Pan) | <b>휠:</b> 확대/축소<br>
          • <b>노드 드래그:</b> 교차점 위치 실시간 미세 조정
        </div>
      </div>

      <div class="map-canvas-container" id="mapContainer">
        <!-- 배경 조감도 이미지 -->
        <img id="bgImg" src="아트밸리_전경도_안내_v2.webp" alt="지도 배경" />

        <!-- 마스터 도로망 SVG 레이어 -->
        <svg id="mainSvg" viewBox="0 0 3337 2101">
          <!-- 도로 선 레이어 -->
          <g id="roadLinesLayer"></g>
          <g id="roadCoreLayer"></g>

          <!-- 실시간 테스트 경로 레이어 -->
          <g id="testRouteLayer"></g>
          <g id="testPinsLayer"></g>

          <!-- 노드 조작 핸들 레이어 -->
          <g id="nodesLayer"></g>
        </svg>
      </div>
    </main>

    <!-- 데이터 내보내기 모달 -->
    <div class="modal-overlay" id="jsonModal">
      <div class="modal-card">
        <div class="modal-header">
          <span>💾 완성된 통합 마스터 도로망 데이터 (JSON)</span>
          <button id="closeModalBtn" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size:12px; color:#94a3b8;">
            정돈된 마스터 도로망 데이터입니다. 키오스크(`index.html`)와 모바일(`qr.html`)에 실시간으로 탑재되어 있습니다!
          </p>
          <textarea id="jsonArea" class="modal-textarea" spellcheck="false"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn-tool" id="btnCopyJson">📋 클립보드 복사</button>
          <button class="btn-action btn-export" id="btnDownloadJson">💾 .json 파일 다운로드</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast" id="toastMsg"></div>
  </div>

      function createSvg(tag, attrs = {}, innerHTML = '') {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        if (innerHTML) el.innerHTML = innerHTML;
        return el;

      function smoothPath(pts) {
        if (pts.length < 2) return '';
        if (pts.length === 2) return `M ${pts[0][0]},${pts[0][1]} L ${pts[1][0]},${pts[1][1]}`;
        let d = `M ${pts[0][0]},${pts[0][1]} `;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
          d += `C ${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]} `;

        return d.trim();
      }

        const vw = viewport.clientWidth, vh = viewport.clientHeight;

        if (showNodes) {
          MASTER_DATA.nodes.forEach(([x, y], idx) => {
            const pin = createSvg('g', {
              class: 'node-pin',
              transform: `translate(${x},${y})`
            }, `
              <circle class="outer" r="10"></circle>
              <text y="1">${idx}</text>
            `);

            let isDragging = false;
            pin.addEventListener('pointerdown', (e) => {
              e.stopPropagation();
              isDragging = true;
              const onDrag = (ev) => {
                if (!isDragging) return;
                const pos = getCanvasPos(ev);
                MASTER_DATA.nodes[idx] = pos;
                pin.setAttribute('transform', `translate(${pos[0]},${pos[1]})`);
              };
              const onUp = () => {
                isDragging = false;
                window.removeEventListener('pointermove', onDrag);
                window.removeEventListener('pointerup', onUp);
                renderMasterRoads();
              };
              window.addEventListener('pointermove', onDrag);
              window.addEventListener('pointerup', onUp);
            });

            nodesLayer.appendChild(pin);
          });
        }
      }

      // ── 최단 경로 다익스트라 엔진 ──
      function findShortestPath(startPt, endPt) {
        const nodes = MASTER_DATA.nodes;
        const adj = new Map();
        Object.entries(MASTER_DATA.adj).forEach(([k, list]) => {
          adj.set(parseInt(k), list.map(item => ({ to: item[0], dist: item[1] })));
        });

        let startU = 0, minSD = Infinity;
        let endU = 0, minED = Infinity;
        for (let i = 0; i < nodes.length; i++) {
          const sd = Math.hypot(nodes[i][0] - startPt[0], nodes[i][1] - startPt[1]);
          if (sd < minSD) { minSD = sd; startU = i; }
          const ed = Math.hypot(nodes[i][0] - endPt[0], nodes[i][1] - endPt[1]);
          if (ed < minED) { minED = ed; endU = i; }
        }

        const dist = new Map(), parent = new Map(), visited = new Set();
        dist.set(startU, 0);

        while (true) {
          let u = null, minD = Infinity;
          for (const [node, d] of dist.entries()) {
            if (!visited.has(node) && d < minD) { minD = d; u = node; }
          }
          if (u === null || u === endU) break;
          visited.add(u);

          const neighbors = adj.get(u) || [];
          for (const { to: v, dist: w } of neighbors) {
            if (!visited.has(v)) {
              const newD = minD + w;
              if (newD < (dist.get(v) ?? Infinity)) {
                dist.set(v, newD);
                parent.set(v, u);
              }
            }
          }
        }

        if (startU !== endU && !parent.has(endU)) {
          return [startPt, nodes[startU], nodes[endU], endPt];
        }

        let curr = endU;
        const nodePath = [];
        while (curr !== undefined) {
          nodePath.push(nodes[curr]);
          curr = parent.get(curr);
        }
        nodePath.reverse();
        return [startPt, ...nodePath, endPt];
      }

      // ── 길찾기 테스트 ──
      let testPoints = [];
      function handleTestClick(pos) {
        testPoints.push(pos);
        if (testPoints.length === 1) {
          testRouteLayer.innerHTML = '';
          testPinsLayer.innerHTML = `
            <g transform="translate(${pos[0]},${pos[1]})">
              <circle r="16" fill="#0088ff" stroke="#fff" stroke-width="4"></circle>
              <text y="-24" fill="#fff" font-weight="bold" text-anchor="middle" font-size="14">📍 출발점</text>
            </g>
          `;
          showToast('📍 출발점 지정 완료! 이제 도착점을 클릭하세요.');
        } else if (testPoints.length >= 2) {
          const start = testPoints[0], end = testPoints[1];
          testPinsLayer.innerHTML += `
            <g transform="translate(${end[0]},${end[1]})">
              <circle r="16" fill="#ff3b30" stroke="#fff" stroke-width="4"></circle>
              <text y="-24" fill="#fff" font-weight="bold" text-anchor="middle" font-size="14">🚩 도착점</text>
            </g>
          `;
          const path = findShortestPath(start, end);
          const d = smoothPath(path);
          testRouteLayer.innerHTML = `
            <path class="test-route-line" d="${d}"></path>
            <path class="test-route-overlay" d="${d}"></path>
          `;
          let len = 0;
          for (let i = 0; i < path.length - 1; i++) {
            len += Math.hypot(path[i+1][0] - path[i][0], path[i+1][1] - path[i][1]);
          }
          const meters = Math.round(len * 0.22);
          showToast(`✨ 정돈된 마스터 도로망 최단 경로 연결 성공! (약 ${meters}m)`);
          testPoints = [];
        }
      }

      // ── 툴바 이벤트 ──
      toolViewMaster.onclick = () => {
        currentMode = 'view';
        toolViewMaster.classList.add('active');
        toolTestNav.classList.remove('active');
        testRouteLayer.innerHTML = '';
        testPinsLayer.innerHTML = '';
        hudModeName.textContent = '📐 정돈된 통합 마스터 도로망';
        showToast('🌐 통합 마스터 도로망 뷰 활성화');
      };

      toolTestNav.onclick = () => {
        currentMode = 'test';
        toolTestNav.classList.add('active');
        toolViewMaster.classList.remove('active');
        testPoints = [];
        testRouteLayer.innerHTML = '';
        testPinsLayer.innerHTML = '';
        hudModeName.textContent = '🧪 실시간 길찾기 테스트 모드';
        showToast('🧪 아무 지점이나 2번 클릭하여 최단 경로를 테스트하세요!');
      };

      toolToggleNodes.onclick = () => {
        showNodes = !showNodes;
        toolToggleNodes.classList.toggle('active', showNodes);
        renderMasterRoads();
        showToast(showNodes ? '📍 노드 핀 표시 ON' : '📍 노드 핀 표시 OFF');
      };

      btnExport.onclick = () => {
        jsonArea.value = JSON.stringify(MASTER_DATA, null, 2);
        jsonModal.style.display = 'flex';
        jsonArea.select();
      };

      document.getElementById('closeModalBtn').onclick = () => { jsonModal.style.display = 'none'; };
      document.getElementById('btnCopyJson').onclick = () => {
        navigator.clipboard.writeText(jsonArea.value).then(() => showToast('📋 클립보드 복사 완료!'));
      };
      document.getElementById('btnDownloadJson').onclick = () => {
        const blob = new Blob([jsonArea.value], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '포천아트밸리_정돈된_마스터도로망.json';
        a.click();
        showToast('💾 다운로드 완료!');
      };

      // ── 초기화 실행 ──
      renderMasterRoads();
    })();
  </script>
</body>
