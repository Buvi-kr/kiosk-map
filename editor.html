<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포천아트밸리 차세대 스마트 브러시 도로 스튜디오 (STUDIO)</title>
  <!-- Leaflet GIS Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #101622;
      --panel-border: #1e293b;
      --accent: #00e676;
      --accent-blue: #0088ff;
      --accent-red: #ff3b30;
      --accent-amber: #ff9500;
      --ink: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .studio-app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* ── 상단 툴바 ── */
    .top-header {
      height: 60px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title span {
      background: linear-gradient(135deg, #00f0ff, #00e676);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tool {
      padding: 7px 13px;
      border-radius: 10px;
      border: 1px solid #283548;
      background: #182230;
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-tool:hover {
      background: #233144;
      border-color: #3b82f6;
    }

    .btn-tool.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .btn-action {
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-export {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #06111e;
    }

    /* ── 좌우 1:1 분할 스튜디오 ── */
    .studio-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 좌측: 조감도 뷰포트 */
    .left-viewport-pane {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0b111c;
      cursor: default;
    }

    .left-viewport-pane.panning {
      cursor: grab;
    }

    .left-viewport-pane.drawing {
      cursor: crosshair;
    }

    /* 우측: 실제 위성 지도 */
    .right-satellite-pane {
      width: 50%;
      height: 100%;
      position: relative;
      border-left: 2px solid #1e293b;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .split-divider {
      width: 8px;
      background: #1e293b;
      cursor: col-resize;
      z-index: 50;
      transition: background 0.2s;
    }

    .split-divider:hover,
    .split-divider.dragging {
      background: #00e676;
    }

    .satellite-hud-banner {
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      z-index: 10;
    }

    #leafletMap {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* ── 조감도 캔버스 컨테이너 ── */
    .map-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 3337px;
      height: 2101px;
    }

    #bgImg {
      width: 3337px;
      height: 2101px;
      display: block;
      pointer-events: none;
    }

    #brushCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
      pointer-events: none;
      z-index: 2;
    }

    #mainSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
      z-index: 3;
    }

    /* 생성된 도로망 스타일 */
    .extracted-road-line {
      fill: none;
      stroke: #00e676;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(0, 230, 118, 0.8));
    }

    .extracted-road-core {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .extracted-node-handle {
      cursor: pointer;
    }

    .extracted-node-handle circle.outer {
      fill: #00e676;
      opacity: 0.35;
    }

    .extracted-node-handle circle.core {
      fill: #00e676;
      stroke: #ffffff;
      stroke-width: 2;
    }

    .extracted-node-handle text {
      fill: #ffffff;
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
      text-shadow: 0 2px 4px #000;
      pointer-events: none;
    }

    /* 24대 핵심 앵커 핀 */
    .gps-anchor-pin {
      cursor: grab;
    }

    .gps-anchor-pin .outer {
      fill: #ff9500;
      stroke: #ffffff;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 6px #ff9500);
    }

    .gps-anchor-pin text {
      fill: #ffffff;
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .delaunay-edge {
      fill: none;
      stroke: rgba(255, 149, 0, 0.3);
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
    }

    /* ── 플로팅 컨트롤러 HUD ── */
    .floating-hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 400px;
      background: rgba(16, 22, 34, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 60;
    }

    .hud-title {
      font-size: 14px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .form-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .floating-zoom {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 60;
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(16, 22, 34, 0.9);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 모달 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-card {
      width: 90%;
      max-width: 680px;
      max-height: 85vh;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #00e676;
      color: #00e676;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="studio-app">
    <!-- 상단 툴바 -->
    <header class="top-header">
      <div class="app-title">
        <span>🖌️ 도로 형광펜 브러시 스튜디오</span>
      </div>

      <div class="tool-group">
        <button class="btn-tool active" id="btnToolBrush" style="border-color:#00e676; color:#00e676; background:rgba(0,230,118,0.15);">🖌️ 길 칠하기 (브러시)</button>
        <button class="btn-tool" id="btnToolMovePin" style="border-color:#38bdf8; color:#38bdf8;">📍 핀 이동/미세조정</button>
        <button class="btn-tool" id="btnToolEraser">🧹 지우개</button>
        <button class="btn-tool" id="btnToolPan">✋ 지도 이동 (Pan)</button>
        <button class="btn-tool" id="btnToggleAnchors">📍 24개 앵커 숨김</button>
        <button class="btn-action btn-export" id="btnExportJson">💾 JSON 추출</button>
      </div>
    </header>

    <!-- 스플릿 듀얼 바디 -->
    <div class="studio-body" id="studioBody">
      <!-- 좌측: 조감도 뷰포트 -->
      <main class="left-viewport-pane drawing" id="viewport">
        <div class="floating-zoom">
          <button class="zoom-btn" id="zoomInBtn" title="확대">➕</button>
          <button class="zoom-btn" id="zoomOutBtn" title="축소">➖</button>
          <button class="zoom-btn" id="zoomResetBtn" title="전체보기">⟲</button>
        </div>

        <!-- 플로팅 컨트롤러 패널 -->
        <div class="floating-hud" id="floatingHud">
          <div class="hud-title">
            <span id="hudToolTitle" style="color:#00e676;">🖌️ 형광펜 브러시 모드</span>
            <span id="hudStatus" style="font-size:12px; color:#cbd5e1;">● 드로잉 중</span>
          </div>

          <div style="font-size:12px; color:#cbd5e1; line-height:1.4; margin-bottom:8px;">
            1. 조감도 길 위를 <strong>마우스로 쓱쓱 색칠</strong>하세요 (갈림길/삼거리도 자유롭게 칠하기!)<br>
            2. 상단 <strong>[⚡ 도로망 자동 생성]</strong>을 누르면 1초 만에 위성 지도에 1:1로 착 연결됩니다!<br>
            3. 우측 위성 지도에서 <strong>초록색 핀을 살짝 잡아끌어 위성 길에 미세조정</strong>하면 끝!
          </div>

          <!-- 브러시 굵기 조절 -->
          <div style="background:rgba(255,255,255,0.05); padding:8px 12px; border-radius:8px; display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span style="font-size:12px; font-weight:bold;">🖌️ 브러시 굵기:</span>
            <div style="display:flex; gap:6px;">
              <button class="btn-tool" id="btnSizeSm" style="padding:3px 8px; font-size:11px;">보통 (16px)</button>
              <button class="btn-tool active" id="btnSizeMd" style="padding:3px 8px; font-size:11px;">굵게 (28px)</button>
              <button class="btn-tool" id="btnSizeLg" style="padding:3px 8px; font-size:11px;">광장 (48px)</button>
            </div>
          </div>

          <div class="form-btn-row">
            <button class="btn-tool" id="btnUndoStroke" style="flex:1; border-color:#38bdf8; color:#38bdf8; font-weight:bold;">↩️ 마지막 획 취소 (Ctrl+Z)</button>
            <button class="btn-tool" id="btnClearBrush" style="flex:1; color:#ef4444; border-color:#ef4444;">🗑️ 전체 지우기</button>
          </div>
          <button class="btn-action btn-export" id="btnQuickGenerate" style="width:100%; margin-top:8px; font-weight:800; background:linear-gradient(135deg,#00e676,#059669); color:#0f172a;">⚡ 도로망 즉시 생성 & 동기화</button>
        </div>

        <div class="map-canvas-container" id="mapContainer">
          <img id="bgImg" src="아트밸리_전경도_안내_v2_mobile.webp" alt="지도 배경" />
          
          <!-- 브러시 드로잉용 캔버스 (3337 x 2101) -->
          <canvas id="brushCanvas" width="3337" height="2101"></canvas>

          <svg id="mainSvg" viewBox="0 0 3337 2101">
            <!-- 24대 핵심 앵커 들로네 레이어 -->
            <g id="delaunayLayer"></g>
            <g id="gpsAnchorsLayer"></g>

            <!-- 자동 추출된 도로망 SVG 레이어 -->
            <g id="extractedRoadLinesLayer"></g>
            <g id="extractedRoadNodesLayer"></g>
          </svg>
        </div>
      </main>

      <!-- 좌우 스플릿 구분 바 -->
      <div class="split-divider" id="splitDivider" title="드래그하여 좌우 너비 조절"></div>

      <!-- 우측: 실제 위성 지도 (Leaflet) -->
      <section class="right-satellite-pane" id="rightSatellitePane">
        <div class="satellite-hud-banner">
          <div>🛰️ <strong>실제 위성 지도</strong> — 칠해진 도로 핀을 잡고 끌어 실제 위성 길 위에 미세조정하세요!</div>
          <div id="satCoordDisplay" style="font-family:monospace; font-weight:bold; color:#38bdf8; font-size:12px;">lat: --, lng: --</div>
        </div>
        <div id="leafletMap"></div>
      </section>
    </div>

    <!-- JSON 내보내기 모달 -->
    <div class="modal-backdrop" id="jsonModal">
      <div class="modal-card">
        <div style="font-size:16px; font-weight:800; color:#00e676; margin-bottom:12px;">💾 1:1 완제품 도로망 데이터 추출</div>
        <textarea id="jsonArea" style="flex:1; width:100%; min-height:300px; background:#070a0f; color:#00e676; font-family:monospace; font-size:12px; border:1px solid #1e293b; border-radius:8px; padding:12px; resize:none;" readonly></textarea>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
          <button class="btn-tool" id="closeModalBtn">닫기</button>
          <button class="btn-action btn-export" id="btnCopyJson">📋 JSON 클립보드 복사</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast" id="toastMsg"></div>
  </div>

        { id: 17, svg: [2168, 790], lat: 37.923038, lng: 127.240198 },
        { id: 18, svg: [2160, 650], lat: 37.922856, lng: 127.24067 },
        { id: 19, svg: [2416, 600], lat: 37.922516, lng: 127.240687 },
        { id: 20, svg: [2344, 444], lat: 37.922448, lng: 127.241302 },
        { id: 21, svg: [2220, 950], lat: 37.923258, lng: 127.239815 },
        { id: 22, svg: [1936, 814], lat: 37.923721, lng: 127.240533 },
        { id: 23, svg: [1216, 864], lat: 37.924219, lng: 127.240691 },
        { id: 24, svg: [1560, 1278], lat: 37.92399, lng: 127.239463 },
        { id: 25, svg: [2076, 1474], lat: 37.923308, lng: 127.238104 },
        { id: 26, svg: [1068, 914], lat: 37.924371, lng: 127.240766 },
        { id: 27, svg: [832, 768], lat: 37.924333, lng: 127.240959 },
        { id: 28, svg: [1120, 782], lat: 37.924329, lng: 127.240965 },
        { id: 29, svg: [1036, 730], lat: 37.924219, lng: 127.241222 }
      ];

      const INITIAL_MASTER_POLYLINES = [
        [0, 1, 2],
        [3, 4],
        [4, 5],
        [4, 6],
        [1, 7],
        [8, 9],
        [10, 11],
        [12, 13],
        [5, 14],
        [14, 15],
        [16, 15],
        [16, 17],
        [17, 18],
        [19, 18],
        [20, 19],
        [21, 17],
        [22, 17],
        [22, 23],
        [24, 25],
        [26, 24],
        [27, 26],
        [26, 23],
        [28, 23],
        [29, 27]
      ];

      let generatedRoads = {
        nodes: INITIAL_MASTER_NODES.map(n => ({ ...n })),
        polylines: INITIAL_MASTER_POLYLINES.map(line => line.map(idx => INITIAL_MASTER_NODES[idx]))
      };

      let brushStrokes = []; // 칠해진 브러시 스트로크 목록 [ [ [x,y], ... ], ... ]
      let currentStroke = [];

      let currentMode = 'brush'; // 'brush' | 'eraser' | 'pan'
      let brushRadius = 28; // 16, 28, 48
      let showAnchors = true;

      const viewport = document.getElementById('viewport');
      const mapContainer = document.getElementById('mapContainer');
      const brushCanvas = document.getElementById('brushCanvas');
      const ctx = brushCanvas.getContext('2d');
      const toastMsg = document.getElementById('toastMsg');

      const delaunayLayer = document.getElementById('delaunayLayer');
      const gpsAnchorsLayer = document.getElementById('gpsAnchorsLayer');
      const extractedRoadLinesLayer = document.getElementById('extractedRoadLinesLayer');
      const extractedRoadNodesLayer = document.getElementById('extractedRoadNodesLayer');

      const splitDivider = document.getElementById('splitDivider');
      const rightSatellitePane = document.getElementById('rightSatellitePane');
      const satCoordDisplay = document.getElementById('satCoordDisplay');

      let leafletMap = null;
      let satRoadMarkersGroup = null;
      let satRoadPolylineGroup = null;
      let satAnchorGroup = null;

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 2200);
      }

      function createSvg(tag, attrs = {}, innerHTML = '') {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        if (innerHTML) el.innerHTML = innerHTML;
        return el;
      }

      // ── 3. 조감도 SVG [X, Y] ➔ 실제 위성 GPS [lat, lng] 1:1 삼각망 변환기 ──
      function svgToGps(pos) {
        if (!gpsAnchors || gpsAnchors.length === 0) return [37.9238, 127.2405];
        let sorted = gpsAnchors.map(a => ({
          a,
          dist: Math.hypot(a.svg[0] - pos[0], a.svg[1] - pos[1])
        })).sort((a, b) => a.dist - b.dist);

        if (sorted[0].dist < 1) return [sorted[0].a.lat, sorted[0].a.lng];

        const top3 = sorted.slice(0, 3);
        const w0 = 1 / (Math.pow(top3[0].dist, 2.0) + 1e-4);
        const w1 = 1 / (Math.pow(top3[1].dist, 2.0) + 1e-4);
        const w2 = 1 / (Math.pow(top3[2].dist, 2.0) + 1e-4);
        const totalW = w0 + w1 + w2;

        const lat = (top3[0].a.lat * w0 + top3[1].a.lat * w1 + top3[2].a.lat * w2) / totalW;
        const lng = (top3[0].a.lng * w0 + top3[1].a.lng * w1 + top3[2].a.lng * w2) / totalW;
        return [parseFloat(lat.toFixed(6)), parseFloat(lng.toFixed(6))];
      }

      // ── 실제 위성 GPS [lat, lng] ➔ 조감도 SVG [X, Y] 1:1 역변환기 ──
      function gpsToSvg(lat, lng) {
        if (!gpsAnchors || gpsAnchors.length === 0) return [1668, 1050];
        let sorted = gpsAnchors.map(a => ({
          a,
          dist: Math.hypot((a.lat - lat) * 111000, (a.lng - lng) * 88000)
        })).sort((a, b) => a.dist - b.dist);

        if (sorted[0].dist < 0.5) return [sorted[0].a.svg[0], sorted[0].a.svg[1]];

        const top3 = sorted.slice(0, 3);
        const w0 = 1 / (Math.pow(top3[0].dist, 2.0) + 1e-4);
        const w1 = 1 / (Math.pow(top3[1].dist, 2.0) + 1e-4);
        const w2 = 1 / (Math.pow(top3[2].dist, 2.0) + 1e-4);
        const totalW = w0 + w1 + w2;

        const sx = (top3[0].a.svg[0] * w0 + top3[1].a.svg[0] * w1 + top3[2].a.svg[0] * w2) / totalW;
        const sy = (top3[0].a.svg[1] * w0 + top3[1].a.svg[1] * w1 + top3[2].a.svg[1] * w2) / totalW;
        return [Math.round(sx), Math.round(sy)];
      }

      // ── 4. 우측 Leaflet 위성 지도 초기화 ──
      function initLeafletMap() {
        if (leafletMap) return;
        leafletMap = L.map('leafletMap', { zoomControl: true, attributionControl: false }).setView([37.9235, 127.2395], 17);
        
        // 고해상도 위성 영상 레이어 (ArcGIS World Imagery + VWorld 하이브리드)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: 'Esri World Imagery'
        }).addTo(leafletMap);

        satAnchorGroup = L.layerGroup().addTo(leafletMap);
        satRoadPolylineGroup = L.layerGroup().addTo(leafletMap);
        satRoadMarkersGroup = L.layerGroup().addTo(leafletMap);

        leafletMap.on('mousemove', (e) => {
          satCoordDisplay.textContent = `lat: ${e.latlng.lat.toFixed(6)}, lng: ${e.latlng.lng.toFixed(6)}`;
        });

        setTimeout(() => {
          if (leafletMap) leafletMap.invalidateSize();
        }, 200);

        renderSatelliteAnchors();
      }

      function renderSatelliteAnchors() {
        if (!satAnchorGroup) return;
        satAnchorGroup.clearLayers();
        if (!showAnchors) return;

        gpsAnchors.forEach((a) => {
          const customIcon = L.divIcon({
            className: 'custom-sat-anchor',
            html: `
              <div style="display:flex; flex-direction:column; align-items:center; pointer-events:none;">
                <div style="background:#ff9500; width:16px; height:16px; border-radius:50%; border:2px solid #ffffff; box-shadow:0 0 10px #ff9500;"></div>
                <div style="background:rgba(15,23,42,0.95); color:#ffffff; font-size:10px; font-weight:800; padding:1px 5px; border-radius:3px; border:1px solid #ff9500; white-space:nowrap; margin-top:2px;">
                  ${a.name}
                </div>
              </div>
            `,
            iconSize: [80, 36],
            iconAnchor: [40, 8]
          });
          L.marker([a.lat, a.lng], { icon: customIcon, interactive: false }).addTo(satAnchorGroup);
        });
      }

      function renderLeftAnchors() {
        gpsAnchorsLayer.innerHTML = '';
        delaunayLayer.innerHTML = '';
        if (!showAnchors) return;

        gpsAnchors.forEach((a) => {
          const pin = createSvg('g', { class: 'gps-anchor-pin', style: 'pointer-events:none;', transform: `translate(${a.svg[0]},${a.svg[1]})` }, `
            <circle class="outer" r="11"></circle>
            <circle r="4" fill="#ffffff"></circle>
            <text y="-16">${a.name}</text>
          `);
          gpsAnchorsLayer.appendChild(pin);
        });
      }

      // ── 5. 캔버스 브러시 드로잉 엔진 ──
      function redrawBrushCanvas() {
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        brushStrokes.forEach(stroke => {
          if (stroke.points.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(stroke.points[0][0], stroke.points[0][1]);
          for (let i = 1; i < stroke.points.length; i++) {
            ctx.lineTo(stroke.points[i][0], stroke.points[i][1]);
          }
          if (stroke.isEraser) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = stroke.radius * 2;
            ctx.stroke();
          } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = 'rgba(0, 230, 118, 0.65)';
            ctx.lineWidth = stroke.radius;
            ctx.stroke();
          }
        });
        ctx.globalCompositeOperation = 'source-over';
      }

      // ── 핵심 시작점/끝점 앵커 추출기 (획 1개당 시작점과 끝점 딱 2개만 깔끔하게 핀으로 생성) ──
      function extractKeyEndpoints(pts) {
        if (pts.length < 2) return pts;
        const pStart = pts[0];
        const pEnd = pts[pts.length - 1];
        const lineLen = Math.hypot(pEnd[0] - pStart[0], pEnd[1] - pStart[1]);

        // 곡선이 매우 심하게 휜 경우에만 중간 변곡점 1개 추가, 그 외에는 무조건 [시작점, 끝점] 2개만!
        let maxDev = 0, midIdx = -1;
        for (let i = 1; i < pts.length - 1; i++) {
          const d = Math.abs((pEnd[1] - pStart[1]) * pts[i][0] - (pEnd[0] - pStart[0]) * pts[i][1] + pEnd[0] * pStart[1] - pEnd[1] * pStart[0]) / (lineLen + 1e-6);
          if (d > maxDev) {
            maxDev = d;
            midIdx = i;
          }
        }

        if (maxDev > 120 && midIdx > 0) {
          return [pStart, pts[midIdx], pEnd];
        }
        return [pStart, pEnd];
      }

      // ── 6. 칠해진 형광 브러시로부터 도로망 점진적 누적 생성 (기존 조율된 핀 100% 영구 보존!) ──
      function generateRoadNetworkFromBrush() {
        const positiveStrokes = brushStrokes.filter(s => !s.isEraser && s.points.length >= 2);
        if (positiveStrokes.length === 0) {
          generatedRoads.nodes = [];
          generatedRoads.polylines = [];
          renderExtractedRoads();
          showToast('⚠️ 먼저 조감도 위에 초록색 브러시로 길을 칠해 주세요!');
          return;
        }

        // 기존에 이미 조율된 노드 맵 유지 (ID 기준)
        const oldNodesMap = new Map();
        generatedRoads.nodes.forEach(n => {
          oldNodesMap.set(n.id, n);
        });

        const newPolylines = [];
        const activeNodes = [];
        let maxNodeId = generatedRoads.nodes.reduce((max, n) => Math.max(max, n.id), -1) + 1;

        positiveStrokes.forEach((stroke) => {
          // 이미 이 획에 생성된 노드들이 있다면 기존 조율 상태 그대로 유지
          if (stroke.nodes && stroke.nodes.length >= 2) {
            stroke.nodes.forEach(n => {
              if (!activeNodes.find(an => an.id === n.id)) {
                activeNodes.push(n);
              }
            });
            newPolylines.push(stroke.nodes);
            return;
          }

          // 새로 그은 획에 대해서만 노드 생성
          const keyPts = extractKeyEndpoints(stroke.points);
          if (keyPts.length >= 2) {
            let strokeNodes = [];
            keyPts.forEach(pt => {
              // 이미 존재하는 활성 노드(조율된 노드)와 40px 이내면 그 노드를 그대로 연결!
              let existing = activeNodes.find(n => Math.hypot(n.svg[0] - pt[0], n.svg[1] - pt[1]) < 40);
              if (!existing) {
                const gps = svgToGps(pt);
                existing = {
                  id: maxNodeId++,
                  svg: [pt[0], pt[1]],
                  lat: gps[0],
                  lng: gps[1]
                };
                activeNodes.push(existing);
              }
              strokeNodes.push(existing);
            });
            stroke.nodes = strokeNodes; // 획에 영구 바인딩
            newPolylines.push(strokeNodes);
          }
        });

        generatedRoads.nodes = activeNodes;
        generatedRoads.polylines = newPolylines;

        renderExtractedRoads();
        showToast(`🎯 총 ${generatedRoads.nodes.length}개 핀 유지 및 갱신 완료! (기존 조율된 위치 100% 보존)`);
      }

      // ── 7. 자동 생성된 도로망 좌측 SVG 및 우측 위성 렌더링 (영구 고정 드래그) ──
      function renderExtractedRoads(skipMarkers = false) {
        // 좌측 조감도 렌더링
        extractedRoadLinesLayer.innerHTML = '';
        extractedRoadNodesLayer.innerHTML = '';

        generatedRoads.polylines.forEach((lineNodes) => {
          if (lineNodes.length < 2) return;
          let d = `M ${lineNodes[0].svg[0]},${lineNodes[0].svg[1]}`;
          for (let i = 1; i < lineNodes.length; i++) {
            d += ` L ${lineNodes[i].svg[0]},${lineNodes[i].svg[1]}`;
          }
          extractedRoadLinesLayer.appendChild(createSvg('path', { class: 'extracted-road-line', d }));
          extractedRoadLinesLayer.appendChild(createSvg('path', { class: 'extracted-road-core', d }));
        });

        // 좌측 조감도 노드 핀
        generatedRoads.nodes.forEach((node) => {
          const pin = createSvg('g', { class: 'extracted-node-handle', transform: `translate(${node.svg[0]},${node.svg[1]})` }, `
            <circle class="outer" r="14"></circle>
            <circle class="core" r="6"></circle>
            <text y="4">${node.id}</text>
          `);

          let isDragging = false;
          pin.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            isDragging = true;

            const onDrag = (ev) => {
              if (!isDragging) return;
              const newSvg = getCanvasPos(ev);
              node.svg = newSvg;
              const gps = svgToGps(newSvg);
              node.lat = gps[0];
              node.lng = gps[1];

              pin.setAttribute('transform', `translate(${newSvg[0]},${newSvg[1]})`);
              renderExtractedRoads(true);
            };

            const onUp = () => {
              isDragging = false;
              window.removeEventListener('pointermove', onDrag);
              window.removeEventListener('pointerup', onUp);
              renderExtractedRoads(false);
              showToast(`🎯 #${node.id}번 도로 핀 조감도 위치 이동 완료!`);
            };

            window.addEventListener('pointermove', onDrag);
            window.addEventListener('pointerup', onUp);
          });

          extractedRoadNodesLayer.appendChild(pin);
        });

        // 우측 위성 지도 렌더링 (드래그 시 실시간 영구 고정!)
        if (satRoadPolylineGroup && satRoadMarkersGroup) {
          satRoadPolylineGroup.clearLayers();
          if (!skipMarkers) satRoadMarkersGroup.clearLayers();

          generatedRoads.polylines.forEach((lineNodes) => {
            const latlngs = lineNodes.map(n => [n.lat, n.lng]);
            const poly = L.polyline(latlngs, {
              color: '#00e676',
              weight: 6,
              opacity: 0.9,
              lineCap: 'round',
              lineJoin: 'round'
            });
            satRoadPolylineGroup.addLayer(poly);
          });

          if (!skipMarkers) {
            generatedRoads.nodes.forEach((node) => {
              const roadIcon = L.divIcon({
                className: 'custom-sat-road-pin',
                html: `
                  <div style="display:flex; flex-direction:column; align-items:center; cursor:grab; pointer-events:auto;">
                    <div style="background:#00e676; width:18px; height:18px; border-radius:50%; border:2px solid #ffffff; box-shadow:0 0 12px #00e676;"></div>
                    <div style="background:rgba(15,23,42,0.95); color:#00e676; font-size:11px; font-weight:800; padding:1px 5px; border-radius:3px; border:1px solid #00e676; white-space:nowrap; margin-top:2px; pointer-events:none;">
                      #${node.id}
                    </div>
                  </div>
                `,
                iconSize: [44, 34],
                iconAnchor: [22, 9]
              });

              const marker = L.marker([node.lat, node.lng], {
                icon: roadIcon,
                draggable: true,
                autoPan: true
              });

              marker.on('drag', (e) => {
                const newLatLng = e.target.getLatLng();
                node.lat = parseFloat(newLatLng.lat.toFixed(6));
                node.lng = parseFloat(newLatLng.lng.toFixed(6));

                // 우측 위성 폴리라인만 실시간 업데이트 (좌측 조감도 핀은 조감도 위에 고정 유지!)
                satRoadPolylineGroup.clearLayers();
                generatedRoads.polylines.forEach((lineNodes) => {
                  const latlngs = lineNodes.map(n => [n.lat, n.lng]);
                  const poly = L.polyline(latlngs, {
                    color: '#00e676',
                    weight: 6,
                    opacity: 0.9,
                    lineCap: 'round',
                    lineJoin: 'round'
                  });
                  satRoadPolylineGroup.addLayer(poly);
                });
              });

              marker.on('dragend', (e) => {
                const finalLatLng = e.target.getLatLng();
                node.lat = parseFloat(finalLatLng.lat.toFixed(6));
                node.lng = parseFloat(finalLatLng.lng.toFixed(6));

                showToast(`🎯 #${node.id}번 핀 위성 GPS 위치 [${node.lat}, ${node.lng}] 매핑 완료! (조감도 핀은 제자리 고정)`);
              });

              satRoadMarkersGroup.addLayer(marker);
            });
          }
        }
      }

      // ── 8. 조감도 뷰포트 드로잉 & 팬/줌 조작 ──
      let scale = 0.5, panX = 0, panY = 0;
      let isInteracting = false, startX = 0, startY = 0;
      let isDrawing = false;

      function updateTransform() {
        mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      }

      function getCanvasPos(e) {
        const rect = viewport.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;
        const x = Math.round((clientX - panX) / scale);
        const y = Math.round((clientY - panY) / scale);
        return [Math.max(0, Math.min(CANVAS_W, x)), Math.max(0, Math.min(CANVAS_H, y))];
      }

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const newScale = Math.max(0.15, Math.min(3.5, scale * zoomFactor));
        panX = mouseX - (mouseX - panX) * (newScale / scale);
        panY = mouseY - (mouseY - panY) * (newScale / scale);
        scale = newScale;
        updateTransform();
      }, { passive: false });

      viewport.addEventListener('contextmenu', (e) => e.preventDefault());

      viewport.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.floating-hud') || e.target.closest('.floating-zoom')) return;

        // 마우스 우클릭(2) 또는 휠클릭(1) 또는 Pan 모드일 때는 언제든 즉시 화면 이동!
        if (e.button === 2 || e.button === 1 || currentMode === 'pan') {
          isInteracting = true;
          startX = e.clientX - panX;
          startY = e.clientY - panY;
          viewport.classList.add('panning');
          return;
        }

        // 좌클릭(0)일 때 브러시/지우개 드로잉
        if (e.button === 0 && (currentMode === 'brush' || currentMode === 'eraser')) {
          isDrawing = true;
          const pt = getCanvasPos(e);
          currentStroke = [pt];
          brushStrokes.push({
            points: currentStroke,
            radius: brushRadius,
            isEraser: (currentMode === 'eraser')
          });
          redrawBrushCanvas();
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (isDrawing) {
          const pt = getCanvasPos(e);
          const lastPt = currentStroke[currentStroke.length - 1];
          if (!lastPt || Math.hypot(pt[0] - lastPt[0], pt[1] - lastPt[1]) >= 8) {
            currentStroke.push(pt);
            redrawBrushCanvas();
          }
        } else if (isInteracting) {
          panX = e.clientX - startX;
          panY = e.clientY - startY;
          updateTransform();
        }
      });

      window.addEventListener('pointerup', () => {
        if (isDrawing) {
          isDrawing = false;
          // 실시간으로 도로망 자동 반영
          generateRoadNetworkFromBrush();
        }
        if (isInteracting) {
          isInteracting = false;
          viewport.classList.remove('panning');
        }
      });

      // ── 9. 분할 바 조절 ──
      let isResizing = false;
      splitDivider.addEventListener('mousedown', () => { isResizing = true; splitDivider.classList.add('dragging'); });
      window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const containerWidth = document.getElementById('studioBody').offsetWidth;
        const newRightWidth = containerWidth - e.clientX;
        if (newRightWidth >= 300 && newRightWidth <= containerWidth - 300) {
          rightSatellitePane.style.width = `${newRightWidth}px`;
          if (leafletMap) leafletMap.invalidateSize();
        }
      });
      window.addEventListener('mouseup', () => {
        if (isResizing) { isResizing = false; splitDivider.classList.remove('dragging'); if (leafletMap) leafletMap.invalidateSize(); }
      });

      // ── 10. 상단 툴바 & 컨트롤러 버튼 이벤트 ──
      const btnToolBrush = document.getElementById('btnToolBrush');
      const btnToolEraser = document.getElementById('btnToolEraser');
      const btnToolPan = document.getElementById('btnToolPan');
      const hudToolTitle = document.getElementById('hudToolTitle');

      function setMode(mode) {
        currentMode = mode;
        [btnToolBrush, btnToolEraser, btnToolPan].forEach(b => b.classList.remove('active'));
        const btnToolMovePin = document.getElementById('btnToolMovePin');
        [btnToolBrush, btnToolMovePin, btnToolEraser, btnToolPan].forEach(b => { if (b) b.classList.remove('active'); });
        viewport.classList.remove('drawing', 'panning');

        if (mode === 'brush') {
          btnToolBrush.classList.add('active');
          viewport.classList.add('drawing');
          hudToolTitle.textContent = '🖌️ 형광펜 브러시 모드';
          hudToolTitle.style.color = '#00e676';
          showToast('🖌️ 길 위를 마우스로 쓱쓱 색칠하세요!');
        } else if (mode === 'move') {
          if (btnToolMovePin) btnToolMovePin.classList.add('active');
          hudToolTitle.textContent = '📍 핀 이동/미세조정 모드';
          hudToolTitle.style.color = '#38bdf8';
          showToast('📍 초록색 핀을 마우스로 잡고 살살 끌어다 놓으세요!');
        } else if (mode === 'eraser') {
          btnToolEraser.classList.add('active');
          viewport.classList.add('drawing');
          hudToolTitle.textContent = '🧹 지우개 모드';
          hudToolTitle.style.color = '#ff9500';
          showToast('🧹 잘못 칠한 길을 쓱쓱 지우세요!');
        } else if (mode === 'pan') {
          btnToolPan.classList.add('active');
          viewport.classList.add('panning');
          hudToolTitle.textContent = '✋ 지도 이동 모드';
          hudToolTitle.style.color = '#38bdf8';
          showToast('✋ 지도를 자유롭게 이동/확대하세요!');
        }
      }

      btnToolBrush.onclick = () => setMode('brush');
      document.getElementById('btnToolMovePin').onclick = () => setMode('move');
      btnToolEraser.onclick = () => setMode('eraser');
      btnToolPan.onclick = () => setMode('pan');

      document.getElementById('btnSizeSm').onclick = (e) => {
        brushRadius = 16;
        document.querySelectorAll('#btnSizeSm, #btnSizeMd, #btnSizeLg').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        showToast('🖌️ 브러시 굵기: 보통 (16px)');
      };
      document.getElementById('btnSizeMd').onclick = (e) => {
        brushRadius = 28;
        document.querySelectorAll('#btnSizeSm, #btnSizeMd, #btnSizeLg').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        showToast('🖌️ 브러시 굵기: 굵게 (28px)');
      };
      document.getElementById('btnSizeLg').onclick = (e) => {
        brushRadius = 48;
        document.querySelectorAll('#btnSizeSm, #btnSizeMd, #btnSizeLg').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        showToast('🖌️ 브러시 굵기: 광장 (48px)');
      };

      function undoLastStroke() {
        if (brushStrokes.length > 0) {
          brushStrokes.pop();
          redrawBrushCanvas();
          if (brushStrokes.length > 0) {
            generateRoadNetworkFromBrush();
          } else {
            generatedRoads = { nodes: [], polylines: [] };
            renderExtractedRoads();
          }
          showToast(`↩️ 마지막 1개 획 취소 완료! (남은 획: ${brushStrokes.length}개)`);
        } else {
          showToast('⚠️ 취소할 브러시 획이 없습니다.');
        }
      }

      document.getElementById('btnUndoStroke').onclick = undoLastStroke;

      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          undoLastStroke();
        }
      });

      const btnClearBrush = document.getElementById('btnClearBrush');
      if (btnClearBrush) {
        btnClearBrush.onclick = () => {
          brushStrokes = [];
          redrawBrushCanvas();
          generatedRoads = { nodes: [], polylines: [] };
          renderExtractedRoads();
          showToast('🗑️ 칠한 도로가 전체 초기화되었습니다.');
        };
      }

      const btnGenerateRoads = document.getElementById('btnGenerateRoads');
      if (btnGenerateRoads) btnGenerateRoads.onclick = generateRoadNetworkFromBrush;

      const btnQuickGenerate = document.getElementById('btnQuickGenerate');
      if (btnQuickGenerate) btnQuickGenerate.onclick = generateRoadNetworkFromBrush;

      const btnToggleAnchors = document.getElementById('btnToggleAnchors');
      if (btnToggleAnchors) {
        btnToggleAnchors.onclick = () => {
          showAnchors = !showAnchors;
          btnToggleAnchors.classList.toggle('active', showAnchors);
          btnToggleAnchors.textContent = showAnchors ? '📍 24개 앵커 숨김' : '📍 24개 앵커 표시';
          renderLeftAnchors();
          renderSatelliteAnchors();
          showToast(showAnchors ? '📍 24개 앵커 표시 ON' : '📍 24개 앵커 숨김 OFF');
        };
      }

      const btnExportJson = document.getElementById('btnExportJson');
      if (btnExportJson) {
        btnExportJson.onclick = () => {
          const exportData = {
            total_nodes: generatedRoads.nodes.length,
            nodes: generatedRoads.nodes,
            polylines: generatedRoads.polylines,
            gps_nodes: generatedRoads.nodes.map((pos, idx) => {
              const gps = svgToGps(pos);
              return { id: idx, svg: pos, lat: gps[0], lng: gps[1] };
            })
          };
          document.getElementById('jsonArea').value = JSON.stringify(exportData, null, 2);
          document.getElementById('jsonModal').style.display = 'flex';
        };
      }

      const closeModalBtn = document.getElementById('closeModalBtn');
      if (closeModalBtn) closeModalBtn.onclick = () => { document.getElementById('jsonModal').style.display = 'none'; };

      const btnCopyJson = document.getElementById('btnCopyJson');
      if (btnCopyJson) {
        btnCopyJson.onclick = () => {
          navigator.clipboard.writeText(document.getElementById('jsonArea').value).then(() => {
            showToast('📋 1:1 완제품 도로 데이터가 클립보드에 복사되었습니다!');
          });
        };
      }

      const zoomInBtn = document.getElementById('zoomInBtn');
      if (zoomInBtn) zoomInBtn.onclick = () => { scale = Math.min(3.5, scale * 1.25); updateTransform(); };

      const zoomOutBtn = document.getElementById('zoomOutBtn');
      if (zoomOutBtn) zoomOutBtn.onclick = () => { scale = Math.max(0.15, scale * 0.8); updateTransform(); };

      const zoomResetBtn = document.getElementById('zoomResetBtn');
      if (zoomResetBtn) {
        zoomResetBtn.onclick = () => {
          const vw = viewport.clientWidth, vh = viewport.clientHeight;
          scale = Math.min(vw / CANVAS_W, vh / CANVAS_H) * 0.95;
          panX = (vw - CANVAS_W * scale) / 2;
          panY = (vh - CANVAS_H * scale) / 2;
          updateTransform();
        };
      }

      // ── 초기화 실행 ──
      initLeafletMap();
      renderLeftAnchors();
      redrawBrushCanvas();
      renderExtractedRoads();
    })();
  </script>
</body>

</html>
