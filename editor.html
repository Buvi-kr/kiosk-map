<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포천아트밸리 1:1 도로 직접 매핑 스튜디오 (STUDIO)</title>
  <!-- Leaflet GIS Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #101622;
      --panel-border: #1e293b;
      --accent: #00e676;
      --accent-blue: #0088ff;
      --accent-red: #ff3b30;
      --accent-amber: #ff9500;
      --ink: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .studio-app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* ── 상단 툴바 ── */
    .top-header {
      height: 60px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title span {
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tool {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #283548;
      background: #182230;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-tool:hover {
      background: #233144;
      border-color: #3b82f6;
    }

    .btn-tool.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-export {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #06111e;
    }

    /* ── 좌우 1:1 분할 스튜디오 ── */
    .studio-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 좌측: 조감도 뷰포트 */
    .left-viewport-pane {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0b111c;
      cursor: crosshair;
    }

    .left-viewport-pane.panning {
      cursor: grab;
    }

    /* 우측: 실제 위성 지도 */
    .right-satellite-pane {
      width: 50%;
      height: 100%;
      position: relative;
      border-left: 2px solid #1e293b;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .split-divider {
      width: 8px;
      background: #1e293b;
      cursor: col-resize;
      z-index: 50;
      transition: background 0.2s;
    }

    .split-divider:hover,
    .split-divider.dragging {
      background: #00e676;
    }

    .satellite-hud-banner {
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      z-index: 10;
    }

    #leafletMap {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* ── 조감도 캔버스 SVG ── */
    .map-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 3337px;
      height: 2101px;
    }

    #bgImg {
      width: 3337px;
      height: 2101px;
      display: block;
      pointer-events: none;
    }

    #mainSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
    }

    /* 도로 선 스타일 */
    .drawn-road-line {
      fill: none;
      stroke: #00e676;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(0, 230, 118, 0.7));
    }

    .drawn-road-core {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drawn-road-point {
      cursor: pointer;
    }

    .drawn-road-point text {
      fill: #ffffff;
      font-size: 12px;
      font-weight: 800;
      text-anchor: middle;
      text-shadow: 0 2px 4px #000;
      pointer-events: none;
    }

    /* 24대 핵심 앵커 핀 (주황/노랑) */
    .gps-anchor-pin {
      cursor: grab;
    }

    .gps-anchor-pin .outer {
      fill: #ff9500;
      stroke: #ffffff;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 6px #ff9500);
    }

    .gps-anchor-pin text {
      fill: #ffffff;
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    /* 들로네 삼각망 선 */
    .delaunay-edge {
      fill: none;
      stroke: rgba(255, 149, 0, 0.35);
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
    }

    /* ── 플로팅 컨트롤러 HUD ── */
    .floating-hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 380px;
      background: rgba(16, 22, 34, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 60;
    }

    .hud-title {
      font-size: 14px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: #00e676;
    }

    .form-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .floating-zoom {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 60;
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(16, 22, 34, 0.9);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 모달 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-card {
      width: 90%;
      max-width: 680px;
      max-height: 85vh;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #00e676;
      color: #00e676;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="studio-app">
    <!-- 상단 툴바 -->
    <header class="top-header">
      <div class="app-title">
        <span>🛣️ 1:1 도로 매핑 스튜디오</span> | 포천아트밸리
      </div>

      <div class="tool-group">
        <button class="btn-tool active" id="btnToggleDrawMode">✏️ [1:1 도로 콕콕 찍기 모드]</button>
        <button class="btn-tool" id="btnToggleAnchors">📍 24대 핵심 앵커 (보존됨)</button>
        <button class="btn-action btn-export" id="btnExportJson">💾 신규 도로망 JSON 내보내기</button>
      </div>
    </header>

    <!-- 스플릿 듀얼 바디 -->
    <div class="studio-body" id="studioBody">
      <!-- 좌측: 조감도 뷰포트 -->
      <main class="left-viewport-pane" id="viewport">
        <div class="floating-zoom">
          <button class="zoom-btn" id="zoomInBtn" title="확대">➕</button>
          <button class="zoom-btn" id="zoomOutBtn" title="축소">➖</button>
          <button class="zoom-btn" id="zoomResetBtn" title="전체보기">⟲</button>
        </div>

        <!-- 플로팅 컨트롤러 패널 -->
        <div class="floating-hud" id="floatingHud">
          <div class="hud-title">
            <span id="hudStepTitle">👉 [1단계] 좌측 조감도에서 도로 클릭</span>
            <span id="hudPointCount" style="color:#00e676; font-size:13px;">● 0개 구간</span>
          </div>

          <div id="hudBodyText" style="font-size:12px; color:#94a3b8; line-height:1.4; margin-bottom:10px;">
            1. <strong>좌측 조감도</strong>에서 도로의 <strong>시작점 ➔ 끝점</strong>을 클릭하세요.<br>
            2. 그 다음 <strong>우측 위성 지도</strong>에서도 동일한 실제 위치를 <strong>시작점 ➔ 끝점</strong> 클릭하세요!
          </div>

          <div style="background:rgba(0,230,118,0.08); border:1px solid rgba(0,230,118,0.3); padding:10px; border-radius:8px; margin-bottom:8px;">
            <div style="font-size:11px; color:#94a3b8;">현재 작업 중인 점:</div>
            <div id="hudCurrentCoord" style="font-size:13px; font-weight:bold; color:#00e676; margin-top:2px;">
              조감도: 대기 중... / 위성: 대기 중...
            </div>
          </div>

          <div class="form-btn-row">
            <button class="btn-tool" id="btnUndoLastPoint" style="flex:1;">↩️ 마지막 점 취소</button>
            <button class="btn-tool" id="btnResetAll" style="flex:1; color:#ef4444; border-color:#ef4444;">🗑️ 전체 초기화</button>
          </div>
        </div>

        <div class="map-canvas-container" id="mapContainer">
          <img id="bgImg" src="아트밸리_전경도_안내_v2_mobile.webp" alt="지도 배경" />

          <svg id="mainSvg" viewBox="0 0 3337 2101">
            <!-- 24대 핵심 앵커 들로네 레이어 -->
            <g id="delaunayLayer"></g>
            <g id="gpsAnchorsLayer"></g>

            <!-- 사장님이 직접 콕콕 찍을 신규 도로 레이어 -->
            <g id="newRoadLinesLayer"></g>
            <g id="newRoadNodesLayer"></g>
          </svg>
        </div>
      </main>

      <!-- 좌우 스플릿 구분 바 -->
      <div class="split-divider" id="splitDivider" title="드래그하여 좌우 너비 조절"></div>

      <!-- 우측: 실제 위성 지도 (Leaflet) -->
      <section class="right-satellite-pane" id="rightSatellitePane">
        <div class="satellite-hud-banner">
          <div>🛰️ <strong>실제 위성 지도</strong> — 조감도에 찍은 점과 1:1로 일치하는 실제 위성 도로를 클릭하세요!</div>
          <div id="satCoordDisplay" style="font-family:monospace; font-weight:bold; color:#38bdf8; font-size:12px;">lat: --, lng: --</div>
        </div>
        <div id="leafletMap"></div>
      </section>
    </div>

    <!-- JSON 내보내기 모달 -->
    <div class="modal-backdrop" id="jsonModal">
      <div class="modal-card">
        <div style="font-size:16px; font-weight:800; color:#00e676; margin-bottom:12px;">💾 1:1 신규 도로망 데이터 추출</div>
        <textarea id="jsonArea" style="flex:1; width:100%; min-height:300px; background:#070a0f; color:#00e676; font-family:monospace; font-size:12px; border:1px solid #1e293b; border-radius:8px; padding:12px; resize:none;" readonly></textarea>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
          <button class="btn-tool" id="closeModalBtn">닫기</button>
          <button class="btn-action btn-export" id="btnCopyJson">📋 JSON 클립보드 복사</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    (function () {
      const CANVAS_W = 3337, CANVAS_H = 2101;

      // ── 1. 사장님이 튜닝하신 24대 핵심 GPS 앵커 (100% 온전하게 보존) ──
      const gpsAnchors = [
        { name: '천문과학관(본관)', svg: [189, 296], lat: 37.924800, lng: 127.243378 },
        { name: '산마루공연장(무대)', svg: [316, 519], lat: 37.924888, lng: 127.242634 },
        { name: '산마루매점/천문대진입로', svg: [89, 439], lat: 37.924981, lng: 127.242600 },
        { name: '모노레일 상부승강장(상행)', svg: [661, 649], lat: 37.924569, lng: 127.241788 },
        { name: '모노레일 상부승강장(하행)', svg: [1075, 803], lat: 37.924297, lng: 127.240970 },
        { name: '천주호 수변화장실', svg: [834, 764], lat: 37.924431, lng: 127.241755 },
        { name: '천주호 북단매점', svg: [1041, 728], lat: 37.924175, lng: 127.241397 },
        { name: '호수전망대(천주호전망대)', svg: [1247, 663], lat: 37.923883, lng: 127.241605 },
        { name: '천주호 산마루능선길(윗길)', svg: [1588, 650], lat: 37.923883, lng: 127.240525 },
        { name: '소원의 하늘정원', svg: [2102, 514], lat: 37.923051, lng: 127.240634 },
        { name: '호수공연장(야외무대)', svg: [2366, 429], lat: 37.922469, lng: 127.241083 },
        { name: '호수공연장 진입데크', svg: [2405, 556], lat: 37.922642, lng: 127.240792 },
        { name: '치즈가있는전망카페', svg: [2599, 703], lat: 37.922400, lng: 127.240000 },
        { name: '조각공원 잔디광장', svg: [2057, 937], lat: 37.923456, lng: 127.240079 },
        { name: '조각공원 능선산책로', svg: [1945, 822], lat: 37.923875, lng: 127.240483 },
        { name: '힐링숲 산책로(돌음계단)', svg: [2499, 1034], lat: 37.922572, lng: 127.240264 },
        { name: '숲길 입구 분기점', svg: [2575, 866], lat: 37.922786, lng: 127.240487 },
        { name: '돌문화 홍보전시관/검표소', svg: [2114, 1488], lat: 37.923222, lng: 127.237312 },
        { name: '모노레일 하부탑승장', svg: [2326, 1535], lat: 37.923150, lng: 127.237653 },
        { name: '매표소/메인입구', svg: [2440, 1711], lat: 37.923139, lng: 127.237222 },
        { name: '진입광장 분기삼거리', svg: [2282, 1893], lat: 37.923299, lng: 127.237632 },
        { name: '김광우미술관/리프레쉬카페', svg: [2840, 1740], lat: 37.922347, lng: 127.236960 },
        { name: '포천관광정보센터/청년여행LAB', svg: [3171, 1493], lat: 37.922254, lng: 127.236980 },
        { name: '제1주차장/정문', svg: [3300, 1530], lat: 37.923672, lng: 127.236862 }
      ];

      // ── 2. 신규 1:1 도로 데이터 (Zero-base 시작) ──
      // 각 아이템: { id: 0, svg: [x, y], lat: 37.xxx, lng: 127.xxx }
      let customRoadNodes = [];

      let showAnchors = true;
      let pendingSvgPoint = null; // 좌측에서 찍은 SVG 점 대기

      const viewport = document.getElementById('viewport');
      const mapContainer = document.getElementById('mapContainer');
      const toastMsg = document.getElementById('toastMsg');
      const hudStepTitle = document.getElementById('hudStepTitle');
      const hudPointCount = document.getElementById('hudPointCount');
      const hudCurrentCoord = document.getElementById('hudCurrentCoord');

      const delaunayLayer = document.getElementById('delaunayLayer');
      const gpsAnchorsLayer = document.getElementById('gpsAnchorsLayer');
      const newRoadLinesLayer = document.getElementById('newRoadLinesLayer');
      const newRoadNodesLayer = document.getElementById('newRoadNodesLayer');

      const splitDivider = document.getElementById('splitDivider');
      const rightSatellitePane = document.getElementById('rightSatellitePane');
      const satCoordDisplay = document.getElementById('satCoordDisplay');

      let leafletMap = null;
      let satRoadMarkersGroup = null;
      let satRoadPolylineGroup = null;
      let satAnchorGroup = null;

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 2200);
      }

      function createSvg(tag, attrs = {}, innerHTML = '') {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        if (innerHTML) el.innerHTML = innerHTML;
        return el;
      }

      // ── 3. 우측 Leaflet 위성 지도 초기화 ──
      function initLeafletMap() {
        if (leafletMap) return;
        leafletMap = L.map('leafletMap', { zoomControl: true, attributionControl: false }).setView([37.9235, 127.2395], 17);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(leafletMap);

        satAnchorGroup = L.layerGroup().addTo(leafletMap);
        satRoadPolylineGroup = L.layerGroup().addTo(leafletMap);
        satRoadMarkersGroup = L.layerGroup().addTo(leafletMap);

        // 위성 지도 클릭 시 1:1 GPS 점 등록!
        leafletMap.on('click', (e) => {
          const lat = parseFloat(e.latlng.lat.toFixed(6));
          const lng = parseFloat(e.latlng.lng.toFixed(6));
          satCoordDisplay.textContent = `lat: ${lat}, lng: ${lng}`;

          if (!pendingSvgPoint) {
            showToast('⚠️ 먼저 좌측 조감도에서 대응하는 도로 위치를 클릭해 주세요!');
            return;
          }

          // 1:1 매핑 완료!
          const nodeIdx = customRoadNodes.length;
          customRoadNodes.push({
            id: nodeIdx,
            svg: pendingSvgPoint,
            lat: lat,
            lng: lng
          });

          showToast(`🎉 #${nodeIdx}번 도로 1:1 매칭 완료! [SVG: ${pendingSvgPoint[0]},${pendingSvgPoint[1]}] ➔ [GPS: ${lat}, ${lng}]`);
          pendingSvgPoint = null;
          updateHudUI();
          renderNewRoads();
        });

        renderSatelliteAnchors();
      }

      // 24대 핵심 앵커 렌더링
      function renderSatelliteAnchors() {
        if (!satAnchorGroup) return;
        satAnchorGroup.clearLayers();
        if (!showAnchors) return;

        gpsAnchors.forEach((a) => {
          const customIcon = L.divIcon({
            className: 'custom-sat-anchor',
            html: `
              <div style="display:flex; flex-direction:column; align-items:center; pointer-events:none;">
                <div style="background:#ff9500; width:16px; height:16px; border-radius:50%; border:2px solid #ffffff; box-shadow:0 0 10px #ff9500;"></div>
                <div style="background:rgba(15,23,42,0.9); color:#ffffff; font-size:10px; font-weight:800; padding:1px 5px; border-radius:3px; border:1px solid #ff9500; white-space:nowrap; margin-top:2px;">
                  ${a.name}
                </div>
              </div>
            `,
            iconSize: [80, 36],
            iconAnchor: [40, 8]
          });
          L.marker([a.lat, a.lng], { icon: customIcon, interactive: false }).addTo(satAnchorGroup);
        });
      }

      // ── 4. 좌측 조감도 앵커 & 들로네 렌더링 ──
      function renderLeftAnchors() {
        gpsAnchorsLayer.innerHTML = '';
        delaunayLayer.innerHTML = '';
        if (!showAnchors) return;

        gpsAnchors.forEach((a) => {
          const pin = createSvg('g', { class: 'gps-anchor-pin', transform: `translate(${a.svg[0]},${a.svg[1]})` }, `
            <circle class="outer" r="11"></circle>
            <circle r="4" fill="#ffffff"></circle>
            <text y="-16">${a.name}</text>
          `);
          gpsAnchorsLayer.appendChild(pin);
        });
      }

      // ── 5. 신규 도로 렌더링 (좌측 조감도 & 우측 위성 실시간 동기화) ──
      function renderNewRoads() {
        // 좌측 조감도 렌더링
        newRoadLinesLayer.innerHTML = '';
        newRoadNodesLayer.innerHTML = '';

        if (customRoadNodes.length > 1) {
          let d = `M ${customRoadNodes[0].svg[0]},${customRoadNodes[0].svg[1]}`;
          for (let i = 1; i < customRoadNodes.length; i++) {
            d += ` L ${customRoadNodes[i].svg[0]},${customRoadNodes[i].svg[1]}`;
          }
          newRoadLinesLayer.appendChild(createSvg('path', { class: 'drawn-road-line', d }));
          newRoadLinesLayer.appendChild(createSvg('path', { class: 'drawn-road-core', d }));
        }

        // 임시 대기 점 표시
        if (pendingSvgPoint) {
          const pendingPin = createSvg('g', { transform: `translate(${pendingSvgPoint[0]},${pendingSvgPoint[1]})` }, `
            <circle r="14" fill="#ff3b30" opacity="0.4"></circle>
            <circle r="7" fill="#ff3b30" stroke="#ffffff" stroke-width="2"></circle>
            <text y="-14" fill="#ff3b30" font-size="12" font-weight="bold">우측 위성 클릭 대기중...</text>
          `);
          newRoadNodesLayer.appendChild(pendingPin);
        }

        customRoadNodes.forEach((node, idx) => {
          const pin = createSvg('g', { class: 'drawn-road-point', transform: `translate(${node.svg[0]},${node.svg[1]})` }, `
            <circle r="14" fill="#00e676" opacity="0.35"></circle>
            <circle r="7" fill="#00e676" stroke="#ffffff" stroke-width="2"></circle>
            <text y="4">${idx}</text>
          `);
          newRoadNodesLayer.appendChild(pin);
        });

        // 우측 위성 지도 렌더링
        if (satRoadPolylineGroup && satRoadMarkersGroup) {
          satRoadPolylineGroup.clearLayers();
          satRoadMarkersGroup.clearLayers();

          if (customRoadNodes.length > 1) {
            const latlngs = customRoadNodes.map(n => [n.lat, n.lng]);
            const poly = L.polyline(latlngs, { color: '#00e676', weight: 6, opacity: 0.9 });
            satRoadPolylineGroup.addLayer(poly);
          }

          customRoadNodes.forEach((node, idx) => {
            const marker = L.circleMarker([node.lat, node.lng], {
              radius: 5.5,
              fillColor: '#00e676',
              color: '#ffffff',
              weight: 2,
              fillOpacity: 1
            });
            marker.bindTooltip(`<b>#${idx}번 도로</b><br>SVG: [${node.svg[0]}, ${node.svg[1]}]<br>GPS: ${node.lat}, ${node.lng}`, { direction: 'top' });
            satRoadMarkersGroup.addLayer(marker);
          });
        }
      }

      function updateHudUI() {
        hudPointCount.textContent = `● 총 ${customRoadNodes.length}개 구간`;
        if (pendingSvgPoint) {
          hudStepTitle.textContent = '👉 [2단계] 우측 위성 지도에서 동일 위치 클릭!';
          hudStepTitle.style.color = '#38bdf8';
          hudCurrentCoord.textContent = `조감도: [${pendingSvgPoint[0]}, ${pendingSvgPoint[1]}] ➔ 위성: 대기 중...`;
        } else {
          hudStepTitle.textContent = '👉 [1단계] 좌측 조감도에서 다음 도로 클릭';
          hudStepTitle.style.color = '#00e676';
          hudCurrentCoord.textContent = `조감도: 다음 점 대기 중...`;
        }
      }

      // ── 6. 좌측 뷰포트 조작 (Pan & Zoom) ──
      let scale = 0.5, panX = 0, panY = 0;
      let isPanning = false, startX = 0, startY = 0;
      let hasCanvasMoved = false, dragStartX = 0, dragStartY = 0;

      function updateTransform() {
        mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      }

      function getCanvasPos(e) {
        const rect = viewport.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;
        const x = Math.round((clientX - panX) / scale);
        const y = Math.round((clientY - panY) / scale);
        return [Math.max(0, Math.min(CANVAS_W, x)), Math.max(0, Math.min(CANVAS_H, y))];
      }

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const newScale = Math.max(0.15, Math.min(3.5, scale * zoomFactor));
        panX = mouseX - (mouseX - panX) * (newScale / scale);
        panY = mouseY - (mouseY - panY) * (newScale / scale);
        scale = newScale;
        updateTransform();
      }, { passive: false });

      viewport.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.floating-hud') || e.target.closest('.floating-zoom')) return;
        if (e.button === 0) {
          isPanning = true;
          hasCanvasMoved = false;
          startX = e.clientX - panX;
          startY = e.clientY - panY;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          viewport.classList.add('panning');
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPanning) return;
        if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 5) {
          hasCanvasMoved = true;
        }
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('pointerup', (e) => {
        if (isPanning) {
          isPanning = false;
          viewport.classList.remove('panning');

          // 제자리 클릭 시 조감도 도로 점 찍기!
          if (!hasCanvasMoved && (e.target.id === 'bgImg' || e.target.id === 'mainSvg' || e.target.closest('#mainSvg'))) {
            const pt = getCanvasPos(e);
            pendingSvgPoint = pt;
            showToast(`🎯 조감도 #${customRoadNodes.length}번 도로 점 선택 [${pt[0]}, ${pt[1]}] ➔ 이제 우측 위성 지도를 클릭하세요!`);
            updateHudUI();
            renderNewRoads();
          }
        }
      });

      // ── 7. 분할 바 조절 ──
      let isResizing = false;
      splitDivider.addEventListener('mousedown', () => {
        isResizing = true;
        splitDivider.classList.add('dragging');
      });
      window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const containerWidth = document.getElementById('studioBody').offsetWidth;
        const newRightWidth = containerWidth - e.clientX;
        if (newRightWidth >= 300 && newRightWidth <= containerWidth - 300) {
          rightSatellitePane.style.width = `${newRightWidth}px`;
          if (leafletMap) leafletMap.invalidateSize();
        }
      });
      window.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          splitDivider.classList.remove('dragging');
          if (leafletMap) leafletMap.invalidateSize();
        }
      });

      // ── 8. 버튼 이벤트 ──
      document.getElementById('btnUndoLastPoint').onclick = () => {
        if (pendingSvgPoint) {
          pendingSvgPoint = null;
          showToast('↩️ 조감도 선택 대기 취소');
        } else if (customRoadNodes.length > 0) {
          const popped = customRoadNodes.pop();
          showToast(`↩️ #${popped.id}번 도로 점 취소됨`);
        }
        updateHudUI();
        renderNewRoads();
      };

      document.getElementById('btnResetAll').onclick = () => {
        customRoadNodes = [];
        pendingSvgPoint = null;
        updateHudUI();
        renderNewRoads();
        showToast('🗑️ 모든 도로 점이 초기화되었습니다. 새로 찍으세요!');
      };

      document.getElementById('btnToggleAnchors').onclick = () => {
        showAnchors = !showAnchors;
        document.getElementById('btnToggleAnchors').classList.toggle('active', showAnchors);
        renderLeftAnchors();
        renderSatelliteAnchors();
        showToast(showAnchors ? '📍 24대 핵심 앵커 표시 ON' : '📍 24대 핵심 앵커 숨김 OFF');
      };

      document.getElementById('btnExportJson').onclick = () => {
        const exportData = {
          total: customRoadNodes.length,
          nodes: customRoadNodes.map(n => n.svg),
          gps_nodes: customRoadNodes.map(n => ({ id: n.id, svg: n.svg, lat: n.lat, lng: n.lng })),
          polylines: [customRoadNodes.map(n => n.svg)]
        };
        document.getElementById('jsonArea').value = JSON.stringify(exportData, null, 2);
        document.getElementById('jsonModal').style.display = 'flex';
      };

      document.getElementById('closeModalBtn').onclick = () => {
        document.getElementById('jsonModal').style.display = 'none';
      };

      document.getElementById('btnCopyJson').onclick = () => {
        navigator.clipboard.writeText(document.getElementById('jsonArea').value).then(() => {
          showToast('📋 신규 1:1 도로 데이터가 클립보드에 복사되었습니다!');
        });
      };

      document.getElementById('zoomInBtn').onclick = () => { scale = Math.min(3.5, scale * 1.25); updateTransform(); };
      document.getElementById('zoomOutBtn').onclick = () => { scale = Math.max(0.15, scale * 0.8); updateTransform(); };
      document.getElementById('zoomResetBtn').onclick = () => {
        const vw = viewport.clientWidth, vh = viewport.clientHeight;
        scale = Math.min(vw / CANVAS_W, vh / CANVAS_H) * 0.95;
        panX = (vw - CANVAS_W * scale) / 2;
        panY = (vh - CANVAS_H * scale) / 2;
        updateTransform();
      };

      // ── 초기화 실행 ──
      initLeafletMap();
      renderLeftAnchors();
      updateHudUI();
      renderNewRoads();
    })();
  </script>
</body>

</html>
