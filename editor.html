<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포천아트밸리 마스터 도로망 & 위성 듀얼 캘리브레이터 (STUDIO)</title>
  <!-- Leaflet GIS Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #101622;
      --panel-border: #1e293b;
      --accent: #00e676;
      --accent-blue: #0088ff;
      --accent-red: #ff3b30;
      --accent-amber: #ff9500;
      --accent-purple: #c084fc;
      --ink: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .studio-app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* ── 상단 툴바 ── */
    .top-header {
      height: 64px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .app-title span {
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tool-group::-webkit-scrollbar {
      display: none;
    }

    .btn-tool {
      padding: 8px 13px;
      border-radius: 12px;
      border: 1px solid #283548;
      background: #182230;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-tool:hover {
      background: #233144;
      border-color: #38bdf8;
      color: #fff;
    }

    .btn-tool.active {
      background: linear-gradient(135deg, #0088ff, #0055ff);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 14px rgba(0, 136, 255, 0.5);
    }

    .btn-tool.test.active {
      background: linear-gradient(135deg, #af52de, #7a1fa2);
      border-color: #e879f9;
      color: #fff;
      box-shadow: 0 0 14px rgba(175, 82, 222, 0.5);
    }

    .btn-action {
      padding: 9px 15px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-export {
      background: linear-gradient(135deg, #00e676, #00a844);
      color: #000;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.4);
    }

    .btn-export:active {
      transform: scale(0.96);
    }

    /* ── 스플릿 뷰포트 영역 (좌: 조감도, 우: 실제 위성) ── */
    .studio-body {
      flex: 1;
      display: flex;
      flex-direction: row;
      position: relative;
      overflow: hidden;
      background: #040608;
    }

    .left-viewport-pane {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: default;
    }

    .left-viewport-pane.panning {
      cursor: grab;
    }

    .left-viewport-pane.panning:active {
      cursor: grabbing;
    }

    .split-divider {
      width: 8px;
      background: #1e293b;
      cursor: col-resize;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: background 0.2s;
    }

    .split-divider:hover,
    .split-divider.dragging {
      background: #0088ff;
    }

    .split-divider::after {
      content: '⋮';
      color: #94a3b8;
      font-size: 14px;
      font-weight: bold;
    }

    .right-satellite-pane {
      width: 50%;
      height: 100%;
      position: relative;
      display: none;
      border-left: 1px solid var(--panel-border);
      background: #0b0f19;
      z-index: 20;
    }

    /* 듀얼 모드 활성화 시 */
    .studio-body.dual-mode .left-viewport-pane {
      flex: 1;
    }

    .studio-body.dual-mode .split-divider {
      display: flex;
    }

    .studio-body.dual-mode .right-satellite-pane {
      display: block;
    }

    #leafletMap {
      width: 100%;
      height: 100%;
      background: #0a0d14;
    }

    .satellite-hud-banner {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      background: rgba(16, 22, 34, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 136, 255, 0.4);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 13px;
      color: #e2e8f0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .satellite-hud-banner strong {
      color: #00d2ff;
    }

    .map-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
      transform-origin: 0 0;
    }

    #bgImg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
      pointer-events: none;
      user-select: none;
    }

    #mainSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
    }

    /* ── SVG 스타일 ── */
    .road-segment {
      fill: none;
      stroke: #00e676;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.7));
      opacity: 0.85;
      transition: all 0.2s;
    }

    .road-segment:hover {
      stroke: #00f0ff;
      stroke-width: 18;
      filter: drop-shadow(0 0 16px rgba(0, 240, 255, 1));
      opacity: 1;
      cursor: pointer;
    }

    .road-core {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* 노드 앵커 점 */
    .node-pin {
      cursor: move;
      transition: transform 0.15s;
    }

    .node-pin circle.outer {
      fill: #101622;
      stroke: #00f0ff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8));
    }

    .node-pin:hover circle.outer {
      fill: #0088ff;
      transform: scale(1.4);
      stroke: #fff;
    }

    .node-pin text {
      font-size: 11px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 테스트 경로 라인 */
    .test-route-line {
      fill: none;
      stroke: #ff3b30;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 16px rgba(255, 59, 48, 0.9));
      animation: testPulse 1.5s infinite alternate;
    }

    .test-route-overlay {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 20 30;
      animation: dashFlow 1.2s linear infinite;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -50;
      }
    }

    @keyframes testPulse {
      0% { stroke-width: 16; }
      100% { stroke-width: 22; }
    }

    /* ── GPS 앵커 핀 & 들로네 삼각망 선 ── */
    .gps-anchor-pin {
      cursor: pointer;
      transition: transform 0.15s;
    }

    .gps-anchor-pin circle.outer {
      fill: #ff9500;
      stroke: #ffffff;
      stroke-width: 3;
      filter: drop-shadow(0 0 10px rgba(255, 149, 0, 0.9));
    }

    .gps-anchor-pin:hover circle.outer {
      fill: #ff3b30;
      transform: scale(1.3);
    }

    .gps-anchor-pin text {
      font-size: 13px;
      font-weight: 800;
      fill: #ffffff;
      stroke: #000;
      stroke-width: 3px;
      paint-order: stroke fill;
      pointer-events: none;
    }

    .delaunay-edge {
      fill: rgba(255, 149, 0, 0.04);
      stroke: rgba(255, 149, 0, 0.45);
      stroke-width: 2;
      stroke-dasharray: 6 4;
      pointer-events: none;
    }

    .track-point-dot {
      fill: #00d2ff;
      stroke: rgba(0, 0, 0, 0.5);
      stroke-width: 1;
      pointer-events: none;
    }

    /* ── 플로팅 HUD ── */
    .floating-hud {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(16, 22, 34, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      z-index: 50;
      font-size: 13px;
      max-width: 460px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .form-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
    }

    .form-control {
      background: #090e15;
      border: 1px solid #233348;
      border-radius: 8px;
      padding: 7px 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    .form-control:focus {
      border-color: #38bdf8;
    }

    .form-btn-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .hud-sub-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid #1f2c3f;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hud-title {
      font-weight: 800;
      color: #00f0ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .hud-stats-row {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #1f2c3f;
    }

    .stat-badge {
      background: #0d131d;
      border: 1px solid #233348;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    .stat-badge b {
      color: #00e676;
    }

    .hud-desc {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    .hud-desc b {
      color: #fff;
    }

    .floating-zoom {
      position: absolute;
      top: 84px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
    }

    .zoom-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(16, 22, 34, 0.94);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.15s;
    }

    .zoom-btn:hover {
      background: #2563eb;
    }

    /* ── 모달 & 토스트 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: #141c27;
      border: 1px solid #27374d;
      border-radius: 20px;
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #202d3e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 16px;
    }

    .modal-body {
      padding: 16px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .modal-textarea {
      width: 100%;
      height: 280px;
      background: #090e15;
      border: 1px solid #1e2b3c;
      border-radius: 12px;
      color: #38bdf8;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      padding: 12px;
      outline: none;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid #202d3e;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #00f0ff;
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="studio-app">
    <!-- 상단 툴바 -->
    <header class="top-header">
      <div class="app-title">
        <span>📐 ROAD MASTER</span> | 포천아트밸리 도로 & 위성 듀얼 스튜디오
      </div>

      <div class="tool-group">
        <button class="btn-tool active" id="toolViewMaster">🌐 통합 도로망</button>
        <button class="btn-tool test" id="toolTestNav">🧪 길찾기 테스트</button>
        <button class="btn-tool" id="toolDualMapper" style="border-color:#00d2ff; color:#7dd3fc; background:rgba(0,210,255,0.15); font-weight:800;">🗺️ 위성 1:1 듀얼 매퍼</button>
        <button class="btn-tool" id="toolTrackFitter" style="border-color:#a855f7; color:#e9d5ff;">🚶 걷기 트랙 정합기</button>
        <button class="btn-tool active" id="toolToggleNodes">📍 도로 핀 표시</button>
        <button class="btn-action btn-export" id="btnExport">💾 데이터 내보내기</button>
      </div>
    </header>

    <!-- 스플릿 듀얼 바디 -->
    <div class="studio-body" id="studioBody">
      <!-- 좌측: 우리 조감도 뷰포트 -->
      <main class="left-viewport-pane" id="viewport">
        <div class="floating-zoom">
          <button class="zoom-btn" id="zoomInBtn" title="확대">➕</button>
          <button class="zoom-btn" id="zoomOutBtn" title="축소">➖</button>
          <button class="zoom-btn" id="zoomResetBtn" title="전체보기">⟲</button>
        </div>

        <!-- 플로팅 컨트롤러 패널 -->
        <div class="floating-hud" id="floatingHud">
          <div class="hud-title">
            <span id="hudModeName">📐 정돈된 통합 마스터 도로망</span>
            <span id="hudModeStatus" style="color:#00e676; font-size:12px;">● 무결점 100%</span>
          </div>

          <div id="hudContentArea">
            <!-- 모드별 동적 내용 -->
          </div>
        </div>

        <div class="map-canvas-container" id="mapContainer">
          <!-- 배경 조감도 이미지 -->
          <img id="bgImg" src="아트밸리_전경도_안내_v2_mobile.webp" alt="지도 배경" />

          <!-- 마스터 도로망 & GPS 레이어 -->
          <svg id="mainSvg" viewBox="0 0 3337 2101">
            <!-- 도로 선 레이어 -->
            <g id="roadLinesLayer"></g>
            <g id="roadCoreLayer"></g>

            <!-- 들로네 삼각망 & 실측 트랙 레이어 -->
            <g id="delaunayLayer"></g>
            <g id="trackDotsLayer"></g>

            <!-- 실시간 테스트 경로 레이어 -->
            <g id="testRouteLayer"></g>
            <g id="testPinsLayer"></g>

            <!-- GPS 앵커 레이어 -->
            <g id="gpsAnchorsLayer"></g>

            <!-- 도로망 노드 조작 핸들 레이어 -->
            <g id="nodesLayer"></g>
          </svg>
        </div>
      </main>

      <!-- 좌우 스플릿 구분 바 -->
      <div class="split-divider" id="splitDivider" title="드래그하여 좌우 너비 조절"></div>

      <!-- 우측: 실제 위성 지도 (Leaflet) -->
      <section class="right-satellite-pane" id="rightSatellitePane">
        <div class="satellite-hud-banner">
          <div>🛰️ <strong>실제 위성 지도</strong> — 원하는 지형/건물을 클릭하면 정밀 GPS(위도/경도)가 자동 입력됩니다.</div>
          <div id="satCoordDisplay" style="font-family:monospace; font-weight:bold; color:#38bdf8;">lat: --, lng: --</div>
        </div>
        <div id="leafletMap"></div>
      </section>
    </div>

    <!-- 데이터 내보내기 모달 -->
    <div class="modal-overlay" id="jsonModal">
      <div class="modal-card">
        <div class="modal-header">
          <span>💾 완성된 통합 마스터 도로망 데이터 (JSON)</span>
          <button id="closeModalBtn" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size:12px; color:#94a3b8;">
            정돈된 마스터 도로망 데이터입니다. 키오스크(`index.html`)와 모바일(`qr.html`)에 실시간으로 탑재되어 있습니다!
          </p>
          <textarea id="jsonArea" class="modal-textarea" spellcheck="false"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn-tool" id="btnCopyJson">📋 클립보드 복사</button>
          <button class="btn-action btn-export" id="btnDownloadJson">💾 .json 파일 다운로드</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    (function () {
      const CANVAS_W = 3337, CANVAS_H = 2101;
      let currentMode = 'view'; // 'view' | 'test'

        if (leafletMap) {
          setTimeout(() => leafletMap.invalidateSize(), 200);
          return;
        }
        leafletMap = L.map('leafletMap', { zoomControl: true, attributionControl: false }).setView([37.9238, 127.2405], 17);
        const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(leafletMap);
        L.control.layers({ "🛰️ 고화질 위성 지도": satLayer }, null, { position: 'topright' }).addTo(leafletMap);
        satAnchorMarkersGroup = L.layerGroup().addTo(leafletMap);
        leafletMap.on('click', (e) => {
          const lat = e.latlng.lat.toFixed(6);
          const lng = e.latlng.lng.toFixed(6);
          if (tempSatMarker) {
            tempSatMarker.setLatLng(e.latlng);
          } else {
            tempSatMarker = L.marker(e.latlng, { icon: L.divIcon({ className: 'custom-sat-pin', html: '<div style="background:#ff3b30; width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 10px #ff3b30;"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(leafletMap);
          }
          satCoordDisplay.textContent = `lat: ${lat}, lng: ${lng}`;
          const ancLatInput = document.getElementById('ancLatInput');
          const ancLngInput = document.getElementById('ancLngInput');
          if (ancLatInput && ancLngInput) { ancLatInput.value = lat; ancLngInput.value = lng; }
          showToast(`🛰️ 위성 지도 좌표 캡처! [${lat}, ${lng}]`);
        });
        renderLeafletAnchorMarkers();
      }
      function renderLeafletAnchorMarkers() {
        if (!satAnchorMarkersGroup) return;
        satAnchorMarkersGroup.clearLayers();
        gpsAnchors.forEach((a, idx) => {
          const isSelected = (idx === selectedAnchorIdx);
          const marker = L.circleMarker([a.lat, a.lng], { radius: isSelected ? 9 : 6, fillColor: isSelected ? '#ff3b30' : '#ff9500', color: '#ffffff', weight: 2, opacity: 1, fillOpacity: 0.95 });
          marker.bindTooltip(`<b>${a.name}</b>`, { permanent: false, direction: 'top' });
          marker.on('click', (e) => { L.DomEvent.stopPropagation(e); selectAnchor(idx); });
          satAnchorMarkersGroup.addLayer(marker);
        });
      }
      function initSplitDivider() {
        let isResizing = false;
        splitDivider.addEventListener('mousedown', (e) => { isResizing = true; splitDivider.classList.add('dragging'); document.body.style.cursor = 'col-resize'; });
        window.addEventListener('mousemove', (e) => {
          if (!isResizing) return;
          const containerWidth = studioBody.offsetWidth;
          const newRightWidth = containerWidth - e.clientX;
          const minW = 320, maxW = containerWidth - 320;
          if (newRightWidth >= minW && newRightWidth <= maxW) {
            rightSatellitePane.style.width = `${newRightWidth}px`;
            if (leafletMap) leafletMap.invalidateSize();
          }
        });
        window.addEventListener('mouseup', () => { if (isResizing) { isResizing = false; splitDivider.classList.remove('dragging'); document.body.style.cursor = 'default'; if (leafletMap) leafletMap.invalidateSize(); } });
      }
      initSplitDivider();
      function showToast(msg) { toastMsg.textContent = msg; toastMsg.classList.add('show'); setTimeout(() => toastMsg.classList.remove('show'), 2400); }
      function createSvg(tag, attrs = {}, innerHTML = '') {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        if (innerHTML) el.innerHTML = innerHTML;
        return el;
      }
      let scale = 0.5, panX = 0, panY = 0;
      let isPanning = false, startX = 0, startY = 0;
      function updateTransform() { mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }
      function getCanvasPos(e) {
        const rect = viewport.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;
        const x = Math.round((clientX - panX) / scale);
        const y = Math.round((clientY - panY) / scale);
        return [Math.max(0, Math.min(CANVAS_W, x)), Math.max(0, Math.min(CANVAS_H, y))];
      }
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const newScale = Math.max(0.15, Math.min(3.5, scale * zoomFactor));
        panX = mouseX - (mouseX - panX) * (newScale / scale);
        panY = mouseY - (mouseY - panY) * (newScale / scale);
        scale = newScale;
        updateTransform();
      }, { passive: false });
      viewport.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.floating-hud') || e.target.closest('.floating-zoom')) return;
        if (e.button === 0 && (e.altKey || e.shiftKey || e.button === 1 || currentMode === 'view')) {
          isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY; viewport.classList.add('panning');
        } else if (e.button === 0) {
          const pt = getCanvasPos(e);
          if (currentMode === 'test') { handleTestClick(pt); } else if (currentMode === 'anchors' || currentMode === 'dual') { handleAnchorCanvasClick(pt); }
        }
      });
      window.addEventListener('pointermove', (e) => { if (!isPanning) return; panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); });
      window.addEventListener('pointerup', () => { isPanning = false; viewport.classList.remove('panning'); });
      document.getElementById('zoomInBtn').onclick = () => { scale = Math.min(3.5, scale * 1.25); updateTransform(); };
      document.getElementById('zoomOutBtn').onclick = () => { scale = Math.max(0.15, scale * 0.8); updateTransform(); };
      document.getElementById('zoomResetBtn').onclick = () => {
        const vw = viewport.clientWidth, vh = viewport.clientHeight;
        scale = Math.min(vw / CANVAS_W, vh / CANVAS_H) * 0.95;
        panX = (vw - CANVAS_W * scale) / 2;
        panY = (vh - CANVAS_H * scale) / 2;
        updateTransform();
      };
      function smoothPath(pts) {
        if (!pts || pts.length === 0) return '';
        if (pts.length === 1) return `M ${pts[0][0]},${pts[0][1]}`;
        if (pts.length === 2) return `M ${pts[0][0]},${pts[0][1]} L ${pts[1][0]},${pts[1][1]}`;
        let d = `M ${pts[0][0]},${pts[0][1]}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = i > 0 ? pts[i - 1] : pts[0];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = i < pts.length - 2 ? pts[i + 2] : p2;
          const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
          const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
          const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
          const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0]},${p2[1]}`;
        }
        return d;
      }
      function renderMasterRoads() {
        roadLinesLayer.innerHTML = '';
        roadCoreLayer.innerHTML = '';
        nodesLayer.innerHTML = '';
        MASTER_DATA.polylines.forEach(pts => {
          const d = smoothPath(pts);
          roadLinesLayer.appendChild(createSvg('path', { class: 'road-segment', d }));
          roadCoreLayer.appendChild(createSvg('path', { class: 'road-core', d }));
        });
        if (showNodes) {
          MASTER_DATA.nodes.forEach((pos, idx) => {
            const pin = createSvg('g', { class: 'node-handle', transform: `translate(${pos[0]},${pos[1]})` }, `
              <circle r="14" fill="#00e676" opacity="0.3"></circle>
              <circle r="7" fill="#00e676" stroke="#ffffff" stroke-width="2"></circle>
              <text y="4">${idx}</text>
            `);
            let isDragging = false;
            pin.addEventListener('pointerdown', (e) => {
              e.stopPropagation();
              isDragging = true;
              const onDrag = (ev) => {
                if (!isDragging) return;
                const p = getCanvasPos(ev);
                MASTER_DATA.nodes[idx] = p;
                pin.setAttribute('transform', `translate(${p[0]},${p[1]})`);
              };
              const onUp = () => {
                isDragging = false;
                window.removeEventListener('pointermove', onDrag);
                window.removeEventListener('pointerup', onUp);
                renderMasterRoads();
              };
              window.addEventListener('pointermove', onDrag);
              window.addEventListener('pointerup', onUp);
            });
            nodesLayer.appendChild(pin);
          });
        }
      }
      function buildDelaunayTriangles(pts) {
        if (pts.length < 3) return [];
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        pts.forEach(p => { if (p.lng < minX) minX = p.lng; if (p.lng > maxX) maxX = p.lng; if (p.lat < minY) minY = p.lat; if (p.lat > maxY) maxY = p.lat; });
        const dx = (maxX - minX) || 0.01, dy = (maxY - minY) || 0.01;
        const deltaMax = Math.max(dx, dy) * 50;
        const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
        const stA = { lng: midX - deltaMax, lat: midY - deltaMax, idx: -1 };
        const stB = { lng: midX, lat: midY + deltaMax, idx: -2 };
        const stC = { lng: midX + deltaMax, lat: midY - deltaMax, idx: -3 };
        let triangles = [{ a: stA, b: stB, c: stC }];
        function circumcircle(a, b, c) {
          const ax = a.lng * 88000, ay = a.lat * 111000;
          const bx = b.lng * 88000, by = b.lat * 111000;
          const cx = c.lng * 88000, cy = c.lat * 111000;
          const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
          if (Math.abs(d) < 1e-9) return { x: ax, y: ay, rSq: Infinity };
          const ax2 = ax * ax + ay * ay;
          const bx2 = bx * bx + by * by;
          const cx2 = cx * cx + cy * cy;
          const ox = (ax2 * (by - cy) + bx2 * (cy - ay) + cx2 * (ay - by)) / d;
          const oy = (ax2 * (cx - bx) + bx2 * (ax - cx) + cx2 * (bx - ax)) / d;
          const rSq = (ax - ox) * (ax - ox) + (ay - oy) * (ay - oy);
          return { x: ox, y: oy, rSq };
        }
        pts.forEach((p, pIdx) => {
          const node = { lng: p.lng, lat: p.lat, idx: pIdx };
          const px = p.lng * 88000, py = p.lat * 111000;
          let badTriangles = [];
          triangles.forEach(t => {
            const cc = circumcircle(t.a, t.b, t.c);
            const distSq = (px - cc.x) * (px - cc.x) + (py - cc.y) * (py - cc.y);
            if (distSq <= cc.rSq + 1e-4) badTriangles.push(t);
          });
          let polygon = [];
          badTriangles.forEach(t => {
            const edges = [{ p1: t.a, p2: t.b }, { p1: t.b, p2: t.c }, { p1: t.c, p2: t.a }];
            edges.forEach(edge => {
              let isShared = false;
              badTriangles.forEach(other => {
                if (other === t) return;
                const oEdges = [{ p1: other.a, p2: other.b }, { p1: other.b, p2: other.c }, { p1: other.c, p2: other.a }];
                if (oEdges.some(oe => (oe.p1.idx === edge.p1.idx && oe.p2.idx === edge.p2.idx) || (oe.p1.idx === edge.p2.idx && oe.p2.idx === edge.p1.idx))) isShared = true;
              });
              if (!isShared) polygon.push(edge);
            });
          });
          triangles = triangles.filter(t => !badTriangles.includes(t));
          polygon.forEach(edge => { triangles.push({ a: edge.p1, b: edge.p2, c: node }); });
        });
        return triangles.filter(t => t.a.idx >= 0 && t.b.idx >= 0 && t.c.idx >= 0).map(t => [t.a.idx, t.b.idx, t.c.idx]);
      }
      function renderGpsAnchors() {
        gpsAnchorsLayer.innerHTML = '';
        delaunayLayer.innerHTML = '';
        if (currentMode !== 'anchors' && currentMode !== 'track' && currentMode !== 'dual') return;
        const triangles = buildDelaunayTriangles(gpsAnchors);
        triangles.forEach(([i1, i2, i3]) => {
          const p1 = gpsAnchors[i1].svg, p2 = gpsAnchors[i2].svg, p3 = gpsAnchors[i3].svg;
          const d = `M ${p1[0]},${p1[1]} L ${p2[0]},${p2[1]} L ${p3[0]},${p3[1]} Z`;
          delaunayLayer.appendChild(createSvg('path', { class: 'delaunay-edge', d }));
        });
        gpsAnchors.forEach((a, idx) => {
          const isSelected = (idx === selectedAnchorIdx);
          const pin = createSvg('g', { class: 'gps-anchor-pin', transform: `translate(${a.svg[0]},${a.svg[1]})` }, `
            <circle class="outer" r="${isSelected ? 16 : 11}" style="fill:${isSelected ? '#ff3b30' : '#ff9500'}"></circle>
            <circle r="4" fill="#ffffff"></circle>
            <text y="-18">${a.name}</text>
          `);
          let isDragging = false;
          pin.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            isDragging = true;
            selectAnchor(idx);
            const onDrag = (ev) => { if (!isDragging) return; const pos = getCanvasPos(ev); gpsAnchors[idx].svg = pos; pin.setAttribute('transform', `translate(${pos[0]},${pos[1]})`); };
            const onUp = () => { isDragging = false; window.removeEventListener('pointermove', onDrag); window.removeEventListener('pointerup', onUp); renderGpsAnchors(); };
            window.addEventListener('pointermove', onDrag);
            window.addEventListener('pointerup', onUp);
          });
          gpsAnchorsLayer.appendChild(pin);
        });
        renderLeafletAnchorMarkers();
      }
      function selectAnchor(idx) {
        selectedAnchorIdx = idx;
        const a = gpsAnchors[idx];
        const ancName = document.getElementById('ancNameInput');
        const ancLat = document.getElementById('ancLatInput');
        const ancLng = document.getElementById('ancLngInput');
        const ancSvg = document.getElementById('ancSvgInput');
        const btnDel = document.getElementById('btnDeleteAnchor');
        if (ancName) ancName.value = a.name;
        if (ancLat) ancLat.value = a.lat;
        if (ancLng) ancLng.value = a.lng;
        if (ancSvg) ancSvg.value = `${a.svg[0]}, ${a.svg[1]}`;
        if (btnDel) btnDel.style.display = 'block';
        if (satCoordDisplay) satCoordDisplay.textContent = `lat: ${a.lat}, lng: ${a.lng}`;
        if (leafletMap) { leafletMap.flyTo([a.lat, a.lng], 18, { duration: 0.7 }); }
        showToast(`📍 앵커 선택: ${a.name}`);
        renderGpsAnchors();
      }
      function handleAnchorCanvasClick(pt) {
        const ancSvg = document.getElementById('ancSvgInput');
        if (ancSvg) ancSvg.value = `${pt[0]}, ${pt[1]}`;
        selectedAnchorIdx = -1;
        const btnDel = document.getElementById('btnDeleteAnchor');
        if (btnDel) btnDel.style.display = 'none';
        showToast(`🎯 조감도 좌표 선택 [${pt[0]}, ${pt[1]}] (우측 위성 지도에서도 동일 위치를 클릭하세요)`);
      }
      function renderHudForMode() {
        if (currentMode === 'view') {
          hudModeName.textContent = '📐 정돈된 통합 마스터 도로망';
          hudModeStatus.textContent = '● 무결점 100%';
          hudModeStatus.style.color = '#00e676';
          hudContentArea.innerHTML = `<div class="hud-desc">• 노드 핀을 마우스로 드래그하여 실시간 미세조정할 수 있습니다.</div>`;
        } else if (currentMode === 'dual' || currentMode === 'anchors') {
          hudModeName.textContent = '🗺️ 위성 1:1 듀얼 매퍼';
          hudModeStatus.textContent = `● 총 ${gpsAnchors.length}개 앵커`;
          hudModeStatus.style.color = '#00d2ff';
          hudContentArea.innerHTML = `
            <div class="hud-sub-card">
              <div class="form-input-group"><label class="form-label">🏷️ 앵커 명칭</label><input id="ancNameInput" class="form-control" /></div>
              <div class="form-grid">
                <div class="form-input-group"><label class="form-label">🌐 위도</label><input id="ancLatInput" class="form-control" /></div>
                <div class="form-input-group"><label class="form-label">🌐 경도</label><input id="ancLngInput" class="form-control" /></div>
              </div>
              <div class="form-input-group"><label class="form-label">🎯 조감도 SVG 좌표</label><input id="ancSvgInput" class="form-control" readonly /></div>
              <div class="form-btn-row"><button class="btn-action btn-export" id="btnSaveAnchor" style="flex:2;">🔗 1:1 앵커 등록</button><button class="btn-tool" id="btnDeleteAnchor" style="display:none;">🗑️ 삭제</button></div>
            </div>
            <button class="btn-action btn-export" id="btnAutoMapRoadsToGps" style="width:100%; margin-top:8px;">🚀 도로 핀 전체 GPS 자동 매핑</button>
          `;
          document.getElementById('btnSaveAnchor').onclick = () => {
            const name = document.getElementById('ancNameInput').value;
            const lat = parseFloat(document.getElementById('ancLatInput').value);
            const lng = parseFloat(document.getElementById('ancLngInput').value);
            const [sx, sy] = document.getElementById('ancSvgInput').value.split(',').map(n => parseInt(n));
            if (!name || isNaN(lat)) return showToast('⚠️ 데이터를 입력하세요!');
            if (selectedAnchorIdx >= 0) { gpsAnchors[selectedAnchorIdx] = { name, svg: [sx, sy], lat, lng }; } else { gpsAnchors.push({ name, svg: [sx, sy], lat, lng }); }
            renderGpsAnchors(); showToast('✅ 1:1 매핑 완료!');
          };
          document.getElementById('btnAutoMapRoadsToGps').onclick = () => {
            const roadAnchors = MASTER_DATA.nodes.map((pos, idx) => {
              let sorted = gpsAnchors.map(a => ({ a, dist: Math.hypot(a.svg[0] - pos[0], a.svg[1] - pos[1]) })).sort((a, b) => a.dist - b.dist).slice(0, 3);
              const w0 = 1 / (sorted[0].dist + 1e-4); const w1 = 1 / (sorted[1].dist + 1e-4); const w2 = 1 / (sorted[2].dist + 1e-4);
              return { id: idx, svg: pos, lat: (sorted[0].a.lat * w0 + sorted[1].a.lat * w1 + sorted[2].a.lat * w2) / (w0 + w1 + w2), lng: (sorted[0].a.lng * w0 + sorted[1].a.lng * w1 + sorted[2].a.lng * w2) / (w0 + w1 + w2) };
            });
            jsonArea.value = JSON.stringify(roadAnchors, null, 2); jsonModal.style.display = 'flex';
          };
        }
      }
      function resetToolbarActive() {
        [toolViewMaster, toolTestNav, toolDualMapper, toolTrackFitter].forEach(btn => {
          if (btn) btn.classList.remove('active');
        });
        if (testRouteLayer) testRouteLayer.innerHTML = '';
        if (testPinsLayer) testPinsLayer.innerHTML = '';
        if (studioBody) studioBody.classList.remove('dual-mode');
      }

      toolViewMaster.onclick = () => {
        currentMode = 'view';
        resetToolbarActive();
        toolViewMaster.classList.add('active');
        renderGpsAnchors();
        renderHudForMode();
        showToast('🌐 통합 마스터 도로망 뷰 활성화');
      };

      toolTestNav.onclick = () => {
        currentMode = 'test';
        resetToolbarActive();
        toolTestNav.classList.add('active');
        testPoints = [];
        renderGpsAnchors();
        renderHudForMode();
        showToast('🧪 아무 지점이나 2번 클릭하여 최단 경로를 테스트하세요!');
      };

      toolDualMapper.onclick = () => {
        currentMode = 'dual';
        resetToolbarActive();
        toolDualMapper.classList.add('active');
        studioBody.classList.add('dual-mode');
        selectedAnchorIdx = -1;
        initLeafletMap();
        renderGpsAnchors();
        renderHudForMode();
        showToast('🗺️ [좌: 조감도 | 우: 실제 위성] 1:1 듀얼 매퍼 활성화!');
      };

      toolTrackFitter.onclick = () => {
        currentMode = 'track';
        resetToolbarActive();
        toolTrackFitter.classList.add('active');
        renderGpsAnchors();
        renderTrackDots();
        renderHudForMode();
        showToast('🚶 [방법 B] 걷기 트랙 정합기 활성화!');
      };

      toolToggleNodes.onclick = () => {
        showNodes = !showNodes;
        toolToggleNodes.classList.toggle('active', showNodes);
        renderMasterRoads();
        showToast(showNodes ? '📍 도로 핀 표시 ON' : '📍 도로 핀 표시 OFF');
      };

      btnExport.onclick = () => {
        jsonArea.value = JSON.stringify(MASTER_DATA, null, 2);
        jsonModal.style.display = 'flex';
        jsonArea.select();
      };

      document.getElementById('closeModalBtn').onclick = () => { jsonModal.style.display = 'none'; };
      document.getElementById('btnCopyJson').onclick = () => {
        navigator.clipboard.writeText(jsonArea.value).then(() => showToast('📋 클립보드 복사 완료!'));
      };
      document.getElementById('btnDownloadJson').onclick = () => {
        const blob = new Blob([jsonArea.value], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '포천아트밸리_정돈된_마스터도로망.json';
        a.click();
        showToast('💾 다운로드 완료!');
      };

      // ── 초기화 실행 ──
      renderMasterRoads();
      renderHudForMode();
    })();
  </script>
