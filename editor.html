<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포천아트밸리 1:1 도로 직접 매핑 스튜디오 (STUDIO)</title>
  <!-- Leaflet GIS Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #101622;
      --panel-border: #1e293b;
      --accent: #00e676;
      --accent-blue: #0088ff;
      --accent-red: #ff3b30;
      --accent-amber: #ff9500;
      --ink: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .studio-app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* ── 상단 툴바 ── */
    .top-header {
      height: 60px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title span {
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tool {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #283548;
      background: #182230;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-tool:hover {
      background: #233144;
      border-color: #3b82f6;
    }

    .btn-tool.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-export {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #06111e;
    }

    /* ── 좌우 1:1 분할 스튜디오 ── */
    .studio-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 좌측: 조감도 뷰포트 */
    .left-viewport-pane {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0b111c;
      cursor: crosshair;
    }

    .left-viewport-pane.panning {
      cursor: grab;
    }

    /* 우측: 실제 위성 지도 */
    .right-satellite-pane {
      width: 50%;
      height: 100%;
      position: relative;
      border-left: 2px solid #1e293b;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .split-divider {
      width: 8px;
      background: #1e293b;
      cursor: col-resize;
      z-index: 50;
      transition: background 0.2s;
    }

    .split-divider:hover,
    .split-divider.dragging {
      background: #00e676;
    }

    .satellite-hud-banner {
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      z-index: 10;
    }

    #leafletMap {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* ── 조감도 캔버스 SVG ── */
    .map-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 3337px;
      height: 2101px;
    }

    #bgImg {
      width: 3337px;
      height: 2101px;
      display: block;
      pointer-events: none;
    }

    #mainSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3337px;
      height: 2101px;
    }

    /* 도로 선 스타일 */
    .drawn-road-line {
      fill: none;
      stroke: #00e676;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(0, 230, 118, 0.7));
    }

    .drawn-road-core {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drawn-road-point {
      cursor: pointer;
    }

    .drawn-road-point text {
      fill: #ffffff;
      font-size: 12px;
      font-weight: 800;
      text-anchor: middle;
      text-shadow: 0 2px 4px #000;
      pointer-events: none;
    }

    /* 24대 핵심 앵커 핀 (주황/노랑) */
    .gps-anchor-pin {
      cursor: grab;
    }

    .gps-anchor-pin .outer {
      fill: #ff9500;
      stroke: #ffffff;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 6px #ff9500);
    }

    .gps-anchor-pin text {
      fill: #ffffff;
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    /* 들로네 삼각망 선 */
    .delaunay-edge {
      fill: none;
      stroke: rgba(255, 149, 0, 0.35);
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
    }

    /* ── 플로팅 컨트롤러 HUD ── */
    .floating-hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 380px;
      background: rgba(16, 22, 34, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 60;
    }

    .hud-title {
      font-size: 14px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: #00e676;
    }

    .form-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .floating-zoom {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 60;
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(16, 22, 34, 0.9);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 모달 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-card {
      width: 90%;
      max-width: 680px;
      max-height: 85vh;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #00e676;
      color: #00e676;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="studio-app">
    <!-- 상단 툴바 -->
    <header class="top-header">
      <div class="app-title">
        <span>📍 24개 앵커 조율 & 1:1 도로 스튜디오</span>
      </div>

      <div class="tool-group">
        <button class="btn-tool active" id="btnModeAnchors" style="border-color:#ff9500; color:#ff9500; background:rgba(255,149,0,0.15); font-weight:800;">📍 24개 앵커 정밀 조율</button>
        <button class="btn-tool" id="btnModeRoads" style="border-color:#00e676; color:#00e676;">🛣️ 1:1 도로 콕콕 찍기</button>
        <button class="btn-action btn-export" id="btnCopyAnchorsJson" style="background:linear-gradient(135deg,#ff9500,#ea580c); color:#ffffff; font-weight:800;">📋 24개 앵커 JSON 복사 (QR용)</button>
        <button class="btn-action btn-export" id="btnExportJson">💾 도로망 JSON 내보내기</button>
      </div>
    </header>

    <!-- 스플릿 듀얼 바디 -->
    <div class="studio-body" id="studioBody">
      <!-- 좌측: 조감도 뷰포트 -->
      <main class="left-viewport-pane" id="viewport">
        <div class="floating-zoom">
          <button class="zoom-btn" id="zoomInBtn" title="확대">➕</button>
          <button class="zoom-btn" id="zoomOutBtn" title="축소">➖</button>
          <button class="zoom-btn" id="zoomResetBtn" title="전체보기">⟲</button>
        </div>

        <!-- 플로팅 컨트롤러 패널 -->
        <div class="floating-hud" id="floatingHud">
          <div class="hud-title">
            <span id="hudStepTitle">📍 24대 핵심 GPS 앵커 조율</span>
            <span id="hudPointCount" style="color:#ff9500; font-size:13px;">● 24개 앵커</span>
          </div>

          <div id="hudBodyText" style="font-size:12px; color:#cbd5e1; line-height:1.4; margin-bottom:10px;">
            • <strong>좌측 조감도 주황색 핀</strong> 또는 <strong>우측 위성 지도 핀</strong>을 마우스로 잡고 끌어 원하는 위치로 이동하세요!
          </div>

          <div id="anchorDetailCard" style="background:rgba(255,149,0,0.1); border:1px solid rgba(255,149,0,0.3); padding:10px; border-radius:8px; margin-bottom:8px;">
            <div style="font-size:11px; color:#94a3b8;">선택된 앵커:</div>
            <div id="hudSelectedAnchorName" style="font-size:14px; font-weight:bold; color:#ff9500; margin-top:2px;">
              핀을 클릭하세요
            </div>
            <div id="hudCurrentCoord" style="font-size:11px; color:#cbd5e1; margin-top:4px; font-family:monospace;">
              SVG: -- / GPS: --
            </div>
          </div>

          <div id="roadControlRow" style="display:none;" class="form-btn-row">
            <button class="btn-tool" id="btnUndoLastPoint" style="flex:1;">↩️ 마지막 점 취소</button>
            <button class="btn-tool" id="btnResetAll" style="flex:1; color:#ef4444; border-color:#ef4444;">🗑️ 전체 초기화</button>
          </div>
        </div>

        <div class="map-canvas-container" id="mapContainer">
          <img id="bgImg" src="아트밸리_전경도_안내_v2_mobile.webp" alt="지도 배경" />

          <svg id="mainSvg" viewBox="0 0 3337 2101">
            <!-- 24대 핵심 앵커 들로네 레이어 -->
            <g id="delaunayLayer"></g>
            <g id="gpsAnchorsLayer"></g>

            <!-- 사장님이 직접 콕콕 찍을 신규 도로 레이어 -->
            <g id="newRoadLinesLayer"></g>
            <g id="newRoadNodesLayer"></g>
          </svg>
        </div>
      </main>

      <!-- 좌우 스플릿 구분 바 -->
      <div class="split-divider" id="splitDivider" title="드래그하여 좌우 너비 조절"></div>

      <!-- 우측: 실제 위성 지도 (Leaflet) -->
      <section class="right-satellite-pane" id="rightSatellitePane">
        <div class="satellite-hud-banner">
          <div>🛰️ <strong>실제 위성 지도</strong> — 조감도에 찍은 점과 1:1로 일치하는 실제 위성 도로를 클릭하세요!</div>
          <div id="satCoordDisplay" style="font-family:monospace; font-weight:bold; color:#38bdf8; font-size:12px;">lat: --, lng: --</div>
        </div>
        <div id="leafletMap"></div>
      </section>
    </div>

    <!-- JSON 내보내기 모달 -->
    <div class="modal-backdrop" id="jsonModal">
      <div class="modal-card">
        <div style="font-size:16px; font-weight:800; color:#00e676; margin-bottom:12px;">💾 1:1 신규 도로망 데이터 추출</div>
        <textarea id="jsonArea" style="flex:1; width:100%; min-height:300px; background:#070a0f; color:#00e676; font-family:monospace; font-size:12px; border:1px solid #1e293b; border-radius:8px; padding:12px; resize:none;" readonly></textarea>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
          <button class="btn-tool" id="closeModalBtn">닫기</button>
          <button class="btn-action btn-export" id="btnCopyJson">📋 JSON 클립보드 복사</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    (function () {
      const CANVAS_W = 3337, CANVAS_H = 2101;

      // ── 1. 사장님이 정밀 조율 완료하신 24대 핵심 GPS 앵커 ──
      const gpsAnchors = [
        { name: "천문과학관(본관)", svg: [189, 296], lat: 37.9248, lng: 127.243378 },
        { name: "산마루공연장(무대)", svg: [316, 519], lat: 37.925057, lng: 127.243121 },
        { name: "산마루매점/천문대진입로", svg: [89, 439], lat: 37.924981, lng: 127.2426 },
        { name: "모노레일 상부승강장(상행)", svg: [661, 649], lat: 37.924569, lng: 127.241788 },
        { name: "모노레일 상부승강장(하행)", svg: [1075, 803], lat: 37.924426, lng: 127.241405 },
        { name: "천주호 수변화장실", svg: [834, 764], lat: 37.924333, lng: 127.240959 },
        { name: "천주호 북단매점", svg: [1041, 728], lat: 37.924219, lng: 127.241217 },
        { name: "호수전망대(천주호전망대)", svg: [1247, 663], lat: 37.923889, lng: 127.241512 },
        { name: "천주호 산마루능선길(윗길)", svg: [1588, 650], lat: 37.923533, lng: 127.240992 },
        { name: "소원의 하늘정원", svg: [2102, 514], lat: 37.923165, lng: 127.240777 },
        { name: "호수공연장(야외무대)", svg: [2366, 429], lat: 37.922437, lng: 127.241335 },
        { name: "호수공연장 진입데크", svg: [2405, 556], lat: 37.922522, lng: 127.24068 },
        { name: "치즈가있는전망카페", svg: [2599, 703], lat: 37.922501, lng: 127.239929 },
        { name: "조각공원 잔디광장", svg: [2057, 937], lat: 37.923317, lng: 127.239887 },
        { name: "조각공원 능선산책로", svg: [1945, 822], lat: 37.923724, lng: 127.240536 },
        { name: "힐링숲 산책로(돌음계단)", svg: [2499, 1034], lat: 37.92264, lng: 127.238921 },
        { name: "숲길 입구 분기점", svg: [2575, 866], lat: 37.922695, lng: 127.239887 },
        { name: "돌문화 홍보전시관/검표소", svg: [2114, 1488], lat: 37.923313, lng: 127.238122 },
        { name: "모노레일 하부탑승장", svg: [2326, 1535], lat: 37.92315, lng: 127.237653 },
        { name: "매표소/메인입구", svg: [2440, 1711], lat: 37.923157, lng: 127.237263 },
        { name: "진입광장 분기삼거리", svg: [2170, 1950], lat: 37.923719, lng: 127.236893 },
        { name: "김광우미술관/리프레쉬카페", svg: [2840, 1740], lat: 37.92286, lng: 127.236834 },
        { name: "포천관광정보센터/청년여행LAB", svg: [3171, 1493], lat: 37.922365, lng: 127.236968 },
        { name: "제1주차장/정문", svg: [3300, 1530], lat: 37.922014, lng: 127.236958 }
      ];

      // ── 2. 신규 1:1 도로 데이터 (Zero-base 시작) ──
      // 각 아이템: { id: 0, svg: [x, y], lat: 37.xxx, lng: 127.xxx }
      let customRoadNodes = [];

      let showAnchors = true;
      let pendingSvgPoint = null; // 좌측에서 찍은 SVG 점 대기

      const viewport = document.getElementById('viewport');
      const mapContainer = document.getElementById('mapContainer');
      const toastMsg = document.getElementById('toastMsg');
      const hudStepTitle = document.getElementById('hudStepTitle');
      const hudPointCount = document.getElementById('hudPointCount');
      const hudCurrentCoord = document.getElementById('hudCurrentCoord');

      const delaunayLayer = document.getElementById('delaunayLayer');
      const gpsAnchorsLayer = document.getElementById('gpsAnchorsLayer');
      const newRoadLinesLayer = document.getElementById('newRoadLinesLayer');
      const newRoadNodesLayer = document.getElementById('newRoadNodesLayer');

      const splitDivider = document.getElementById('splitDivider');
      const rightSatellitePane = document.getElementById('rightSatellitePane');
      const satCoordDisplay = document.getElementById('satCoordDisplay');

      let leafletMap = null;
      let satRoadMarkersGroup = null;
      let satRoadPolylineGroup = null;
      let satAnchorGroup = null;

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 2200);
      }

      function createSvg(tag, attrs = {}, innerHTML = '') {
        const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        if (innerHTML) el.innerHTML = innerHTML;
        return el;
      }

      let currentEditorMode = 'anchors'; // 'anchors' (24개 앵커 조율) | 'roads' (도로 콕콕 찍기)
      let selectedAnchorIdx = -1;

      // ── 3. 우측 Leaflet 위성 지도 초기화 ──
      function initLeafletMap() {
        if (leafletMap) return;
        leafletMap = L.map('leafletMap', { zoomControl: true, attributionControl: false }).setView([37.9235, 127.2395], 17);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(leafletMap);

        satAnchorGroup = L.layerGroup().addTo(leafletMap);
        satRoadPolylineGroup = L.layerGroup().addTo(leafletMap);
        satRoadMarkersGroup = L.layerGroup().addTo(leafletMap);

        // 위성 지도 클릭 이벤트
        leafletMap.on('click', (e) => {
          const lat = parseFloat(e.latlng.lat.toFixed(6));
          const lng = parseFloat(e.latlng.lng.toFixed(6));
          satCoordDisplay.textContent = `lat: ${lat}, lng: ${lng}`;

          if (currentEditorMode === 'roads') {
            if (!pendingSvgPoint) {
              showToast('⚠️ 먼저 좌측 조감도에서 대응하는 도로 위치를 클릭해 주세요!');
              return;
            }
            const nodeIdx = customRoadNodes.length;
            customRoadNodes.push({
              id: nodeIdx,
              svg: pendingSvgPoint,
              lat: lat,
              lng: lng
            });
            showToast(`🎉 #${nodeIdx}번 도로 1:1 매칭 완료!`);
            pendingSvgPoint = null;
            updateHudUI();
            renderNewRoads();
          }
        });

        renderSatelliteAnchors();
      }

      // 들로네 삼각망 계산기
      function buildDelaunayTriangles(pts) {
        if (pts.length < 3) return [];
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        pts.forEach(p => { if (p.lng < minX) minX = p.lng; if (p.lng > maxX) maxX = p.lng; if (p.lat < minY) minY = p.lat; if (p.lat > maxY) maxY = p.lat; });
        const dx = (maxX - minX) || 0.01, dy = (maxY - minY) || 0.01;
        const deltaMax = Math.max(dx, dy) * 50;
        const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
        const stA = { lng: midX - deltaMax, lat: midY - deltaMax, idx: -1 };
        const stB = { lng: midX, lat: midY + deltaMax, idx: -2 };
        const stC = { lng: midX + deltaMax, lat: midY - deltaMax, idx: -3 };
        let triangles = [{ a: stA, b: stB, c: stC }];
        function circumcircle(a, b, c) {
          const ax = a.lng * 88000, ay = a.lat * 111000;
          const bx = b.lng * 88000, by = b.lat * 111000;
          const cx = c.lng * 88000, cy = c.lat * 111000;
          const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
          if (Math.abs(d) < 1e-9) return { x: ax, y: ay, rSq: Infinity };
          const ax2 = ax * ax + ay * ay;
          const bx2 = bx * bx + by * by;
          const cx2 = cx * cx + cy * cy;
          const ox = (ax2 * (by - cy) + bx2 * (cy - ay) + cx2 * (ay - by)) / d;
          const oy = (ax2 * (cx - bx) + bx2 * (ax - cx) + cx2 * (bx - ax)) / d;
          const rSq = (ax - ox) * (ax - ox) + (ay - oy) * (ay - oy);
          return { x: ox, y: oy, rSq };
        }
        pts.forEach((p, pIdx) => {
          const node = { lng: p.lng, lat: p.lat, idx: pIdx };
          const px = p.lng * 88000, py = p.lat * 111000;
          let badTriangles = [];
          triangles.forEach(t => {
            const cc = circumcircle(t.a, t.b, t.c);
            const distSq = (px - cc.x) * (px - cc.x) + (py - cc.y) * (py - cc.y);
            if (distSq <= cc.rSq + 1e-4) badTriangles.push(t);
          });
          let polygon = [];
          badTriangles.forEach(t => {
            const edges = [{ p1: t.a, p2: t.b }, { p1: t.b, p2: t.c }, { p1: t.c, p2: t.a }];
            edges.forEach(edge => {
              let isShared = false;
              badTriangles.forEach(other => {
                if (other === t) return;
                const oEdges = [{ p1: other.a, p2: other.b }, { p1: other.b, p2: other.c }, { p1: other.c, p2: other.a }];
                if (oEdges.some(oe => (oe.p1.idx === edge.p1.idx && oe.p2.idx === edge.p2.idx) || (oe.p1.idx === edge.p2.idx && oe.p2.idx === edge.p1.idx))) isShared = true;
              });
              if (!isShared) polygon.push(edge);
            });
          });
          triangles = triangles.filter(t => !badTriangles.includes(t));
          polygon.forEach(edge => { triangles.push({ a: edge.p1, b: edge.p2, c: node }); });
        });
        return triangles.filter(t => t.a.idx >= 0 && t.b.idx >= 0 && t.c.idx >= 0).map(t => [t.a.idx, t.b.idx, t.c.idx]);
      }

      // ── 24대 핵심 앵커 우측 위성 렌더링 (드래그 조율 가능!) ──
      function renderSatelliteAnchors() {
        if (!satAnchorGroup) return;
        satAnchorGroup.clearLayers();
        if (!showAnchors) return;

        gpsAnchors.forEach((a, idx) => {
          const isSelected = (idx === selectedAnchorIdx);
          const pinColor = isSelected ? '#ff3b30' : '#ff9500';

          const customIcon = L.divIcon({
            className: 'custom-sat-anchor',
            html: `
              <div style="display:flex; flex-direction:column; align-items:center; cursor:grab; pointer-events:auto;">
                <div style="background:${pinColor}; width:20px; height:20px; border-radius:50%; border:3px solid #ffffff; box-shadow:0 0 12px ${pinColor};"></div>
                <div style="background:rgba(15,23,42,0.95); color:#ffffff; font-size:11px; font-weight:800; padding:2px 6px; border-radius:4px; border:1px solid ${pinColor}; white-space:nowrap; margin-top:2px; pointer-events:none;">
                  ${a.name}
                </div>
              </div>
            `,
            iconSize: [80, 44],
            iconAnchor: [40, 10]
          });

          const marker = L.marker([a.lat, a.lng], {
            icon: customIcon,
            draggable: true,
            zIndexOffset: isSelected ? 2000 : 1000,
            autoPan: true
          });

          marker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            selectAnchor(idx);
          });

          marker.on('drag', (e) => {
            const newPos = e.target.getLatLng();
            gpsAnchors[idx].lat = parseFloat(newPos.lat.toFixed(6));
            gpsAnchors[idx].lng = parseFloat(newPos.lng.toFixed(6));
            if (satCoordDisplay) satCoordDisplay.textContent = `lat: ${gpsAnchors[idx].lat}, lng: ${gpsAnchors[idx].lng}`;
            renderLeftAnchors();
            updateHudUI();
          });

          marker.on('dragend', () => {
            showToast(`🎯 '${a.name}' 위성 위치 조율 완료! [${gpsAnchors[idx].lat}, ${gpsAnchors[idx].lng}]`);
            renderLeftAnchors();
            renderSatelliteAnchors();
          });

          satAnchorGroup.addLayer(marker);
        });
      }

      // ── 4. 좌측 조감도 앵커 & 들로네 렌더링 (드래그 조율 가능!) ──
      function renderLeftAnchors() {
        gpsAnchorsLayer.innerHTML = '';
        delaunayLayer.innerHTML = '';
        if (!showAnchors) return;

        const triangles = buildDelaunayTriangles(gpsAnchors);
        triangles.forEach(([i1, i2, i3]) => {
          const p1 = gpsAnchors[i1].svg, p2 = gpsAnchors[i2].svg, p3 = gpsAnchors[i3].svg;
          const d = `M ${p1[0]},${p1[1]} L ${p2[0]},${p2[1]} L ${p3[0]},${p3[1]} Z`;
          delaunayLayer.appendChild(createSvg('path', { class: 'delaunay-edge', d }));
        });

        gpsAnchors.forEach((a, idx) => {
          const isSelected = (idx === selectedAnchorIdx);
          const pin = createSvg('g', { class: 'gps-anchor-pin', transform: `translate(${a.svg[0]},${a.svg[1]})` }, `
            <circle class="outer" r="${isSelected ? 15 : 11}" style="fill:${isSelected ? '#ff3b30' : '#ff9500'}"></circle>
            <circle r="4" fill="#ffffff"></circle>
            <text y="-16">${a.name}</text>
          `);

          let isDragging = false;
          pin.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            isDragging = true;
            selectAnchor(idx);

            const onDrag = (ev) => {
              if (!isDragging) return;
              const pos = getCanvasPos(ev);
              gpsAnchors[idx].svg = pos;
              pin.setAttribute('transform', `translate(${pos[0]},${pos[1]})`);
              renderLeftAnchors();
              updateHudUI();
            };

            const onUp = () => {
              isDragging = false;
              window.removeEventListener('pointermove', onDrag);
              window.removeEventListener('pointerup', onUp);
              showToast(`🎯 '${a.name}' 조감도 위치 조율 완료! [${gpsAnchors[idx].svg[0]}, ${gpsAnchors[idx].svg[1]}]`);
              renderLeftAnchors();
            };

            window.addEventListener('pointermove', onDrag);
            window.addEventListener('pointerup', onUp);
          });

          gpsAnchorsLayer.appendChild(pin);
        });
      }

      function selectAnchor(idx) {
        selectedAnchorIdx = idx;
        const a = gpsAnchors[idx];
        if (satCoordDisplay) satCoordDisplay.textContent = `lat: ${a.lat}, lng: ${a.lng}`;
        if (leafletMap) { leafletMap.flyTo([a.lat, a.lng], 18, { duration: 0.6 }); }
        showToast(`📍 앵커 선택: ${a.name}`);
        renderLeftAnchors();
        renderSatelliteAnchors();
        updateHudUI();
      }

      // ── 5. 신규 도로 렌더링 (좌측 조감도 & 우측 위성 실시간 동기화) ──
      function renderNewRoads() {
        // 좌측 조감도 렌더링
        newRoadLinesLayer.innerHTML = '';
        newRoadNodesLayer.innerHTML = '';

        if (customRoadNodes.length > 1) {
          let d = `M ${customRoadNodes[0].svg[0]},${customRoadNodes[0].svg[1]}`;
          for (let i = 1; i < customRoadNodes.length; i++) {
            d += ` L ${customRoadNodes[i].svg[0]},${customRoadNodes[i].svg[1]}`;
          }
          newRoadLinesLayer.appendChild(createSvg('path', { class: 'drawn-road-line', d }));
          newRoadLinesLayer.appendChild(createSvg('path', { class: 'drawn-road-core', d }));
        }

        // 임시 대기 점 표시
        if (pendingSvgPoint) {
          const pendingPin = createSvg('g', { transform: `translate(${pendingSvgPoint[0]},${pendingSvgPoint[1]})` }, `
            <circle r="14" fill="#ff3b30" opacity="0.4"></circle>
            <circle r="7" fill="#ff3b30" stroke="#ffffff" stroke-width="2"></circle>
            <text y="-14" fill="#ff3b30" font-size="12" font-weight="bold">우측 위성 클릭 대기중...</text>
          `);
          newRoadNodesLayer.appendChild(pendingPin);
        }

        customRoadNodes.forEach((node, idx) => {
          const pin = createSvg('g', { class: 'drawn-road-point', transform: `translate(${node.svg[0]},${node.svg[1]})` }, `
            <circle r="14" fill="#00e676" opacity="0.35"></circle>
            <circle r="7" fill="#00e676" stroke="#ffffff" stroke-width="2"></circle>
            <text y="4">${idx}</text>
          `);
          newRoadNodesLayer.appendChild(pin);
        });

        // 우측 위성 지도 렌더링
        if (satRoadPolylineGroup && satRoadMarkersGroup) {
          satRoadPolylineGroup.clearLayers();
          satRoadMarkersGroup.clearLayers();

          if (customRoadNodes.length > 1) {
            const latlngs = customRoadNodes.map(n => [n.lat, n.lng]);
            const poly = L.polyline(latlngs, { color: '#00e676', weight: 6, opacity: 0.9 });
            satRoadPolylineGroup.addLayer(poly);
          }

          customRoadNodes.forEach((node, idx) => {
            const marker = L.circleMarker([node.lat, node.lng], {
              radius: 5.5,
              fillColor: '#00e676',
              color: '#ffffff',
              weight: 2,
              fillOpacity: 1
            });
            marker.bindTooltip(`<b>#${idx}번 도로</b><br>SVG: [${node.svg[0]}, ${node.svg[1]}]<br>GPS: ${node.lat}, ${node.lng}`, { direction: 'top' });
            satRoadMarkersGroup.addLayer(marker);
          });
        }
      }

      function updateHudUI() {
        const anchorDetailCard = document.getElementById('anchorDetailCard');
        const roadControlRow = document.getElementById('roadControlRow');
        const hudSelectedAnchorName = document.getElementById('hudSelectedAnchorName');

        if (currentEditorMode === 'anchors') {
          hudStepTitle.textContent = '📍 24대 핵심 GPS 앵커 조율';
          hudStepTitle.style.color = '#ff9500';
          hudPointCount.textContent = `● 24개 앵커`;
          hudPointCount.style.color = '#ff9500';
          if (anchorDetailCard) anchorDetailCard.style.display = 'block';
          if (roadControlRow) roadControlRow.style.display = 'none';

          if (selectedAnchorIdx >= 0) {
            const a = gpsAnchors[selectedAnchorIdx];
            hudSelectedAnchorName.textContent = `#${selectedAnchorIdx + 1}. ${a.name}`;
            hudCurrentCoord.textContent = `SVG: [${a.svg[0]}, ${a.svg[1]}] | GPS: [${a.lat}, ${a.lng}]`;
          } else {
            hudSelectedAnchorName.textContent = '핀을 클릭하거나 드래그하세요';
            hudCurrentCoord.textContent = 'SVG: -- | GPS: --';
          }
        } else {
          // 'roads' 모드
          if (anchorDetailCard) anchorDetailCard.style.display = 'none';
          if (roadControlRow) roadControlRow.style.display = 'flex';
          hudPointCount.textContent = `● 총 ${customRoadNodes.length}개 구간`;
          hudPointCount.style.color = '#00e676';

          if (pendingSvgPoint) {
            hudStepTitle.textContent = '👉 [2단계] 우측 위성 지도에서 동일 위치 클릭!';
            hudStepTitle.style.color = '#38bdf8';
            hudCurrentCoord.textContent = `조감도: [${pendingSvgPoint[0]}, ${pendingSvgPoint[1]}] ➔ 위성: 대기 중...`;
          } else {
            hudStepTitle.textContent = '👉 [1단계] 좌측 조감도에서 다음 도로 클릭';
            hudStepTitle.style.color = '#00e676';
            hudCurrentCoord.textContent = `조감도: 다음 점 대기 중...`;
          }
        }
      }

      // ── 6. 좌측 뷰포트 조작 (Pan & Zoom) ──
      let scale = 0.5, panX = 0, panY = 0;
      let isPanning = false, startX = 0, startY = 0;
      let hasCanvasMoved = false, dragStartX = 0, dragStartY = 0;

      function updateTransform() {
        mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      }

      function getCanvasPos(e) {
        const rect = viewport.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;
        const x = Math.round((clientX - panX) / scale);
        const y = Math.round((clientY - panY) / scale);
        return [Math.max(0, Math.min(CANVAS_W, x)), Math.max(0, Math.min(CANVAS_H, y))];
      }

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const newScale = Math.max(0.15, Math.min(3.5, scale * zoomFactor));
        panX = mouseX - (mouseX - panX) * (newScale / scale);
        panY = mouseY - (mouseY - panY) * (newScale / scale);
        scale = newScale;
        updateTransform();
      }, { passive: false });

      viewport.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.floating-hud') || e.target.closest('.floating-zoom')) return;
        if (e.target.closest('.gps-anchor-pin')) return; // 앵커 핀 드래그 방해 방지

        if (e.button === 0) {
          isPanning = true;
          hasCanvasMoved = false;
          startX = e.clientX - panX;
          startY = e.clientY - panY;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          viewport.classList.add('panning');
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPanning) return;
        if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 5) {
          hasCanvasMoved = true;
        }
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('pointerup', (e) => {
        if (isPanning) {
          isPanning = false;
          viewport.classList.remove('panning');

          // 도로 모드일 때 제자리 클릭 시 조감도 도로 점 찍기!
          if (currentEditorMode === 'roads' && !hasCanvasMoved && (e.target.id === 'bgImg' || e.target.id === 'mainSvg' || e.target.closest('#mainSvg'))) {
            const pt = getCanvasPos(e);
            pendingSvgPoint = pt;
            showToast(`🎯 조감도 #${customRoadNodes.length}번 도로 점 선택 [${pt[0]}, ${pt[1]}] ➔ 이제 우측 위성 지도를 클릭하세요!`);
            updateHudUI();
            renderNewRoads();
          }
        }
      });

      // ── 7. 분할 바 조절 ──
      let isResizing = false;
      splitDivider.addEventListener('mousedown', () => {
        isResizing = true;
        splitDivider.classList.add('dragging');
      });
      window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const containerWidth = document.getElementById('studioBody').offsetWidth;
        const newRightWidth = containerWidth - e.clientX;
        if (newRightWidth >= 300 && newRightWidth <= containerWidth - 300) {
          rightSatellitePane.style.width = `${newRightWidth}px`;
          if (leafletMap) leafletMap.invalidateSize();
        }
      });
      window.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          splitDivider.classList.remove('dragging');
          if (leafletMap) leafletMap.invalidateSize();
        }
      });

      // ── 8. 모드 전환 및 버튼 이벤트 ──
      const btnModeAnchors = document.getElementById('btnModeAnchors');
      const btnModeRoads = document.getElementById('btnModeRoads');

      btnModeAnchors.onclick = () => {
        currentEditorMode = 'anchors';
        btnModeAnchors.classList.add('active');
        btnModeRoads.classList.remove('active');
        btnModeAnchors.style.background = 'rgba(255,149,0,0.15)';
        btnModeRoads.style.background = 'transparent';
        updateHudUI();
        showToast('📍 [24개 앵커 정밀 조율 모드] 좌/우 지도의 핀을 드래그하세요!');
      };

      btnModeRoads.onclick = () => {
        currentEditorMode = 'roads';
        btnModeRoads.classList.add('active');
        btnModeAnchors.classList.remove('active');
        btnModeRoads.style.background = 'rgba(0,230,118,0.15)';
        btnModeAnchors.style.background = 'transparent';
        updateHudUI();
        showToast('🛣️ [1:1 도로 콕콕 찍기 모드] 조감도를 먼저 클릭하세요!');
      };

      document.getElementById('btnCopyAnchorsJson').onclick = () => {
        const code = JSON.stringify(gpsAnchors, null, 2);
        navigator.clipboard.writeText(code).then(() => {
          showToast(`📋 총 ${gpsAnchors.length}개 GPS 앵커 JSON 복사 완료! (QR에 즉시 적용 가능)`);
        });
        document.getElementById('jsonArea').value = code;
        document.getElementById('jsonModal').style.display = 'flex';
      };

      document.getElementById('btnUndoLastPoint').onclick = () => {
        if (pendingSvgPoint) {
          pendingSvgPoint = null;
          showToast('↩️ 조감도 선택 대기 취소');
        } else if (customRoadNodes.length > 0) {
          const popped = customRoadNodes.pop();
          showToast(`↩️ #${popped.id}번 도로 점 취소됨`);
        }
        updateHudUI();
        renderNewRoads();
      };

      document.getElementById('btnResetAll').onclick = () => {
        customRoadNodes = [];
        pendingSvgPoint = null;
        updateHudUI();
        renderNewRoads();
        showToast('🗑️ 모든 도로 점이 초기화되었습니다. 새로 찍으세요!');
      };

      document.getElementById('btnExportJson').onclick = () => {
        const exportData = {
          total: customRoadNodes.length,
          nodes: customRoadNodes.map(n => n.svg),
          gps_nodes: customRoadNodes.map(n => ({ id: n.id, svg: n.svg, lat: n.lat, lng: n.lng })),
          polylines: [customRoadNodes.map(n => n.svg)]
        };
        document.getElementById('jsonArea').value = JSON.stringify(exportData, null, 2);
        document.getElementById('jsonModal').style.display = 'flex';
      };

      document.getElementById('closeModalBtn').onclick = () => {
        document.getElementById('jsonModal').style.display = 'none';
      };

      document.getElementById('btnCopyJson').onclick = () => {
        navigator.clipboard.writeText(document.getElementById('jsonArea').value).then(() => {
          showToast('📋 신규 1:1 도로 데이터가 클립보드에 복사되었습니다!');
        });
      };

      document.getElementById('zoomInBtn').onclick = () => { scale = Math.min(3.5, scale * 1.25); updateTransform(); };
      document.getElementById('zoomOutBtn').onclick = () => { scale = Math.max(0.15, scale * 0.8); updateTransform(); };
      document.getElementById('zoomResetBtn').onclick = () => {
        const vw = viewport.clientWidth, vh = viewport.clientHeight;
        scale = Math.min(vw / CANVAS_W, vh / CANVAS_H) * 0.95;
        panX = (vw - CANVAS_W * scale) / 2;
        panY = (vh - CANVAS_H * scale) / 2;
        updateTransform();
      };

      // ── 초기화 실행 ──
      initLeafletMap();
      renderLeftAnchors();
      updateHudUI();
      renderNewRoads();
    })();
  </script>
</body>

</html>
